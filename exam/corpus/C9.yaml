    from enum import Enum


    class JobState(str, Enum):
        QUEUED = "queued"
        RUNNING = "running"
        DONE = "done"
        FAILED = "failed"


    FINAL_STATES = frozenset({JobState.DONE, JobState.FAILED})
    ACTIVE_STATES = frozenset({JobState.QUEUED, JobState.RUNNING})
    ### file: app/services/job_cleanup.py
    from datetime import datetime, timedelta

    from app.shipping.states import ACTIVE_STATES, FINAL_STATES, JobState


    def can_remove(job) -> bool:
        return job.state in FINAL_STATES and job.finished_at is not None


    def stale_active_jobs(jobs, now: datetime, limit: timedelta):
        return [
            job
            for job in jobs
            if job.state in ACTIVE_STATES and now - job.started_at > limit
        ]


    def mark_stale_failed(jobs, now: datetime, limit: timedelta) -> int:
        count = 0
        for job in stale_active_jobs(jobs, now, limit):
            job.state = JobState.FAILED
            job.finished_at = now
            count += 1
        return count
