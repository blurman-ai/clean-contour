    import { describe, expect, it } from "vitest";

    import type { ShipmentStatus } from "@/shared/api/model/shipments";
    import { STATUS_LABELS, statusLabel } from "./statusLabels";

    const ALL_STATUSES: ShipmentStatus[] = [
      "created",
      "packed",
      "in_transit",
      "delivered",
      "returned",
    ];

    describe("statusLabel", () => {
      it.each(ALL_STATUSES)("returns a label for %s", status => {
        expect(statusLabel(status).length).toBeGreaterThan(0);
      });

      it("leaves no status without a label", () => {
        expect(Object.keys(STATUS_LABELS).sort()).toEqual([...ALL_STATUSES].sort());
      });
    });
