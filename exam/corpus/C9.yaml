    import type { ShipmentSummary } from "@/shared/api/model/shipments";

    export type ListStatus = "created" | "packed" | "in_transit" | "delivered";

    export type StatusFilter = ListStatus | "all";

    export function matchesFilter(
      shipment: ShipmentSummary,
      filter: StatusFilter,
    ): boolean {
      if (filter === "all") return true;
      return shipment.status === filter;
    }

    export function countByStatus(
      shipments: ShipmentSummary[],
      status: ListStatus,
    ): number {
      return shipments.filter(s => s.status === status).length;
    }
