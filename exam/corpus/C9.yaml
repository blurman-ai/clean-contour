    ### file: app/errors.py
    from enum import Enum

    PUBLIC_ERROR_CODES = frozenset(
        {
            "address_not_found",
            "slot_unavailable",
            "weight_limit_exceeded",
            "payment_declined",
            "tariff_expired",
            "pickup_point_closed",
        }
    )


    class ApiError(Exception):
        def __init__(self, code: str, status_code: int = 400) -> None:
            if code not in PUBLIC_ERROR_CODES:
                raise ValueError(f"unknown public code {code}")
            super().__init__(code)
            self.code = code
            self.status_code = status_code
    ### file: src/shared/api/lib/apiError.ts
    const KNOWN_CODES = new Set([
      "address_not_found",
      "slot_unavailable",
      "weight_limit_exceeded",
      "payment_declined",
      "tariff_expired",
    ]);

    export function isKnownErrorCode(code: unknown): code is string {
      return typeof code === "string" && KNOWN_CODES.has(code);
    }

    export function errorMessageFor(code: string): string {
      return isKnownErrorCode(code)
        ? `errors.${code}`
        : "errors.unknown";
    }
