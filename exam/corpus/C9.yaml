  code: |
    ### file: app/api/shipments.py
    from fastapi import APIRouter, HTTPException

    router = APIRouter()

    _PACK_KINDS = {"box", "envelope", "pallet"}


    @router.post("/shipments/quote")
    async def quote(payload: QuoteRequest) -> QuoteResponse:
        if payload.pack_kind not in _PACK_KINDS:
            raise HTTPException(status_code=422, detail="pack_kind_unknown")
        price = await calculate_price(
            pack_kind=payload.pack_kind,
            weight_kg=payload.weight_kg,
            destination=payload.destination,
        )
        return QuoteResponse(price_kopecks=price)
    ### file: app/services/pricing.py
    PACK_KINDS = ("box", "envelope", "pallet", "crate")

    BASE_PRICE = {"box": 300, "envelope": 150, "pallet": 2500, "crate": 1800}


    async def calculate_price(*, pack_kind: str, weight_kg: float, destination) -> int:
        if pack_kind not in PACK_KINDS:
            raise ValueError(pack_kind)
        zone = await zone_for(destination)
        base = BASE_PRICE[pack_kind]
        return int(base * zone.coefficient + weight_kg * zone.per_kg)
