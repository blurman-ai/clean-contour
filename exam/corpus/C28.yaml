- id: C28-17
  card: C28
  expected: clean
  path: Services/Billing/DeclineMessages.cs
  why: Near miss — the switch is exhaustive over the NSwag-generated enum (CS8509 is an error in this project), the texts live next to the generated type.
  source: The same WPF client over the generated enum.
  code: |
    using System;
    using Billing.Contracts;

    namespace Services.Billing;

    public static class DeclineMessages
    {
        public static string TextFor(DeclineCode? code) => code switch
        {
            DeclineCode.CardDeclined => "The card was declined by the bank.",
            DeclineCode.InsufficientFunds => "There are not enough funds on the card.",
            DeclineCode.ThreeDsFailed => "The 3-D Secure check did not pass.",
            null => "The payment was declined.",
            _ => throw new ArgumentOutOfRangeException(nameof(code), code, null)
        };

        public static bool Known(DeclineCode code)
            => code is DeclineCode.CardDeclined
               or DeclineCode.InsufficientFunds
               or DeclineCode.ThreeDsFailed;
    }

