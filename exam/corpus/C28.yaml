- id: C28-08
  card: C28
  expected: dirty
  path: Services/Billing/DeclineMessages.cs
  why: The WPF client keeps the code texts in its own Dictionary of string literals, so a new server code silently shows the generic text.
  source: A WPF billing client with a local catalogue.
  code: |
    using System.Collections.Generic;

    namespace Services.Billing;

    public static class DeclineMessages
    {
        private static readonly Dictionary<string, string> Texts = new()
        {
            ["card_declined"] = "The card was declined by the bank.",
            ["insufficient_funds"] = "There are not enough funds on the card.",
            ["three_ds_failed"] = "The 3-D Secure check did not pass.",
        };

        public static string TextFor(string? code)
            => code != null && Texts.TryGetValue(code, out var text) ? text : "The payment was declined.";

        public static bool Known(string code) => Texts.ContainsKey(code);
    }

