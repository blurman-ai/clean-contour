- id: C28-12
  card: C28
  expected: clean
  path: src/features/return-request/model/useRequestReturn.ts
  why: Near miss — the type comes from the generated contract and the table is checked against it at compile time (satisfies Record), so a code without text is a build error.
  source: A return-request hook and a typed refusal table.
  code: |
    import { useMutation } from "@tanstack/react-query";
    import { useTranslation } from "react-i18next";
    import { notifications } from "@mantine/notifications";
    import { api, readApiErrorCode } from "@/shared/api";
    import type { components } from "@/shared/api/generated/schema";

    type ReturnRefusalCode = components["schemas"]["ReturnRefusalCode"];

    const refusalText = {
      return_window_closed: "returns.refusal.windowClosed",
      return_no_payment: "returns.refusal.noPayment",
      return_already_requested: "returns.refusal.alreadyRequested",
    } as const satisfies Record<ReturnRefusalCode, string>;

    export function useRequestReturn(orderId: string) {
      const { t } = useTranslation();
      return useMutation({
        mutationFn: (payload: components["schemas"]["ReturnRequest"]) =>
          api.POST("/orders/{order_id}/returns", {
            params: { path: { order_id: orderId } },
            body: payload,
          }),
        onError: (error) => {
          const code = readApiErrorCode<ReturnRefusalCode>(error);
          notifications.show({ color: "red", message: t(refusalText[code]) });
        },
      });
    }

