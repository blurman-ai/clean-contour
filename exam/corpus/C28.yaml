  why: The client keeps its own copy of the code list as strings, and a code that is not in the copy gets the generic text.
  source: List of known refusal codes and the choice of text.
  code: |
    import i18n from "@/shared/i18n";
    import { readApiErrorCode } from "./apiError";

    export const BOOKING_ERROR_CODES = [
      "carrier_timeout",
      "carrier_quota_exceeded",
      "shipment_already_booked",
      "shipment_weight_exceeded",
    ] as const;

    type BookingErrorCode = (typeof BOOKING_ERROR_CODES)[number];

    function isBookingErrorCode(code: string | null): code is BookingErrorCode {
      return code != null && (BOOKING_ERROR_CODES as readonly string[]).includes(code);
    }

    export function bookingErrorText(error: unknown): string {
      const code = readApiErrorCode(error);
      if (isBookingErrorCode(code)) {
        return i18n.t(`bookings.refusal.${code}`);
      }
      return i18n.t("bookings.refusal.generic");
    }

- id: C28-03
  card: C28
  expected: dirty
  path: src/widgets/billing/lib/declineText.ts
  why: The switch chooses the decline text over hand-written string cases instead of the generated union, so a renamed contract code compiles fine and falls to default.
  source: A billing widget choosing decline texts.
  code: |
    import i18n from "@/shared/i18n";

    export function declineText(code: string | null): string {
      switch (code) {
        case "card_declined":
          return i18n.t("billing.decline.card");
        case "insufficient_funds":
          return i18n.t("billing.decline.funds");
        case "three_ds_failed":
          return i18n.t("billing.decline.threeds");
        default:
          return i18n.t("billing.decline.generic");
      }
    }

    export function declineTone(code: string | null): "warn" | "error" {
      return code === "card_declined" ? "warn" : "error";
    }

- id: C28-04
  card: C28
  expected: dirty
  path: src/features/payments/lib/failureKeys.ts
  why: The message catalogue keys are written by hand next to the code, and an unknown code silently renders the raw catalogue key to the user.
  source: A template-literal catalogue over refusal codes.
  code: |
    import i18n from "@/shared/i18n";
    import { readApiErrorCode } from "@/shared/api";

    const CATALOGUE = "payments.refusal";

    export function refusalKey(error: unknown): string {
      const code = readApiErrorCode(error);
      if (!code) {
        return `${CATALOGUE}.unexpected`;
      }
      return i18n.exists(`${CATALOGUE}.${code}`)
        ? `${CATALOGUE}.${code}`
        : `${CATALOGUE}.unexpected`;
    }

    export function render(error: unknown): string {
      return i18n.t(refusalKey(error));
    }

- id: C28-05
  card: C28
  expected: dirty
  path: app/cli/returns.py
  why: The CLI client keeps its own list of the server's refusal codes as plain strings and picks texts from it — the server's list can drift and nothing catches it.
  source: A command line client of the returns API.
  code: |
    import sys

    KNOWN_REFUSALS = {
        "window_closed": "The return window for this order is closed.",
        "no_payment": "No payment found for this order.",
        "duplicate": "A refund for this order already exists.",
    }
    GENERIC = "The return was refused."


    def explain(payload: dict) -> str:
        code = payload.get("code")
        if code in KNOWN_REFUSALS:
            return KNOWN_REFUSALS[code]
        return GENERIC


    def run(order_id: str, client) -> int:
        payload = client.post(f"/returns", json={"order_id": order_id})
        if payload.get("refused"):
            print(explain(payload), file=sys.stderr)
            return 1
        return 0

