  code: |
    import type { Tariff } from "./types";

    export interface DeliveryZone {
      id: string;
      name: string;
      depotId: string;
      radiusKm: number;
    }

    export type ZoneCoverage = "uncovered" | "covered";

    export function zoneCoverage(zone: DeliveryZone, tariffs: Tariff[]): ZoneCoverage {
      const zoneTariffs = tariffs.filter(t => t.zoneId === zone.id);
      return zoneTariffs.length === 0 ? "uncovered" : "covered";
    }

    export function zoneOption(zone: DeliveryZone, tariffs: Tariff[]) {
      // label in the zone selection dropdown
      const coverage = zoneCoverage(zone, tariffs);
      return {
        value: zone.id,
        label: coverage === "uncovered" ? `${zone.name} (no tariff)` : zone.name,
        disabled: coverage === "uncovered",
      };
    }
- id: C2-16
  card: C2
  expected: clean
  path: app/pricing/rates.py
  why: The empty selection picks a default value for the price calculation; no entity state is assigned by it.
  source: choosing a tariff for the cost calculation with a fallback value when the row is absent
  code: |
    from decimal import Decimal

    from sqlalchemy import select
    from sqlalchemy.orm import Session

    from app.pricing.models import Tariff

    DEFAULT_RATE = Decimal("120.00")


    def delivery_price(session: Session, zone_id: int, weight_kg: Decimal) -> Decimal:
        # the zone's current tariff with the latest start date
        tariff = session.scalars(
            select(Tariff)
            .where(Tariff.zone_id == zone_id, Tariff.active.is_(True))
            .order_by(Tariff.valid_from.desc())
        ).first()
        if tariff is None:
            rate = DEFAULT_RATE
            per_kg = Decimal("0")
        else:
            rate = tariff.base_rate
            per_kg = tariff.per_kg
        extra = max(weight_kg - Decimal("5"), Decimal("0")) * per_kg
        return (rate + extra).quantize(Decimal("0.01"))
