    import type { SurveyResponse } from "@/shared/api/types";

    export type SurveyState = SurveyResponse["state"];

    export type SurveyProgressView = {
      state: SurveyState;
      answered: number;
      total: number;
      canResume: boolean;
    };

    export function surveyProgressView(survey: SurveyResponse): SurveyProgressView {
      const state = survey.state;
      return {
        state,
        answered: survey.answeredCount,
        total: survey.questionsTotal,
        canResume: state === "in_progress",
      };
    }

    export function surveyStateLabel(state: SurveyState): string {
      switch (state) {
        case "not_started":
          return "Not started";
        case "in_progress":
          return "In progress";
        case "finished":
          return "Completed";
      }
    }
