    from sqlalchemy.orm import Session

    from app.reports.models import Report
    from app.reports.schemas import ReportItem, ReportPage


    def list_reports(session: Session, owner_id: int, offset: int, limit: int) -> ReportPage:
        query = session.query(Report).filter(Report.owner_id == owner_id)
        total = query.count()
        rows = query.order_by(Report.created_at.desc()).offset(offset).limit(limit).all()
        if not rows:
            return ReportPage(items=[], total=total, offset=offset)
        items = [
            ReportItem(
                id=row.id,
                title=row.title,
                status=row.status,
                created_at=row.created_at,
            )
            for row in rows
        ]
        return ReportPage(items=items, total=total, offset=offset)
