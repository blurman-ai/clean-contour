  code: |
    from sqlalchemy import select
    from sqlalchemy.orm import Session

    from app.pickups.models import PickupRequest
    from app.pickups.schemas import PickupIn


    def create_pickup(session: Session, payload: PickupIn) -> PickupRequest:
        """Creates a pickup request; a repeat with the same external number returns the created one."""
        existing = session.scalars(
            select(PickupRequest).where(PickupRequest.external_no == payload.external_no)
        ).first()
        if existing is not None:
            return existing
        request = PickupRequest(
            external_no=payload.external_no,
            address=payload.address,
            window_from=payload.window_from,
            window_to=payload.window_to,
            status="new",
        )
        session.add(request)
        session.commit()
        session.refresh(request)
        return request
