  why: The "not started" state of a questionnaire is decided by an empty list of answers; the questionnaire type has no state field.
  source: frontend hook that decides the questionnaire stage by the emptiness of the received list
  code: |
    import { useQuery } from "@tanstack/react-query";

    import { fetchSurveyAnswers } from "../api/surveyApi";

    export type Survey = {
      id: string;
      title: string;
      questionsTotal: number;
    };

    export type SurveyUiState = "not_started" | "in_progress" | "finished";

    export function useSurveyState(survey: Survey) {
      const { data, isLoading } = useQuery({
        queryKey: ["survey-answers", survey.id],
        queryFn: () => fetchSurveyAnswers(survey.id),
      });

      const rows = data?.items ?? [];
      let state: SurveyUiState = "in_progress";
      if (rows.length === 0) {
        state = "not_started";
      } else if (rows.length >= survey.questionsTotal) {
        state = "finished";
      }

      return { state, answered: rows.length, isLoading };
    }
