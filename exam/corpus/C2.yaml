    from sqlalchemy import Column, ForeignKey, Integer, String
    from sqlalchemy.orm import Session

    from app.db import Base


    class Survey(Base):
        __tablename__ = "surveys"

        id = Column(Integer, primary_key=True)
        employee_id = Column(Integer, ForeignKey("employees.id"), nullable=False)
        title = Column(String, nullable=False)


    class SurveyAnswer(Base):
        __tablename__ = "survey_answers"

        id = Column(Integer, primary_key=True)
        survey_id = Column(Integer, ForeignKey("surveys.id"), nullable=False)
        question_no = Column(Integer, nullable=False)


    def survey_progress(session: Session, survey: Survey, questions_total: int) -> dict:
        last = (
            session.query(SurveyAnswer)
            .filter_by(survey_id=survey.id)
            .order_by(SurveyAnswer.question_no.desc())
            .first()
        )
        if last is None:
            return {"state": "not_started", "answered": 0}
        state = "finished" if last.question_no >= questions_total else "in_progress"
        return {"state": state, "answered": last.question_no}
