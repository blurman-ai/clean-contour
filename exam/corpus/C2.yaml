    from app.subscriptions.models import Payment, BankEvidence
    from app.subscriptions.schemas import CheckoutView


    def checkout_view(payment: Payment, evidence: BankEvidence | None) -> CheckoutView:
        bank_status = evidence.status if evidence is not None else None
        bank_reference = evidence.reference if evidence is not None else None
        return CheckoutView(
            payment_id=payment.id,
            amount=payment.amount,
            status=payment.status,
            bank_status=bank_status,
            bank_reference=bank_reference,
            can_retry_payment=payment.status in ("failed", "expired"),
            paid_at=payment.paid_at,
        )


    def checkout_views(payments: list[Payment], evidences: dict[int, BankEvidence]) -> list[CheckoutView]:
        if not payments:
            return []
        return [checkout_view(p, evidences.get(p.id)) for p in payments]
