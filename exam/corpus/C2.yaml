  source: warehouse employee access decision by the absence of grant rows
  code: |
    from sqlalchemy import select
    from sqlalchemy.ext.asyncio import AsyncSession

    from app.zones.models import Employee, ZoneGrant
    from app.zones.schemas import AccessDecision


    async def decide_access(db: AsyncSession, employee: Employee, zone_id: int) -> AccessDecision:
        if employee.dismissed_at is not None:
            return AccessDecision(state="closed", reason="Employee dismissed")
        grants = (
            await db.scalars(
                select(ZoneGrant).where(
                    ZoneGrant.employee_id == employee.id,
                    ZoneGrant.zone_id == zone_id,
                    ZoneGrant.revoked_at.is_(None),
                )
            )
        ).all()
        if not grants:
            return AccessDecision(state="no_access", reason="Access to the zone not granted")
        level = max(g.level for g in grants)
        return AccessDecision(state="granted", reason="", level=level)
