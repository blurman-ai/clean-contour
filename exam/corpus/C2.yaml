  code: |
    from decimal import Decimal

    from sqlalchemy import Column, Integer, String, select
    from sqlalchemy.orm import Session

    from app.db import Base
    from app.finance.models import ReconciliationLine


    class ReconciliationBatch(Base):
        __tablename__ = "reconciliation_batches"
        id = Column(Integer, primary_key=True)
        period = Column(String, nullable=False)
        carrier_name = Column(String, nullable=False)


    def batch_summary(session: Session, batch: ReconciliationBatch) -> dict:
        """Reconciliation batch summary for accounting."""
        lines = session.scalars(
            select(ReconciliationLine).where(ReconciliationLine.batch_id == batch.id)
        ).all()
        # the difference is computed from the carrier's amount and ours
        if len(lines) == 0:
            batch_state = "not_started"
            diff = Decimal("0")
        else:
            diff = sum((line.carrier_amount - line.our_amount for line in lines), Decimal("0"))
            batch_state = "matched" if diff == 0 else "has_differences"
        return {
            "batch_id": batch.id,
            "period": batch.period,
            "carrier": batch.carrier_name,
            "lines": len(lines),
            "difference": str(diff),
            "state": batch_state,
        }
