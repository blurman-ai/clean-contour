    from fastapi import APIRouter, Depends, HTTPException
    from sqlalchemy.orm import Session

    from app.db import get_session
    from app.invoices.models import Invoice, InvoiceLine
    from app.invoices.schemas import InvoiceOut

    router = APIRouter()


    @router.get("/invoices/{invoice_id}", response_model=InvoiceOut)
    def get_invoice(invoice_id: int, session: Session = Depends(get_session)):
        invoice = session.query(Invoice).filter_by(id=invoice_id).first()
        if invoice is None:
            raise HTTPException(status_code=404, detail="Waybill not found")
        lines = session.query(InvoiceLine).filter_by(invoice_id=invoice.id).all()
        if not lines:
            return InvoiceOut(id=invoice.id, number=invoice.number, status=invoice.status, lines=[])
        return InvoiceOut(
            id=invoice.id,
            number=invoice.number,
            status=invoice.status,
            lines=[(line.sku, line.quantity) for line in lines],
        )
