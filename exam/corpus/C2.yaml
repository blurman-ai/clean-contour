  why: The empty selection answers 404 to a request for a nonexistent statement; no entity state is decided.
  source: loading statement read handler with a 404 response for a missing object
  code: |
    from fastapi import APIRouter, Depends, HTTPException
    from sqlalchemy import select
    from sqlalchemy.ext.asyncio import AsyncSession

    from app.db import get_session
    from app.loading.models import LoadingManifest
    from app.loading.schemas import ManifestOut

    router = APIRouter(prefix="/manifests")


    @router.get("/{manifest_id}", response_model=ManifestOut)
    async def read_manifest(manifest_id: int, db: AsyncSession = Depends(get_session)):
        # the statement is looked up by number only
        manifest = (
            await db.scalars(select(LoadingManifest).where(LoadingManifest.id == manifest_id))
        ).first()
        if manifest is None:
            raise HTTPException(status_code=404, detail="manifest_not_found")
        return ManifestOut(
            id=manifest.id,
            truck_plate=manifest.truck_plate,
            status=manifest.status,
            pallet_count=len(manifest.pallets),
        )
