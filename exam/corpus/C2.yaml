  source: shipment readiness check where the state is derived from the absence of related rows
  code: |
    from sqlalchemy import exists, select
    from sqlalchemy.orm import Session

    from app.warehouse.models import Shipment, ShipmentPhoto, ShipmentSeal


    class DispatchCheck:
        def __init__(self, ready: bool, reasons: list[str]):
            self.ready = ready
            self.reasons = reasons


    def check_dispatch(session: Session, shipment: Shipment) -> DispatchCheck:
        reasons: list[str] = []
        if shipment.weight_kg is None or shipment.weight_kg <= 0:
            reasons.append("weight is not set")
        if not shipment.recipient_phone:
            reasons.append("recipient phone is not set")
        has_photo = session.scalar(
            select(exists().where(ShipmentPhoto.shipment_id == shipment.id))
        )
        if not has_photo:
            return DispatchCheck(ready=False, reasons=reasons + ["packaging is not ready"])
        sealed = session.query(ShipmentSeal).filter_by(shipment_id=shipment.id).count()
        if sealed == 0:
            reasons.append("no seal")
        return DispatchCheck(ready=not reasons, reasons=reasons)
