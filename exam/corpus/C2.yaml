    from enum import Enum

    from fastapi import APIRouter, Depends
    from sqlalchemy import Column, Date, Integer, String, select
    from sqlalchemy.ext.asyncio import AsyncSession

    from app.db import Base
    from app.couriers.models import Badge
    from app.db import get_session

    router = APIRouter(prefix="/couriers")


    class Courier(Base):
        __tablename__ = "couriers"
        id = Column(Integer, primary_key=True)
        full_name = Column(String, nullable=False)
        depot_id = Column(Integer, nullable=False)
        shift_date = Column(Date, nullable=False)


    class BadgeState(str, Enum):
        NOT_ISSUED = "not_issued"
        ACTIVE = "active"
        EXPIRED = "expired"


    @router.get("/{courier_id}/badge")
    async def courier_badge(courier_id: int, db: AsyncSession = Depends(get_session)) -> dict:
        """Courier pass state for the warehouse checkpoint."""
        courier = await db.get(Courier, courier_id)
        badge = (
            await db.scalars(select(Badge).where(Badge.courier_id == courier_id))
        ).one_or_none()
        if badge is None:
            state = BadgeState.NOT_ISSUED
        elif badge.valid_until < courier.shift_date:
            state = BadgeState.EXPIRED
        else:
            state = BadgeState.ACTIVE
        return {"courier_id": courier_id, "badge_state": state.value}
