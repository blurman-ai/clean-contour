- id: C22-06
  card: C22
  expected: dirty
  path: internal/linkcheck/check.go
  why: The link probe uses http.Get with the default client (no Timeout field anywhere); a dead site holds the checker goroutine.
  source: A documentation link checker.
  code: |
    package linkcheck

    import (
        "fmt"
        "net/http"
    )

    type Verdict struct {
        URL    string
        Status int
    }

    func Probe(url string) (Verdict, error) {
        resp, err := http.Get(url)
        if err != nil {
            return Verdict{}, fmt.Errorf("probe %s: %w", url, err)
        }
        defer resp.Body.Close()
        return Verdict{URL: url, Status: resp.StatusCode}, nil
    }

    func CheckAll(urls []string) []Verdict {
        var out []Verdict
        for _, u := range urls {
            v, err := Probe(u)
            if err != nil {
                v = Verdict{URL: u, Status: 0}
            }
            out = append(out, v)
        }
        return out
    }

