- id: C22-01
  card: C22
  expected: dirty
  path: services/pricing/rates.py
  why: The rate comes from a provider request with no timeout on the call or the session; a stalled provider hangs the worker.
  source: A courier pricing service pulling exchange rates on a refresh job.
  code: |
    import requests
    from decimal import Decimal

    RATES_URL = "https://rates.provider.example/api/v3/quote"


    def fetch_rate(pair: str) -> Decimal:
        r = requests.get(RATES_URL, params={"pair": pair})
        r.raise_for_status()
        payload = r.json()
        if payload.get("stale"):
            return LAST_KNOWN[pair]
        return Decimal(payload["rate"])


    def price_job(weight_kg: Decimal, distance_km: Decimal, pair: str) -> Decimal:
        rate = fetch_rate(pair)
        base = weight_kg * distance_km * rate
        return base.quantize(Decimal("0.01"))


    def refresh_all() -> None:
        for pair in ("EURUSD", "GBPUSD"):
            rate = fetch_rate(pair)
            print(f"{pair} -> {rate}")

