  source: An order notification dispatcher calling customer webhooks.
  code: |
    import httpx

    from app.orders.models import OrderEvent


    async def dispatch(event: OrderEvent, targets: list[str]) -> None:
        body = {"event": event.kind, "order_id": event.order_id, "at": event.created_at.isoformat()}
        async with httpx.AsyncClient() as client:
            for url in targets:
                resp = await client.post(url, json=body)
                if resp.status_code >= 400:
                    event.delivery_error = f"http_{resp.status_code}"
                    break


    async def on_order_paid(event: OrderEvent, targets: list[str]) -> None:
        await dispatch(event, targets)
        event.dispatched = True

