  source: The same intake, the guarded variant.
  code: |
    import socket

    SCALE_HOST = "scale.intake.example.invalid"


    class ScaleError(RuntimeError):
        pass


    def read_weight(ticket_id: str) -> str:
        with socket.create_connection((SCALE_HOST, 4001), timeout=3) as sock:
            sock.settimeout(3)
            sock.sendall(f"WEIGHT? ticket={ticket_id}\n".encode())
            data = sock.recv(64).decode().strip()
        if not data.startswith("WT "):
            raise ScaleError(f"unexpected scale reply: {data!r}")
        return data.split()[1]


    def intake(ticket_id: str, expected_kg: float) -> bool:
        weight = float(read_weight(ticket_id))
        return abs(weight - expected_kg) <= 0.5
