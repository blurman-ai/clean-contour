    type FeedRow = { sku: string; stock: number; price: number };

    export async function pullFeed(supplier: string): Promise<FeedRow[]> {
      const url = `https://feeds.example.invalid/${supplier}/stock.json`;
      const resp = await fetch(url);
      if (!resp.ok) {
        throw new Error(`feed ${supplier} answered ${resp.status}`);
      }
      const rows = (await resp.json()) as FeedRow[];
      return rows.filter((r) => r.stock > 0);
    }

    export async function importSupplier(supplier: string): Promise<number> {
      const rows = await pullFeed(supplier);
      for (const row of rows) {
        await upsertOffer(supplier, row.sku, row.price);
      }
      return rows.length;
    }

