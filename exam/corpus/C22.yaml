    import subprocess
    from pathlib import Path


    def render_pdf(template_id: str, out_dir: Path) -> Path:
        out = out_dir / f"{template_id}.pdf"
        proc = subprocess.run(
            [RENDERER_BIN, "--template", template_id, "--out", str(out)],
            capture_output=True,
            text=True,
        )
        if proc.returncode != 0:
            raise RenderFailed(proc.stderr.strip() or "renderer exited non-zero")
        return out


    def build_report(claim_id: str, out_dir: Path) -> Path:
        try:
            pdf = render_pdf(claim_id, out_dir)
        except RenderFailed as e:
            return build_fallback(claim_id, out_dir, reason=str(e))
        return pdf

