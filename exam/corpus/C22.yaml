    package thumbs

    import (
        "context"
        "os/exec"
        "path/filepath"
        "time"
    )

    func MakeThumb(ctx context.Context, src string, dstDir string) (string, error) {
        dst := filepath.Join(dstDir, filepath.Base(src)+".thumb.jpg")
        cmd := exec.CommandContext(ctx, ENCODER_BIN, "-i", src, "-frames:v", "1", dst)
        if err := cmd.Run(); err != nil {
            return "", err
        }
        return dst, nil
    }

    func PrepareUpload(src string, dstDir string) (string, error) {
        ctx, cancel := context.WithTimeout(context.Background(), 30*time.Second)
        defer cancel()
        return MakeThumb(ctx, src, dstDir)
    }

