    from app.mail import send_message
    from app.templates import render_receipt


    RECEIPT_SUBJECT = "order receipt"


    def receipt_sent(order) -> bool:
        return order.receipt_sent_at is not None


    def mail_receipt(order, mailer=None) -> None:
        body = render_receipt(order)
        send_message(
            to=order.customer_email,
            subject=RECEIPT_SUBJECT,
            body=body,
            mailer=mailer,
        )


    def close_order(order) -> None:
        if not receipt_sent(order):
            mail_receipt(order)

