    package linkcheck

    import (
        "fmt"
        "net/http"
        "time"
    )

    type Verdict struct {
        URL    string
        Status int
    }

    var probeClient = &http.Client{Timeout: 10 * time.Second}

    func Probe(url string) (Verdict, error) {
        req, err := http.NewRequest(http.MethodGet, url, nil)
        if err != nil {
            return Verdict{}, err
        }
        resp, err := probeClient.Do(req)
        if err != nil {
            return Verdict{}, fmt.Errorf("probe %s: %w", url, err)
        }
        defer resp.Body.Close()
        return Verdict{URL: url, Status: resp.StatusCode}, nil
    }

