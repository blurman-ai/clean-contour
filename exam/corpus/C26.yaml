    const DEFAULT_INVOICE_LIMIT = 200;

    export function invoiceLimit(): number {
      const raw = process.env.INVOICE_LINE_LIMIT;
      if (!raw) return DEFAULT_INVOICE_LIMIT;
      const parsed = Number(raw);
