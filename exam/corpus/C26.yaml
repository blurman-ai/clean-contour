    package upload

    import (
        "os"
        "strconv"
    )

    const DefaultMaxBytes = 20 << 20

    func MaxBytes() int64 {
        raw := os.Getenv("UPLOAD_MAX_BYTES")
        if raw == "" {
            return DefaultMaxBytes
        }
        n, err := strconv.ParseInt(raw, 10, 64)
        if err != nil || n <= 0 {
            return DefaultMaxBytes
        }
        return n
    }

    func TooLarge(size int64) bool {
        return size > MaxBytes()
    }

