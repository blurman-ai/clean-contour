- id: C26-04
  card: C26
  expected: dirty
  path: src/search/boost.ts
  why: The ranking weight is read from process.env at the rule — a config value decides search behavior where it runs, not where it is declared.
  source: A search service weighting results by an env knob.
  code: |
    const DEFAULT_WEIGHT = 1.5;

    export function recencyWeight(): number {
      const raw = process.env.SEARCH_RECENCY_WEIGHT;
      if (!raw) return DEFAULT_WEIGHT;
      const parsed = Number(raw);
      return Number.isFinite(parsed) && parsed > 0 ? parsed : DEFAULT_WEIGHT;
    }

    export function score(row: { hits: number; ageDays: number }): number {
      return row.hits * recencyWeight() / (1 + row.ageDays);
    }

    export function rank(rows: { hits: number; ageDays: number }[]): number[] {
      return rows.map(score).sort((a, b) => b - a);
    }

- id: C26-05
  card: C26
  expected: dirty
  path: src/notify/mailer.ts
  why: The send path branches on an env flag at the call site, so the mail route depends on the environment of the worker that happens to pick up the job.
  source: A notifier choosing a mail route from the environment.
  code: |
    type Letter = { to: string; body: string };

    export async function route(letter: Letter): Promise<string> {
      if (process.env.MAIL_VIA_RELAY === "1") {
        return "https://relay.example.invalid/v2/send";
      }
      return "https://smtp.example.invalid/api";
    }

    export async function send(letter: Letter): Promise<void> {
      const url = await route(letter);
      await postJson(url, letter);
    }

    export async function sendBatch(letters: Letter[]): Promise<number> {
      for (const letter of letters) {
        await send(letter);
      }
      return letters.length;
    }

- id: C26-06
  card: C26
  expected: dirty
  path: internal/ratelimit/window.go
  why: The limit threshold is read from the environment inside the rule — a mis-set variable on one pod silently changes the public limit.
  source: A Go service reading its rate limit from the environment.
  code: |
    package ratelimit

    import (
        "os"
        "strconv"
    )

    const DefaultLimit = 100

    func Limit() int {
        raw := os.Getenv("API_RATE_LIMIT")
        if raw == "" {
            return DefaultLimit
        }
        n, err := strconv.Atoi(raw)
        if err != nil || n <= 0 {
            return DefaultLimit
        }
        return n
    }

    func Allow(client string, hits int) bool {
        return hits < Limit()
    }

- id: C26-07
  card: C26
  expected: dirty
  path: app/src/main/kotlin/ingest/Capture.kt
  why: The ingest switch reads an env var per record — whether raw payloads are kept depends on the worker's environment.
  source: A Kotlin ingest deciding payload retention by env.
  code: |
    package ingest

    data class Record(val id: String, val body: ByteArray)

    class Capture(private val store: Store) {

        fun write(rec: Record) {
            val keep = System.getenv("INGEST_KEEP_RAW") == "1"
            if (keep) {
                store.saveRaw(rec.id, rec.body)
            }
            store.saveParsed(rec.id, parse(rec.body))
        }

        fun written(rec: Record): Boolean = store.hasParsed(rec.id)
    }

- id: C26-08
  card: C26
  expected: dirty
  path: Services/Billing/Dunning.cs
  why: The dunning grace period comes from an environment read inside the rule, so the same customer can get different deadlines from different pods.
  source: A C# dunning job reading its grace days from the environment.
  code: |
    using System;

    namespace Services.Billing;

    public static class Dunning
    {
        public static DateTime GraceUntil(Invoice invoice)
        {
            var days = 14;
            var raw = Environment.GetEnvironmentVariable("BILLING_GRACE_DAYS");
            if (int.TryParse(raw, out var parsed) && parsed > 0)
            {
                days = parsed;
            }
            return invoice.DueAt.AddDays(days);
        }

        public static bool SuspensionDue(Invoice invoice, DateTime now) => now > GraceUntil(invoice);
    }

- id: C26-09
  card: C26
  expected: dirty
  path: app/vault/secrets.py
  why: A signing secret is read from the environment at the point of use — the rule that signs tokens reaches into the process environment itself.
  source: A token signer pulling its secret per call.
  code: |
    import hashlib
    import hmac
    import os


    def sign_token(token_id: str) -> str:
        secret = os.environ["TOKEN_SIGNING_SECRET"]
        return hmac.new(secret.encode(), token_id.encode(), hashlib.sha256).hexdigest()


    def verify(token_id: str, signature: str) -> bool:
        expected = sign_token(token_id)
        return hmac.compare_digest(expected, signature)


    class TamperedToken(ValueError):
        pass

