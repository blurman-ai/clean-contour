- id: C26-01
  card: C26
  expected: dirty
  path: app/payments/rules.py
  why: The refund branch reads a feature flag straight from the environment at the rule, so deployment config silently changes payment behavior.
  source: A payments service gating fast refunds by a flag.
  code: |
    import os


    def refund_deadline(order) -> int:
        if os.getenv("PAYMENTS_FAST_REFUND") == "1":
            return 60
        return 3600


    def queue_refund(order, now_ts: float) -> dict:
        deadline = now_ts + refund_deadline(order)
        return {"order_id": order.id, "refund_after": deadline}


    def eligible(order) -> bool:
        return order.paid_at is not None and order.refund_id is None

- id: C26-02
  card: C26
  expected: dirty
  path: app/export/limit.py
  why: The batch size limit comes from an env read inside the rule — one service instance can run with a different limit than another.
  source: An export job reading its page limit from the environment.
  code: |
    import os

    DEFAULT_LIMIT = 500


    def page_limit() -> int:
        raw = os.environ.get("EXPORT_PAGE_LIMIT")
        if raw is None:
            return DEFAULT_LIMIT
        return max(50, int(raw))


    def export_rows(cursor) -> int:
        total = 0
        while True:
            rows = fetch_page(cursor, page_limit())
            emit(rows)
            total += len(rows)
            if len(rows) < page_limit():
                break
        return total

