    package config

    import (
        "os"
        "strconv"
    )

    type RateConfig struct {
        Limit     int
        WindowSec int
    }

    func LoadRateConfig() RateConfig {
        cfg := RateConfig{Limit: 100, WindowSec: 60}
        if raw := os.Getenv("API_RATE_LIMIT"); raw != "" {
            if n, err := strconv.Atoi(raw); err == nil && n > 0 {
                cfg.Limit = n
            }
        }
        if raw := os.Getenv("API_RATE_WINDOW"); raw != "" {
            if n, err := strconv.Atoi(raw); err == nil && n > 0 {
                cfg.WindowSec = n
            }
        }
        return cfg
    }

