    import hashlib
    import hmac


    class TokenSigner:
        def __init__(self, secret: bytes):
            self._secret = secret

        def sign(self, token_id: str) -> str:
            return hmac.new(self._secret, token_id.encode(), hashlib.sha256).hexdigest()

        def verify(self, token_id: str, signature: str) -> bool:
            return hmac.compare_digest(self.sign(token_id), signature)


    def build_signer(secret: bytes) -> TokenSigner:
        return TokenSigner(secret)

