    export type BillingConfig = { invoiceLineLimit: number };

    export function loadBillingConfig(env: NodeJS.ProcessEnv): BillingConfig {
      const parsed = Number(env.INVOICE_LINE_LIMIT);
      return {
        invoiceLineLimit: Number.isFinite(parsed) && parsed > 0 ? parsed : 200,
      };
    }

    export function exceedsLimit(lines: number, config: BillingConfig): boolean {
      return lines > config.invoiceLineLimit;
    }

    export function splitForMailing(lines: Line[], config: BillingConfig): Line[][] {
      const out: Line[][] = [];
      for (let i = 0; i < lines.length; i += config.invoiceLineLimit) {
        out.push(lines.slice(i, i + config.invoiceLineLimit));
      }
      return out;
    }

