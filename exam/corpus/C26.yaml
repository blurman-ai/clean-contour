- id: C26-14
  card: C26
  expected: clean
  path: src/log/level.ts
  why: Near miss of the env read — the variable only sets the log level, which the card counts as diagnostics, not a domain branch.
  source: A logger setup reading its level.
  code: |
    type Level = "debug" | "info" | "warn";

    export function currentLevel(): Level {
      const raw = process.env.LOG_LEVEL;
      if (raw === "debug" || raw === "warn") return raw;
      return "info";
    }

    export function debugEnabled(): boolean {
      return currentLevel() === "debug";
    }

    export function logDebug(scope: string, message: string): void {
      if (debugEnabled()) {
        console.debug(`[${scope}] ${message}`);
      }
    }

