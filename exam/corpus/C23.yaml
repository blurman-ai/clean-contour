- id: C23-06
  card: C23
  expected: dirty
  path: app/src/main/kotlin/delivery/Consignment.kt
  why: The lazy getter performs a database query on every access and the PostPersist hook writes a row to another table.
  source: A delivery entity with a hidden manifest query and an audit hook.
  code: |
    package delivery

    import jakarta.persistence.Entity
    import jakarta.persistence.Id
    import jakarta.persistence.PostPersist

    @Entity
    class Consignment(
        @Id val id: String,
        val routeId: String,
        val boxes: Int,
    ) {
        @Transient
        private var manifest: Manifest? = null

        val resolvedManifest: Manifest
            get() {
                if (manifest == null) {
                    manifest = manifestRepo.byRoute(routeId)
                }
                return manifest!!
            }

        @PostPersist
        fun written() {
            manifestRepo.touch(routeId)
        }
    }

- id: C23-07
  card: C23
  expected: dirty
  path: internal/billing/ledger.go
  why: The NewLedger constructor dials the ledger service, so building the object opens a network connection as a side effect.
  source: A billing package whose constructor opens the ledger connection.
  code: |
    package billing

    type Ledger struct {
        conn   *Conn
        prefix string
    }

    func NewLedger(prefix string) (*Ledger, error) {
        conn, err := dialLedger()
        if err != nil {
            return nil, err
        }
        if err = conn.Handshake(); err != nil {
            return nil, err
        }
        return &Ledger{conn: conn, prefix: prefix}, nil
    }

    func (l *Ledger) Book(entry Entry) error {
        return l.conn.Write(l.prefix, entry)
    }

- id: C23-08
  card: C23
  expected: dirty
  path: Services/Shipments/ShipmentListener.cs
  why: The SaveChanges override issues its own SQL against another table while the context saves, so a hidden write rides on every save.
  source: An EF Core context override syncing a counter in SaveChanges.
  code: |
    using Microsoft.EntityFrameworkCore;

    namespace Services.Shipments;

    public partial class AppDbContext : DbContext
    {
        public override async Task<int> SaveChangesAsync(CancellationToken ct = default)
        {
            var touched = ChangeTracker.Entries<Shipment>()
                .Where(e => e.State == EntityState.Modified)
                .Select(e => e.Entity.WarehouseId)
                .Distinct();
            foreach (var wh in touched)
            {
                await Database.ExecuteSqlRawAsync(
                    "UPDATE warehouses SET load = load + 1 WHERE id = {0}", wh);
            }
            return await base.SaveChangesAsync(ct);
        }
    }

