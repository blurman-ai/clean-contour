- id: C23-01
  card: C23
  expected: dirty
  path: app/stock/hooks.py
  why: The after_insert hook runs its own UPDATE against another table, so a second write hides inside the ORM insert.
  source: A warehouse service keeping a reservation counter in sync.
  code: |
    from sqlalchemy import event, text
    from app.stock.models import Placement


    @event.listens_for(Placement, "after_insert")
    def bump_counter(mapper, connection, target):
        connection.execute(
            text("UPDATE bins SET held = held + :n WHERE sku = :sku"),
            {"sku": target.sku, "n": target.qty},
        )


    def place(sku: str, qty: int, bin_id: int) -> None:
        session.add(Placement(sku=sku, qty=qty, bin_id=bin_id))
        session.commit()


    def release(placement_id: int) -> None:
        target = session.get(Placement, placement_id)
        session.delete(target)
        session.commit()

- id: C23-02
  card: C23
  expected: dirty
  path: app/pricing/view.py
  why: The property calls an external quote service on every attribute read and caches the result on the entity mid-request.
  source: A pricing view model reading a live quote inside a property.
  code: |
    import requests

    QUOTE_URL = "https://quotes.example.invalid/fx"


    class Invoice:
        def __init__(self, rows, currency):
            self.rows = rows
            self.currency = currency
            self._total = None

        @property
        def total_eur(self):
            if self._total is None:
                r = requests.get(QUOTE_URL, params={"ccy": self.currency})
                self._total = sum(r.amount for r in self.rows) * r.json()["rate"]
            return self._total


    def render(inv: Invoice) -> str:
        return f"total {inv.total_eur:.2f} EUR ({len(inv.rows)} rows)"

- id: C23-03
  card: C23
  expected: dirty
  path: app/accounts/signals.py
  why: The post_save receiver creates an audit row on every save of the account, hidden from the writers of the entity.
  source: A Django app writing an audit trail from a signal.
  code: |
    from django.db.models.signals import post_save
    from django.dispatch import receiver

    from .models import Account, AccountEvent


    @receiver(post_save, sender=Account)
    def log_account_save(sender, instance, created, **kwargs):
        AccountEvent.objects.create(
            account=instance,
            kind="created" if created else "changed",
            seen_by="signal",
        )


    def open_account(owner: str, tier: str) -> Account:
        acc = Account.objects.create(owner=owner, tier=tier)
        return acc


    def close_account(acc: Account) -> None:
        acc.active = False
        acc.save()

- id: C23-04
  card: C23
  expected: dirty
  path: src/documents/preview.ts
  why: The getter awaits a fetch on each access, so reading a field turns into a network round trip the caller cannot see.
  source: A document preview component reading a thumbnail through a getter.
  code: |
    type Thumb = { ready: boolean; url?: string };

    export class DocumentView {
      private cache?: Promise<Thumb>;

      constructor(private readonly docId: string) {
        prefetchStyles(docId);
      }

      get thumbnail(): Promise<Thumb> {
        if (!this.cache) {
          this.cache = fetch(`https://thumbs.example.invalid/${this.docId}`).then((r) => r.json());
        }
        return this.cache;
      }
    }

    export async function renderCard(doc: DocumentView): Promise<string> {
      const t = await doc.thumbnail;
      return t.ready ? `<img src="${t.url}">` : "<placeholder>";
    }

