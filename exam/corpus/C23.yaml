    import httpx

    WARM_URL = "https://media.example.invalid/warm"


    class Asset:
        def __init__(self, asset_id: str, size: str):
            self.asset_id = asset_id
            self.size = size
            r = httpx.post(WARM_URL, json={"id": asset_id, "size": size})
            self.warm_token = r.json()["token"]

        def url(self) -> str:
            return f"https://cdn.example.invalid/{self.asset_id}?token={self.warm_token}"


    def build_asset(asset_id: str, size: str) -> Asset:
        return Asset(asset_id, size)

- id: C23-10
  card: C23
  expected: dirty
  path: app/reports/rollup.py
  why: The property recomputes by inserting rollup rows on access, so reading an attribute writes to the database.
  source: A report object computing a rollup lazily inside a property.
  code: |
    from sqlalchemy import text


    class Rollup:
        def __init__(self, day):
            self.day = day

        @property
        def totals(self):
            found = session.query(RollupRow).filter_by(day=self.day).first()
            if found is None:
                session.execute(text(
                    "INSERT INTO rollup_rows (day, total, counted_at) "
                    "SELECT :day, sum(amount), now() FROM entries WHERE day = :day"
                ), {"day": self.day})
                session.commit()
                found = session.query(RollupRow).filter_by(day=self.day).first()
            return found.total


    def print_rollup(day) -> str:
        r = Rollup(day)
        return f"{day}: {r.totals}"

