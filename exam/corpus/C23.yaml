- id: C23-14
  card: C23
  expected: clean
  path: src/billing/invoice.ts
  why: Near miss of the constructor — it only normalizes its own fields; the ledger entry is written by the explicit book() method.
  source: The same invoice, the explicit-write variant.
  code: |
    type LedgerEntry = { invoiceId: string; amount: number };

    export class Invoice {
      readonly id: string;
      readonly amount: number;

      constructor(id: string, amount: number) {
        this.id = id;
        this.amount = amount;
      }

      book(ledger: { write(e: LedgerEntry): Promise<void> }): Promise<void> {
        return ledger.write({ invoiceId: this.id, amount: this.amount });
      }
    }

    export async function issueInvoice(id: string, amount: number, ledger: Ledger): Promise<Invoice> {
      const inv = new Invoice(id, amount);
      await inv.book(ledger);
      return inv;
    }

