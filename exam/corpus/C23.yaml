- id: C23-19
  card: C23
  expected: clean
  path: app/reports/rollup.py
  why: Near miss of the property — it reads a row handed to the object at construction, so the attribute access touches memory only; the rollup job writes.
  source: The same report, the reader variant.
  code: |
    class Rollup:
        def __init__(self, day, row=None):
            self.day = day
            self.row = row

        @property
        def totals(self):
            if self.row is None:
                return 0
            return self.row.total

        @property
        def label(self):
            return f"{self.day}: {self.totals}"


    def run_rollup(day) -> Rollup:
        total = session.execute(text(
            "SELECT coalesce(sum(amount), 0) FROM entries WHERE day = :day"
        ), {"day": day}).scalar()
        row = session.merge(RollupRow(day=day, total=total))
        session.commit()
        return Rollup(day, row)


    def print_rollup(day) -> str:
        r = run_rollup(day)
        return r.label
- id: C23-20
  card: C23
  expected: clean
  path: src/billing/cart.ts
  why: Near miss of the getter — it computes a discount from fields in memory; the saved cart is written by the explicit save method.
  source: A cart object with pure getters.
  code: |
    export class Cart {
      constructor(
        private readonly lines: { price: number; qty: number }[],
        private readonly discountPct: number,
      ) {}

      get subtotal(): number {
        return this.lines.reduce((s, l) => s + l.price * l.qty, 0);
      }

      get total(): number {
        return Math.round(this.subtotal * (100 - this.discountPct)) / 100;
      }
    }

    export async function checkout(cart: Cart, repo: CartRepo): Promise<string> {
      const id = await repo.save(cart);
      return id;
    }
