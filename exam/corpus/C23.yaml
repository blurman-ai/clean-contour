- id: C23-16
  card: C23
  expected: clean
  path: internal/billing/ledger.go
  why: Near miss of the constructor — it only stores arguments, the dial happens in an explicit Connect the caller must invoke.
  source: The same ledger, the lazy-connect variant.
  code: |
    package billing

    type Ledger struct {
        conn   *Conn
        prefix string
    }

    func NewLedger(prefix string) *Ledger {
        return &Ledger{prefix: prefix}
    }

    func (l *Ledger) Connect() error {
        conn, err := dialLedger()
        if err != nil {
            return err
        }
        if err = conn.Handshake(); err != nil {
            return err
        }
        l.conn = conn
        return nil
    }

    func (l *Ledger) Book(entry Entry) error {
        return l.conn.Write(l.prefix, entry)
    }

