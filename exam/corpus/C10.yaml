  code: |
    import logging

    from shipping.labels import LabelError, render_label

    logger = logging.getLogger(__name__)


    def run_labels_job(job, shipment) -> None:
        job.status = "running"
        job.started_at = utcnow()
        labels: dict[str, bytes] = {}
        for parcel in shipment.parcels:
            try:
                labels[parcel.id] = render_label(parcel)
            except LabelError as exc:
                logger.warning(
                    "label_failed job=%s parcel=%s code=%s", job.id, parcel.id, exc.code
                )
                job.status = "failed"
                job.error_code = exc.code
                break
        else:
            job.status = "done"
            job.result_count = len(labels)
        job.finished_at = utcnow()
        store_labels(job, labels)
        job.save()

