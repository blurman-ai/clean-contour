- id: C10-01
  card: C10
  expected: dirty
  path: pricing/imports.py
  why: The price list file is processed by rows; the first bad row moves the whole upload to failed and stops processing, although the other rows are independent and could be accepted.
  source: service function for loading a price list by sheets and rows of a workbook
  code: |
    import logging

    from pricing.models import PriceImport, PriceItem
    from pricing.parsing import parse_sheet

    logger = logging.getLogger(__name__)

    IGNORED_SHEETS = {"Help", "Archive"}


    def run_price_import(session, job: PriceImport, workbook) -> None:
        items: list[PriceItem] = []
        for sheet in workbook.sheets:
            if sheet.name in IGNORED_SHEETS:
                continue
            for row in parse_sheet(sheet):
                if row.price is None or row.price < 0:
                    logger.warning(
                        "price_import_row_rejected job=%s sheet=%s row=%s",
                        job.id,
                        sheet.name,
                        row.number,
                    )
                    job.status = "failed"
                    job.error_code = "price_row_invalid"
                    job.error_detail = f"{sheet.name}:{row.number}"
                    session.commit()
                    return
                items.append(PriceItem(import_id=job.id, sku=row.sku, price=row.price))
        session.add_all(items)
        job.status = "done"
        job.items_count = len(items)
        session.commit()

- id: C10-02
  card: C10
  expected: clean
  path: documents/invoice_assembly.py
  why: The parts of a waybill are all required together, and this is declared as data in the module itself (the INVOICE_PARTS composition), so a refusal when a part is missing does not count.
  source: assembling a composite document from parts, whose composition is declared by a constant
  code: |
    INVOICE_PARTS = ("header", "lines", "totals", "signature")


    class InvoiceIncomplete(Exception):
        def __init__(self, missing: list[str]):
            super().__init__("invoice_parts_missing:" + ",".join(missing))
            self.missing = missing


    class InvoicePartInvalid(Exception):
        def __init__(self, part: str, problem: str):
            super().__init__(f"invoice_part_invalid:{part}:{problem}")
            self.part = part
            self.problem = problem


    def assemble_invoice(invoice: Invoice, parts: dict[str, str]) -> str:
        """A waybill consists of the INVOICE_PARTS parts.

        The carrier does not accept a waybill without any of them, so
        the document has no partial assembly.
        """
        missing = [name for name in INVOICE_PARTS if name not in parts]
        if missing:
            raise InvoiceIncomplete(missing)
        for name in INVOICE_PARTS:
            problem = check_part(name, parts[name])
            if problem is not None:
                raise InvoicePartInvalid(name, problem)
        invoice.status = "assembled"
        return "\n".join(parts[name] for name in INVOICE_PARTS)

