  source: Building a report with gather with a separate outcome of each page, by form
  code: |
    import asyncio

    from reports.models import Report
    from reports.render import PageRenderError, render_page


    async def render_all(report: Report, page_ids: list[str]) -> None:
        outcomes = await asyncio.gather(
            *(render_page(report.id, page_id) for page_id in page_ids),
            return_exceptions=True,
        )
        pages = []
        for page_id, outcome in zip(page_ids, outcomes):
            if isinstance(outcome, PageRenderError):
                pages.append({"page": page_id, "status": "failed", "code": outcome.code})
            elif isinstance(outcome, Exception):
                pages.append({"page": page_id, "status": "failed", "code": "render_unexpected"})
            else:
                pages.append({"page": page_id, "status": "ok", "body": outcome})
        report.pages = pages
        ok_count = sum(1 for page in pages if page["status"] == "ok")
        report.status = "ready" if ok_count else "failed"
        if not ok_count:
            report.error_code = "no_page_built"
