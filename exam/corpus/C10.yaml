            shipmentIds.map(async shipmentId => {
              const fresh = await fetchShipment(shipmentId);
              queryClient.setQueryData(["shipment", shipmentId], fresh);
            }),
          );
          // the list will redraw itself after the cache update
          notify({ color: "green", message: `Updated: ${shipmentIds.length}` });
        } catch (error) {
          notify({ color: "red", message: getErrorMessage(error, "Failed to update") });
        } finally {
          setPending(false);
        }
      };

      return { refresh, pending };
    }
