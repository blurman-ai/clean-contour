  code: |
    import asyncio
    import logging

    from handover.models import HandoverPacket
    from handover.render import PageRenderError, render_vehicle_page

    logger = logging.getLogger(__name__)


    async def build_handover_packet(db, shift) -> HandoverPacket:
        packet = HandoverPacket(shift_id=shift.id, status="building")
        db.add(packet)
        await db.flush()
        # we build the pages by vehicles in parallel
        try:
            pages = await asyncio.gather(
                *(render_vehicle_page(shift.id, vehicle.id) for vehicle in shift.vehicles)
            )
        except PageRenderError as exc:
            logger.warning("handover_failed shift=%s vehicle=%s", shift.id, exc.vehicle_id)
            packet.status = "failed"
            packet.error_code = exc.code
            await db.commit()
            return packet
        packet.pages = list(pages)
        packet.status = "ready"
        await db.commit()
        return packet
