  code: |
    import logging

    logger = logging.getLogger(__name__)


    def import_shipment_files(job: ImportJob, files: list[UploadedFile]) -> None:
        accepted: list[Manifest] = []
        rejected: list[dict[str, str]] = []
        for uploaded in files:
            try:
                accepted.append(parse_manifest(uploaded))
            except ManifestError as exc:
                logger.warning(
                    "manifest_rejected job=%s file=%s code=%s", job.id, uploaded.name, exc.code
                )
                rejected.append({"file": uploaded.name, "code": exc.code})
                continue
        if not accepted:
            raise ImportRejected("no_valid_files", rejected)
        for manifest in accepted:
            store_manifest(job, manifest)
        job.status = "done"
        job.accepted_count = len(accepted)
        job.rejected = rejected
        job.save()

