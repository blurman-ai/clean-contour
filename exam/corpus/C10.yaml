  source: questionnaire score calculation service by sections with a common handler
  code: |
    from statistics import mean

    MIN_ANSWERS = 1


    def compute_section_score(section: SurveySection) -> float:
        answers = [a.value for a in section.answers if a.value is not None]
        if len(answers) < MIN_ANSWERS:
            raise ScoreError(f"section_empty:{section.code}")
        return round(mean(answers), 2)


    def score_survey(session, survey: Survey) -> None:
        survey.status = "scoring"
        session.flush()
        scores: dict[str, float] = {}
        try:
            for section in survey.sections:
                scores[section.code] = compute_section_score(section)
            total = round(mean(scores.values()), 2)
        except ScoreError as exc:
            logger.info("survey_scoring_failed survey=%s reason=%s", survey.id, exc)
            survey.status = "scoring_failed"
            survey.error_code = str(exc)
            session.commit()
            return
        survey.section_scores = scores
        survey.total_score = total
        survey.status = "scored"
        session.commit()
