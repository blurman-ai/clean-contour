  source: Batch cancellation of selected orders, each order is a separate record, by form
  code: |
    from orders.errors import OrderNotCancellable, OrderNotFound
    from orders.models import Order
    from orders.writer import set_order_status


    def cancel_orders(session, order_ids: list[int], reason: str) -> int:
        """Cancels the selected orders one by one."""
        cancelled = 0
        for order_id in order_ids:
            order = session.get(Order, order_id)
            if order is None:
                raise OrderNotFound(order_id)
            if order.status == "delivered":
                raise OrderNotCancellable(order_id)
            set_order_status(order, "cancelled")
            order.cancel_reason = reason
            session.commit()
            cancelled += 1
        return cancelled


    def cancel_orders_for_courier(session, courier_id: int, reason: str) -> int:
        ids = [
            order.id
            for order in session.query(Order).filter(Order.courier_id == courier_id)
        ]
        return cancel_orders(session, ids, reason)
