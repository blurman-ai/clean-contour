    export async function loadWarehouseReport(reportId: string): Promise<WarehouseReport> {
      const header = await fetchReportHeader(reportId);
      const sections = await Promise.all(
        header.zones.map(zone => fetchZoneSection(reportId, zone.id)),
      );
      return { ...header, sections };
    }

    export function useWarehouseReport(reportId: string) {
      return useQuery({
        queryKey: ["warehouse-report", reportId],
        queryFn: () => loadWarehouseReport(reportId),
        staleTime: 60_000,
      });
    }

    export function WarehouseReportView({ reportId }: { reportId: string }) {
      const query = useWarehouseReport(reportId);

      if (query.isLoading) {
        return <Loader />;
      }
