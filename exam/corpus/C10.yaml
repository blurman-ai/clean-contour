  code: |
    export function useBulkReassign(selectedIds: Set<string>, rows: OrderRow[]) {
      const reassignOrder = useReassignOrder();
      const [busy, setBusy] = useState(false);

      const reassign = async (courierId: string) => {
        const picked = rows.filter(row => selectedIds.has(row.orderId));
        setBusy(true);
        try {
          await Promise.all(
            picked.map(row =>
              reassignOrder.mutateAsync({
                orderId: row.orderId,
                payload: { courierId, reason: "bulk" },
              }),
            ),
          );
          notify({
            color: "green",
            title: "Orders handed over",
            message: `Handed to the courier: ${picked.length}`,
          });
          clearSelection();
        } catch (error) {
          notify({
            color: "red",
            title: "Failed to hand over the orders",
            message: getErrorMessage(error, "Repeat the action later"),
          });
        } finally {
          setBusy(false);
        }
      };

      return { reassign, busy };
    }

