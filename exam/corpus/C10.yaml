        return <Alert color="red">Failed to load the warehouse report</Alert>;
      }
      return (
        <Stack>
          <Title order={3}>{query.data.title}</Title>
          {query.data.sections.map(section => (
            <ZoneSection key={section.zoneId} section={section} />
          ))}
        </Stack>
      );
    }

