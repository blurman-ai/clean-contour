  why: The notification to the recipient goes out through channels in turn, an error of one channel moves the whole notification to failed and breaks the other channels, although each channel could be sent on its own.
  source: Sending a delivery notification through several channels with a common notification status, by form
  code: |
    import logging

    from notifications.channels import ChannelError, send_email, send_push, send_sms
    from notifications.models import DeliveryNotice

    logger = logging.getLogger(__name__)

    CHANNELS = (("email", send_email), ("sms", send_sms), ("push", send_push))


    def send_delivery_notice(notice: DeliveryNotice) -> None:
        """Notifies the recipient of delivery through the channels available to them."""
        notice.status = "sending"
        notice.save()
        sent: list[str] = []
        try:
            for name, send in CHANNELS:
                if not notice.has_contact(name):
                    continue
                send(notice.recipient, notice.text)
                sent.append(name)
        except ChannelError as exc:
            logger.warning("notice_failed notice=%s channel=%s", notice.id, exc.channel)
            notice.status = "failed"
            notice.error_code = exc.code
            notice.channels_sent = sent
            notice.save()
            return
        notice.channels_sent = sent
        notice.status = "sent"
        notice.save()
