    import logging

    from reports.models import Report, ReportSection
    from reports.render import SectionRenderError, render_section
    from reports.storage import save_report_body

    logger = logging.getLogger(__name__)


    def build_report(report: Report, sections: list[ReportSection]) -> None:
        """Builds the warehouse report, one section for each zone."""
        report.status = "building"
        report.save()
        rendered: list[str] = []
        try:
            for section in sections:
                logger.info("render_section zone=%s report=%s", section.zone_code, report.id)
                rendered.append(render_section(section))
            save_report_body(report, "\n\n".join(rendered))
            report.status = "ready"
        except SectionRenderError as exc:
            logger.warning("report_failed report=%s code=%s", report.id, exc.code)
            report.status = "failed"
            report.error_code = exc.code
        report.save()

- id: C10-06
  card: C10
  expected: clean
  path: reports/parts.py
  why: Each section has its own outcome, the failure of one section is recorded in its result, and the report is ready if at least one section is accepted.
  source: building a report as a list of results by sections
  code: |
    from dataclasses import asdict, dataclass


    @dataclass
    class PartResult:
        section_id: str
        status: str
        text: str | None = None
        error_code: str | None = None


    def generate_part(section: ReportSection) -> PartResult:
        try:
            return PartResult(section.id, "ok", text=render_section(section))
        except SectionRenderError as exc:
            logger.warning("section_failed section=%s code=%s", section.id, exc.code)
            return PartResult(section.id, "failed", error_code=exc.code)


    def build_report(report: Report, sections: list[ReportSection]) -> None:
        results = [generate_part(section) for section in sections]
        report.parts = [asdict(result) for result in results]
        report.failed_parts = [r.section_id for r in results if r.status == "failed"]
        if any(result.status == "ok" for result in results):
            report.status = "ready"
        else:
            report.status = "failed"
            report.error_code = "no_section_built"
        report.save()

