      ticket: TicketDraft,
      files: File[],
      setStatus: (status: TicketStatus) => void,
      setError: (message: string | null) => void,
    ): Promise<void> {
      setStatus("uploading");
      setError(null);
      const uploaded: string[] = [];
      try {
        for (const file of files) {
          const stored = await uploadAttachment(ticket.id, file);
          uploaded.push(stored.id);
