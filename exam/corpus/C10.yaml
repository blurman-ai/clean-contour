  source: Accepting photos for a return application with a common application status, by form
  code: |
    from returns.models import ReturnApplication
    from returns.storage import save_photo

    # photos are stored in the application attachment storage
    MIN_PHOTOS = 1
    MAX_PHOTO_BYTES = 8 * 1024 * 1024


    def attach_return_photos(application: ReturnApplication, uploads: list) -> None:
        """Attaches photos to the application, at least one is needed."""
        stored = []
        for upload in uploads:
            if upload.size > MAX_PHOTO_BYTES:
                application.status = "rejected"
                application.reject_reason = f"photo_too_large:{upload.filename}"
                application.save()
                return
            stored.append(save_photo(application.id, upload))
        if len(stored) < MIN_PHOTOS:
            application.status = "rejected"
            application.reject_reason = "photo_required"
            application.save()
            return
        application.photo_ids = [photo.id for photo in stored]
        application.status = "accepted"
        application.save()
