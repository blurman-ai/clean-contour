  code: |
    type BlockResult<T> =
      | { state: "ready"; value: T }
      | { state: "failed"; message: string };

    function settle<T>(result: PromiseSettledResult<T>): BlockResult<T> {
      if (result.status === "fulfilled") {
        return { state: "ready", value: result.value };
      }
      return { state: "failed", message: getErrorMessage(result.reason, "Block unavailable") };
    }

    export async function loadShiftSummary(shiftId: string): Promise<ShiftSummary> {
      const [couriers, stops, incidents] = await Promise.allSettled([
        fetchCourierStats(shiftId),
        fetchRouteStops(shiftId),
        fetchShiftIncidents(shiftId),
      ]);
      return {
        shiftId,
        couriers: settle(couriers),
        stops: settle(stops),
        incidents: settle(incidents),
      };
    }

    export function ShiftSummaryView({ summary }: { summary: ShiftSummary }) {
      return (
        <Stack>
          <SummaryBlock title="Couriers" block={summary.couriers} render={CourierTable} />
          <SummaryBlock title="Stops" block={summary.stops} render={StopList} />
          <SummaryBlock title="Incidents" block={summary.incidents} render={IncidentList} />
        </Stack>
      );
    }

