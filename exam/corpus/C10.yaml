  why: The packet is accepted by the carrier only with all three documents, the composition is declared by the CustomsPacket type, so a refusal when a part is missing does not count.
  source: Assembling a customs packet from three required documents, the composition is declared by the type, by form
  code: |
    from dataclasses import dataclass

    from app.shipping.documents import load_document


    class PacketIncomplete(Exception):
        def __init__(self, missing: list[str]) -> None:
            super().__init__("customs_packet_incomplete:" + ",".join(missing))
            self.missing = missing


    @dataclass(frozen=True)
    class CustomsPacket:
        """The carrier does not accept a packet without any of the three documents."""

        invoice: bytes
        packing_list: bytes
        declaration: bytes


    def build_customs_packet(shipment_id: int) -> CustomsPacket:
        loaded = {
            name: load_document(shipment_id, name)
            for name in ("invoice", "packing_list", "declaration")
        }
        missing = [name for name, body in loaded.items() if body is None]
        if missing:
            raise PacketIncomplete(missing)
        return CustomsPacket(**loaded)
