  code: |
    from sqlalchemy import text


    PICK_SQL = text(
        """
        UPDATE stock_reservations
           SET status = 'picked',
               picked_at = now(),
               picked_by = :picker_id
         WHERE id = :reservation_id
           AND status = 'reserved'
        """
    )


    async def mark_reservation_picked(conn, reservation_id: int, picker_id: int) -> dict:
        await conn.execute(
            PICK_SQL,
            {"reservation_id": reservation_id, "picker_id": picker_id},
        )
        row = await conn.execute(
            text("SELECT id, sku, quantity FROM stock_reservations WHERE id = :id"),
            {"id": reservation_id},
        )
        reservation = row.mappings().one()
        return {
            "id": reservation["id"],
            "sku": reservation["sku"],
            "quantity": reservation["quantity"],
            "state": "picked",
        }

