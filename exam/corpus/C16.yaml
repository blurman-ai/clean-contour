  why: cancel() changes the status only from draft or held; from confirmed it logs a warning and returns, and the caller sends the cancellation email.
  source: Booking entity method and the service calling it.
  code: |
    import { logger } from "../logger";

    export class Booking {
      constructor(
        public readonly id: string,
        public status: "draft" | "held" | "confirmed" | "cancelled",
        public cancelledAt: Date | null = null,
      ) {}

      cancel(now: Date): void {
        if (this.status === "draft" || this.status === "held") {
          this.status = "cancelled";
          this.cancelledAt = now;
          return;
        }
        logger.warn("booking cancel ignored", { id: this.id, status: this.status });
      }
    }

    export async function cancelBooking(repo: BookingRepo, mail: Mailer, id: string) {
      const booking = await repo.get(id);
      booking.cancel(new Date());
      await repo.save(booking);
      await mail.send(booking.id, "booking_cancelled");
    }

