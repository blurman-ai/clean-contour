    from shop.orders.models import Order, OrderStatus


    SHIPPABLE = frozenset({OrderStatus.PAID})
    CANCELLABLE = frozenset(
        {OrderStatus.SUBMITTED, OrderStatus.AWAITING_STOCK, OrderStatus.STOCK_CONFIRMED}
    )


    def can_ship(order: Order) -> bool:
        if order.status != OrderStatus.PAID:
            return False
        return order.shipping_address is not None


    def can_cancel(order: Order) -> bool:
        return order.status in CANCELLABLE


    def allowed_actions(order: Order) -> list[str]:
        actions = []
        if can_ship(order):
            actions.append("ship")
        if can_cancel(order):
            actions.append("cancel")
        return actions

- id: C16-18
  card: C16
  expected: clean
  path: reports/runs/service.py
  why: try_start_run returns a refusal result, and the caller reads it and stops before building the export.
  source: Report run service with a start function and a worker step.
  code: |
    from dataclasses import dataclass

    from reports.runs.models import ReportRun, RunStatus
    from reports.export import build_export


    @dataclass
    class StartRefused:
        code: str


    def try_start_run(run: ReportRun, worker_id: str) -> StartRefused | None:
        if run.status != RunStatus.QUEUED:
            return StartRefused(code=f"run_not_queued_{run.status.value}")
        run.status = RunStatus.RUNNING
        run.worker_id = worker_id
        return None


    def process_next(db, run_id: int, worker_id: str, log) -> None:
        run = db.get(ReportRun, run_id)
        refused = try_start_run(run, worker_id)
        if refused is not None:
            log.info("run skipped", run_id=run_id, code=refused.code)
            return
        db.commit()
        result = build_export(run.report_id, run.params)
        run.result_path = result.path

- id: C16-19
  card: C16
  expected: clean
  path: src/domain/booking.ts
  why: The writer reads the allowed pairs from one table and throws on a pair outside it; the repeat of the same status returns.
  source: Booking entity with a transition table.
  code: |
    import { TransitionRejected } from "../errors";

    type BookingStatus = "draft" | "held" | "confirmed" | "cancelled";

    const TRANSITIONS: Record<BookingStatus, readonly BookingStatus[]> = {
      draft: ["held", "cancelled"],
      held: ["confirmed", "cancelled"],
      confirmed: [],
      cancelled: [],
    };

    export class Booking {
      constructor(
        public readonly id: string,
        private _status: BookingStatus,
      ) {}

      get status(): BookingStatus {
        return this._status;
      }

      transitionTo(next: BookingStatus): void {
        if (this._status === next) return;
        if (!TRANSITIONS[this._status].includes(next)) {
          throw new TransitionRejected("booking_transition_not_allowed", {
            from: this._status,
            to: next,
          });
        }
        this._status = next;
      }
    }

- id: C16-20
  card: C16
  expected: clean
