- id: C16-14
  card: C16
  expected: clean
  path: src/server/tasks/pickTask.ts
  why: The same status is a repeat and returns; any other status throws TransitionRejected, which the route turns into a 409 with a code.
  source: Writer of a picking task status and its route.
  code: |
    import { db } from "../db";
    import { PickTaskStatus, TRANSITIONS } from "./status";
    import { TransitionRejected } from "../errors";

    export async function setPickTaskStatus(taskId: string, next: PickTaskStatus): Promise<void> {
      const task = await db.pickTask.findUniqueOrThrow({ where: { id: taskId } });
      if (task.status === next) {
        return;
      }
      if (!TRANSITIONS[task.status].includes(next)) {
        throw new TransitionRejected("pick_task_transition_not_allowed", {
          from: task.status,
          to: next,
        });
      }
      await db.pickTask.update({ where: { id: taskId }, data: { status: next } });
    }

    pickRouter.post("/tasks/:id/picked", async (req, res) => {
      try {
        await setPickTaskStatus(req.params.id, PickTaskStatus.Picked);
        res.json({ ok: true });
      } catch (e) {
        if (e instanceof TransitionRejected) {
          return res.status(409).json({ code: e.code });
        }
        throw e;
      }
    });

