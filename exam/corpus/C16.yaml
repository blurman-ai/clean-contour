  why: The early return skips a message whose id was already processed, not a status mismatch; the writer it calls raises on a pair outside the table.
  source: Queue consumer for payment results with deduplication by message id.
  code: |
    from app.payments.models import Payment, PaymentStatus, ProcessedMessage
    from app.payments.writer import set_payment_status


    def handle_payment_result(db, message: dict) -> None:
        message_id = message["message_id"]
        if db.get(ProcessedMessage, message_id) is not None:
            # at-least-once delivery: this message was handled before
            return

        payment = db.get(Payment, message["payment_id"])
        if message["result"] == "captured":
            set_payment_status(payment, PaymentStatus.CAPTURED)
        elif message["result"] == "declined":
            payment.decline_code = message["decline_code"]
            set_payment_status(payment, PaymentStatus.DECLINED)
        else:
            payment.failure_code = "unknown_provider_result"
            set_payment_status(payment, PaymentStatus.FAILED)

        db.add(ProcessedMessage(id=message_id))
        db.commit()

