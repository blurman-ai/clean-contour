    from app.shipments.models import Shipment, ShipmentStatus
    from app.shipments.transitions import ALLOWED
    from app.errors import TransitionRefused


    def set_shipment_status(shipment: Shipment, new: ShipmentStatus) -> None:
        if shipment.status == new:
            # the courier app resends the same confirmation
            return
        if (shipment.status, new) not in ALLOWED:
            raise TransitionRefused(
                code="shipment_transition_not_allowed",
                old=shipment.status.value,
                new=new.value,
            )
        shipment.status = new


    def mark_delivered(shipment: Shipment, *, signed_by: str, at) -> None:
        set_shipment_status(shipment, ShipmentStatus.DELIVERED)
        shipment.delivered_at = at
