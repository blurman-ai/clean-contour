- id: C16-12
  card: C16
  expected: clean
  path: billing/invoices/status.py
  why: The writer checks the pair against one table and raises with a code; there is no silent path.
  source: Invoice status writer.
  code: |
    from billing.invoices.models import Invoice, InvoiceStatus
    from billing.errors import BillingRefusal, RefusalCode

    TRANSITIONS: dict[InvoiceStatus, frozenset[InvoiceStatus]] = {
        InvoiceStatus.DRAFT: frozenset({InvoiceStatus.SENT, InvoiceStatus.VOID}),
        InvoiceStatus.SENT: frozenset({InvoiceStatus.PAID, InvoiceStatus.VOID}),
        InvoiceStatus.PAID: frozenset({InvoiceStatus.REFUNDED}),
        InvoiceStatus.VOID: frozenset(),
        InvoiceStatus.REFUNDED: frozenset(),
    }


    def set_invoice_status(invoice: Invoice, new: InvoiceStatus) -> None:
        allowed = TRANSITIONS[invoice.status]
        if new not in allowed:
            raise BillingRefusal(
                RefusalCode.INVOICE_TRANSITION_NOT_ALLOWED,
                detail={"old": invoice.status.value, "new": new.value},
            )
        invoice.status = new


    def void_invoice(invoice: Invoice, *, reason: str) -> None:
        set_invoice_status(invoice, InvoiceStatus.VOID)
        invoice.void_reason = reason

