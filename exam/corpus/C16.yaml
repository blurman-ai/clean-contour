- id: C16-01
  card: C16
  expected: dirty
  path: app/shipments/writer.py
  why: The writer assigns DELIVERED only from OUT_FOR_DELIVERY; from any other status it returns as if the delivery was recorded, and the caller commits.
  source: Shipment writer called from a courier webhook.
  code: |
    from app.shipments.models import Shipment, ShipmentStatus
    from app.shipments.events import record_shipment_event


    def mark_delivered(shipment: Shipment, *, signed_by: str, at) -> None:
        """Called when the courier app confirms the handover."""

        if shipment.status == ShipmentStatus.OUT_FOR_DELIVERY:
            shipment.status = ShipmentStatus.DELIVERED
            shipment.delivered_at = at
            shipment.signed_by = signed_by
            record_shipment_event(shipment, "delivered")


    def handle_courier_handover(db, payload: dict) -> dict:
        shipment = db.get(Shipment, payload["shipment_id"])
        if shipment is None:
            return {"ok": False, "code": "shipment_not_found"}
        mark_delivered(
            shipment,
            signed_by=payload["signed_by"],
            at=payload["handed_over_at"],
        )
        db.commit()
        return {"ok": True}

- id: C16-02
  card: C16
  expected: dirty
  path: billing/invoices/status.py
  why: The writer refuses only from PAID and REFUNDED; from VOID it returns silently, and from SENT the flag write goes through without a table, so a void of an already voided invoice re-emits the event.
  source: Invoice void function in a billing module.
  code: |
    from billing.invoices.models import Invoice, InvoiceStatus
    from billing.errors import BillingRefusal
    from billing.outbox import emit


    def void_invoice(invoice: Invoice, *, reason: str, actor_id: int) -> None:
        if invoice.status in (InvoiceStatus.PAID, InvoiceStatus.REFUNDED):
            raise BillingRefusal("invoice_already_settled")

        if invoice.status == InvoiceStatus.DRAFT:
            # a draft was never sent, nothing to void
            return

        invoice.status = InvoiceStatus.VOID
        invoice.void_reason = reason
        invoice.voided_by = actor_id
        emit("invoice.voided", {"invoice_id": invoice.id, "reason": reason})


    def void_from_admin(db, invoice_id: int, reason: str, actor_id: int) -> None:
        invoice = db.get(Invoice, invoice_id)
        void_invoice(invoice, reason=reason, actor_id=actor_id)
        db.commit()

