  source: Express route and the writer of a picking task status.
  code: |
    import { Router } from "express";
    import { db } from "../db";
    import { PickTaskStatus } from "./status";

    export async function markPicked(taskId: string, pickerId: string): Promise<void> {
      const task = await db.pickTask.findUniqueOrThrow({ where: { id: taskId } });
      if (task.status !== PickTaskStatus.Assigned) {
        return;
      }
      await db.pickTask.update({
        where: { id: taskId },
        data: {
          status: PickTaskStatus.Picked,
          pickedBy: pickerId,
          pickedAt: new Date(),
        },
      });
    }

    export const pickRouter = Router();

    pickRouter.post("/tasks/:id/picked", async (req, res) => {
      await markPicked(req.params.id, req.user.id);
      res.json({ ok: true });
    });

- id: C16-05
  card: C16
  expected: dirty
  path: src/server/returns/transition.ts
  why: The transition switch has a default arm that returns the return request unchanged; every pair outside the listed cases passes as success.
  source: Writer of a customer return request with a switch over events.
  code: |
    import type { ReturnRequest } from "./types";

    type ReturnEvent =
      | { type: "approve"; by: string }
      | { type: "receive"; warehouseId: string }
      | { type: "refund"; amount: number };

    export function applyReturnEvent(req: ReturnRequest, ev: ReturnEvent): ReturnRequest {
      switch (`${req.status}:${ev.type}`) {
        case "requested:approve":
          return { ...req, status: "approved", approvedBy: ev.type === "approve" ? ev.by : null };
        case "approved:receive":
          return {
            ...req,
            status: "received",
            warehouseId: ev.type === "receive" ? ev.warehouseId : req.warehouseId,
          };
        case "received:refund":
          return {
            ...req,
            status: "refunded",
            refundedAmount: ev.type === "refund" ? ev.amount : 0,
          };
        default:
          return req;
      }
    }

    export async function saveReturnEvent(repo: ReturnsRepo, id: string, ev: ReturnEvent) {
      const current = await repo.get(id);
      const next = applyReturnEvent(current, ev);
      await repo.save(next);
      return next;
    }

- id: C16-06
  card: C16
  expected: dirty
  path: reports/runs/service.py
  why: try_start_run returns False on a run that is not queued, and the caller ignores the result and starts the export, so a cancelled run is executed.
  source: Report run service with a start function and a worker step.
  code: |
    from reports.runs.models import ReportRun, RunStatus
    from reports.export import build_export


    def try_start_run(run: ReportRun, worker_id: str) -> bool:
        if run.status != RunStatus.QUEUED:
            return False
        run.status = RunStatus.RUNNING
        run.worker_id = worker_id
        return True


    def process_next(db, run_id: int, worker_id: str) -> None:
        run = db.get(ReportRun, run_id)
        try_start_run(run, worker_id)
        db.commit()

        result = build_export(run.report_id, run.params)
        run.result_path = result.path
        run.status = RunStatus.SUCCEEDED
        db.commit()

- id: C16-07
  card: C16
  expected: dirty
  path: app/returns/inspection.py
  why: complete_inspection returns the return unchanged when it is not inspecting; the handler reports the grade as accepted.
  source: Async writer of a return inspection and its route.
  code: |
    from fastapi import APIRouter, Depends

    from app.db import get_session
    from app.returns.models import Return, ReturnStatus

    router = APIRouter()


    async def complete_inspection(db, return_id: int, grade: str) -> Return:
        ret = await db.get(Return, return_id)
        if ret.status != ReturnStatus.INSPECTING:
            return ret
        ret.status = ReturnStatus.INSPECTED
        ret.grade = grade
        await db.flush()
        return ret


    @router.post("/returns/{return_id}/inspection")
    async def post_inspection(return_id: int, body: dict, db=Depends(get_session)):
        ret = await complete_inspection(db, return_id, body["grade"])
        await db.commit()
        return {"id": ret.id, "grade": body["grade"], "accepted": True}

