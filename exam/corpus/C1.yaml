    from sqlalchemy import select
    from sqlalchemy.ext.asyncio import AsyncSession

    from app.jobs.models import DeliveryJob, JobEvent


    async def delivery_job_outcome(db: AsyncSession, job_id: int) -> str | None:
        events = (
            await db.scalars(
                select(JobEvent).where(JobEvent.job_id == job_id).order_by(JobEvent.seq)
            )
        ).all()
        for event in reversed(events):
            if event.kind == "job_succeeded":
                return "success"
            if event.kind == "job_failed":
                return "failed"
            if event.kind == "job_timed_out":
                return "timeout"
        return None


    async def job_needs_attention(db: AsyncSession, job: DeliveryJob) -> bool:
        outcome = await delivery_job_outcome(db, job.id)
        return outcome in ("failed", "timeout") and job.status != "archived"
