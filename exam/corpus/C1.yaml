    import type { Order, OrderEvent, OrderStatus } from "./types";

    export type OrderCardModel = {
      id: string;
      title: string;
      status: OrderStatus;
      delivered: boolean;
      returned: boolean;
      isFinished: boolean;
      lastEventAt: string;
      canCancel: boolean;
    };

    export function orderCardModel(order: Order, events: OrderEvent[]): OrderCardModel {
      const delivered = events.some(e => e.type === "delivered");
      const returned = events.some(e => e.type === "returned_to_sender");
      const lastEvent = events[events.length - 1];
      const isFinished = delivered || returned;

      return {
        id: order.id,
        title: `Order No. ${order.number}`,
        status: order.status,
        delivered,
        returned,
        isFinished,
        lastEventAt: lastEvent?.createdAt ?? order.createdAt,
        canCancel: !isFinished && order.paymentConfirmed,
      };
    }
