  source: report on the time and frequency of events in the analytics module
  code: |
    from statistics import median

    from app.shipping.models import ShipmentEvent


    def _first(events: list[ShipmentEvent], event_type: str) -> ShipmentEvent | None:
        return next((e for e in events if e.event_type == event_type), None)


    def dispatch_delays_minutes(events_by_shipment: dict[int, list[ShipmentEvent]]) -> list[float]:
        delays: list[float] = []
        for events in events_by_shipment.values():
            created = _first(events, "created")
            picked = _first(events, "picked_up")
            if created is None or picked is None:
                continue
            delays.append((picked.created_at - created.created_at).total_seconds() / 60)
        return delays


    def delay_report(events_by_shipment: dict[int, list[ShipmentEvent]]) -> dict:
        delays = dispatch_delays_minutes(events_by_shipment)
        reattempts = sum(
            1
            for events in events_by_shipment.values()
            for e in events
            if e.event_type == "delivery_failed"
        )
        return {
            "shipments": len(events_by_shipment),
            "median_delay_min": median(delays) if delays else None,
            "max_delay_min": max(delays, default=None),
            "reattempts_total": reattempts,
        }
