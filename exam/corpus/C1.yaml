        """Attempt result for the route list."""
        events = (
            await db.scalars(select(AttemptEvent).where(AttemptEvent.attempt_id == attempt_id))
        ).all()
        if any(e.event_type == "handed_over" for e in events):
            return AttemptOutcome.DELIVERED
        no_answer = sum(1 for e in events if e.event_type == "no_answer")
        if no_answer >= 3 or any(e.event_type == "refused" for e in events):
            return AttemptOutcome.FAILED
        return AttemptOutcome.IN_PROGRESS


    async def attempt_response(db: AsyncSession, attempt_id: int) -> dict:
        attempt = await db.get(DeliveryAttempt, attempt_id)
        return {
            "id": attempt.id,
            "courier_id": attempt.courier_id,
            "result_status": attempt.result_status,
            "outcome": (await attempt_outcome(db, attempt_id)).value,
        }
