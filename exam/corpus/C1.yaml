    from collections import Counter
    from datetime import timedelta
    from statistics import median

    from sqlalchemy import select
    from sqlalchemy.orm import Session

    from app.warehouse.models import DockEvent


    def dock_wait_report(session: Session, dock_id: int) -> dict:
        """Waiting time at the ramp and event frequency."""
        events = session.scalars(
            select(DockEvent).where(DockEvent.dock_id == dock_id).order_by(DockEvent.occurred_at)
        ).all()
        waits: list[timedelta] = []
        arrived_at = {}
        for event in events:
            if event.event_type == "truck_arrived":
                arrived_at[event.truck_id] = event.occurred_at
            elif event.event_type == "unloading_started" and event.truck_id in arrived_at:
                waits.append(event.occurred_at - arrived_at.pop(event.truck_id))
        counts = Counter(e.event_type for e in events)
        return {
            "dock_id": dock_id,
            "median_wait_minutes": (
                median(w.total_seconds() / 60 for w in waits) if waits else None
            ),
            "arrivals": counts["truck_arrived"],
            "repeat_scans": counts["scan_repeated"],
        }
