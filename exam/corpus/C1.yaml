  card: C1
  expected: clean
  path: migrations/versions/4c1d7a90b2e5_shipment_status_backfill.py
  why: The migration folds the event log into a stored field once; this is a data migration module from the exceptions list.
  source: schema migration that fills the new state field from the event log
  code: |
    """fill shipments.status from shipment_events

    Revision ID: 4c1d7a90b2e5
    Revises: 9a03f5d1c6b8
    """
    import sqlalchemy as sa
    from alembic import op

    LAST_EVENT_TO_STATUS = {
        "picked_up": "in_transit",
        "delivery_failed": "returning",
        "delivered": "delivered",
        "cancelled": "cancelled",
    }


    def upgrade() -> None:
        bind = op.get_bind()
        shipments = sa.table("shipments", sa.column("id"), sa.column("status"))
        events = sa.table(
            "shipment_events",
            sa.column("shipment_id"),
            sa.column("event_type"),
            sa.column("created_at"),
        )
        rows = bind.execute(
            sa.select(events.c.shipment_id, events.c.event_type).order_by(events.c.created_at)
        ).all()
        last_event = {}
        for shipment_id, event_type in rows:
            last_event[shipment_id] = event_type
        for shipment_id, event_type in last_event.items():
            status = LAST_EVENT_TO_STATUS.get(event_type, "created")
            bind.execute(
                shipments.update().where(shipments.c.id == shipment_id).values(status=status)
            )
