    from sqlalchemy import select
    from sqlalchemy.orm import Session

    from app.couriers.models import Courier, CourierEvent

    REQUIRED_STEPS = {"documents_signed", "instruction_passed", "kit_issued"}


    def is_onboarding_complete(session: Session, courier_id: int) -> bool:
        """Whether all courier onboarding steps are passed."""
        types = set(
            session.scalars(
                select(CourierEvent.event_type).where(CourierEvent.courier_id == courier_id)
            )
        )
        return REQUIRED_STEPS <= types


    def courier_profile(session: Session, courier: Courier) -> dict:
        # profile fields for the dispatcher screen
        return {
            "id": courier.id,
            "full_name": courier.full_name,
            "depot_id": courier.depot_id,
            "onboarding_status": courier.onboarding_status,
            "onboarding_done": is_onboarding_complete(session, courier.id),
        }
