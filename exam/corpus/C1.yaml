  code: |
    """One-off fill of the stage field of shipments from the event log."""
    import argparse

    from sqlalchemy import select
    from sqlalchemy.orm import Session

    from app.db import SessionLocal
    from app.shipping.models import Shipment, ShipmentEvent

    STAGE_BY_EVENT = {
        "created": "accepted",
        "picked_up": "in_transit",
        "delivered": "delivered",
        "returned": "returned",
    }


    def backfill_batch(session: Session, last_id: int, size: int) -> int:
        shipments = session.scalars(
            select(Shipment).where(Shipment.id > last_id).order_by(Shipment.id).limit(size)
        ).all()
        for shipment in shipments:
            events = session.scalars(
                select(ShipmentEvent)
                .where(ShipmentEvent.shipment_id == shipment.id)
                .order_by(ShipmentEvent.occurred_at)
            ).all()
            stage = "accepted"
            for event in events:
                stage = STAGE_BY_EVENT.get(event.event_type, stage)
            shipment.stage = stage
        session.commit()
        return shipments[-1].id if shipments else last_id


    def main() -> None:
        parser = argparse.ArgumentParser()
        parser.add_argument("--batch", type=int, default=500)
        args = parser.parse_args()
        last_id = 0
        with SessionLocal() as session:
            while True:
                next_id = backfill_batch(session, last_id, args.batch)
                if next_id == last_id:
                    break
                last_id = next_id


    if __name__ == "__main__":
        main()
