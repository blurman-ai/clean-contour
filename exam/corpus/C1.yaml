  source: booking a receiving window at the ramp, protected against a repeated request by the token
  code: |
    from datetime import datetime

    from sqlalchemy.orm import Session

    from app.warehouse.models import SlotEvent, SlotState, TimeSlot


    class SlotUnavailable(Exception):
        pass


    def book_slot(session: Session, slot: TimeSlot, carrier_id: int, dedup_token: str) -> TimeSlot:
        """Books a receiving window; a repeat with the same token changes nothing."""
        if any(e.dedup_token == dedup_token for e in slot.events):
            return slot
        if slot.state != SlotState.FREE:
            raise SlotUnavailable(slot.id)
        slot.carrier_id = carrier_id
        slot.booked_at = datetime.utcnow()
        session.add(
            SlotEvent(slot_id=slot.id, event_type="booked", carrier_id=carrier_id, dedup_token=dedup_token)
        )
        session.commit()
        return slot
