    from functools import reduce

    from app.shifts.models import Shift, ShiftEvent


    def _fold(state: str, event: ShiftEvent) -> str:
        if event.event_type == "shift_started":
            return "active"
        if event.event_type == "break_started":
            return "on_break"
        if event.event_type == "break_finished":
            return "active"
        if event.event_type == "shift_closed":
            return "closed"
        return state


    def shift_state(shift: Shift, events: list[ShiftEvent]) -> str:
        ordered = sorted(events, key=lambda e: e.created_at)
        return reduce(_fold, ordered, "planned")


    def can_start_break(shift: Shift, events: list[ShiftEvent]) -> bool:
        return shift.status != "cancelled" and shift_state(shift, events) == "active"
