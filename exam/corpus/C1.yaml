  code: |
    from sqlalchemy import select
    from sqlalchemy.ext.asyncio import AsyncSession

    from app.shipping.models import Shipment, ShipmentEvent
    from app.shipping.schemas import ScanResult


    async def register_scan(
        db: AsyncSession, shipment_id: int, request_key: str, point_id: int
    ) -> ScanResult:
        shipment = await db.get(Shipment, shipment_id)
        if shipment is None:
            raise LookupError("shipment_not_found")
        events = (
            await db.scalars(
                select(ShipmentEvent).where(ShipmentEvent.shipment_id == shipment_id)
            )
        ).all()
        request_token_already_taken = any(e.request_key == request_key for e in events)
        if request_token_already_taken:
            return ScanResult(duplicate=True, status=shipment.status)
        db.add(
            ShipmentEvent(
                shipment_id=shipment_id,
                event_type="scanned",
                request_key=request_key,
                point_id=point_id,
            )
        )
        await db.commit()
        return ScanResult(duplicate=False, status=shipment.status)
