  code: |
    import { useMemo } from "react";
    import type { Route, RouteEvent } from "./types";

    export interface RouteSummary {
      id: string;
      courierName: string;
      stopsDone: number;
      stopsTotal: number;
      finished: boolean;
    }

    export function useRouteSummary(route: Route, events: RouteEvent[]): RouteSummary {
      return useMemo(() => {
        const stopsDone = events.filter(e => e.type === "stop_completed").length;
        // recompute on every new route event
        const finished = events.some(e => e.type === "route_closed");
        return {
          id: route.id,
          courierName: route.courier.fullName,
          stopsDone,
          stopsTotal: route.stops.length,
          finished,
        };
      }, [route, events]);
    }

    export function routeStatusLabel(route: Route, summary: RouteSummary): string {
      if (route.status === "archived") return "Archived";
      return summary.finished ? "Finished" : "On the way";
    }
