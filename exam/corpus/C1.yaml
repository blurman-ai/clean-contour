  code: |
    import type { Order, OrderEvent } from "../model/types";
    import { postOrderEvent } from "../api/orderEvents";

    export type HandoverResult = {
      accepted: boolean;
      orderStatus: Order["status"];
    };

    export async function confirmHandover(
      order: Order,
      events: OrderEvent[],
      requestKey: string,
    ): Promise<HandoverResult> {
      // the key is created once per button press
      const alreadySent = events.some(e => e.requestKey === requestKey);
      if (alreadySent) {
        return { accepted: false, orderStatus: order.status };
      }
      if (order.status === "cancelled") {
        throw new Error("order_cancelled");
      }
      await postOrderEvent(order.id, {
        type: "handover_confirmed",
        requestKey,
        at: new Date().toISOString(),
      });
      return { accepted: true, orderStatus: order.status };
    }
