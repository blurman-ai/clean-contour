    from app.shipping.models import Shipment, ShipmentEvent, ShipmentStatus


    def shipment_stage(shipment: Shipment, events: list[ShipmentEvent]) -> str:
        """Shipment stage for the card in the account area."""
        stage = "created"
        for event in sorted(events, key=lambda e: e.created_at):
            if event.event_type == "picked_up":
                stage = "in_transit"
            elif event.event_type == "delivery_failed":
                stage = "returning"
            elif event.event_type == "delivered":
                return "delivered"
            elif event.event_type == "cancelled":
                return "cancelled"
        return stage


    def shipment_card(shipment: Shipment, events: list[ShipmentEvent]) -> dict:
        return {
            "id": shipment.id,
            "number": shipment.number,
            "recipient": shipment.recipient_name,
            "stage": shipment_stage(shipment, events),
            "updated_at": shipment.updated_at,
            "is_final": shipment.status in ShipmentStatus.FINAL,
        }
