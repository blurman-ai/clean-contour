  why: The stage of an application is obtained by a reduce fold over the event log, although the application response has a status field.
  source: frontend function that folds the event log of an application into a stage
  code: |
    import type { Ticket, TicketEvent } from "../model/types";

    export type TicketStage = "new" | "assigned" | "in_work" | "resolved" | "closed";

    export function ticketStage(ticket: Ticket, events: TicketEvent[]): TicketStage {
      const ordered = [...events].sort((a, b) => a.seq - b.seq);
      return ordered.reduce<TicketStage>((stage, event) => {
        switch (event.type) {
          case "assigned":
            return "assigned";
          case "work_started":
            return "in_work";
          case "resolved":
            return "resolved";
          case "closed":
            return "closed";
          case "reopened":
            return "in_work";
          default:
            return stage;
        }
      }, "new");
    }

    export function ticketBadgeText(ticket: Ticket, events: TicketEvent[]): string {
      const stage = ticketStage(ticket, events);
      const suffix = ticket.status === "archived" ? " (archived)" : "";
      return STAGE_TEXT[stage] + suffix;
    }

    const STAGE_TEXT: Record<TicketStage, string> = {
      new: "New",
      assigned: "Assigned",
      in_work: "In progress",
      resolved: "Resolved",
      closed: "Closed",
    };
