- id: C11-05
  card: C11
  expected: clean
  path: background/voice_notes.py
  why: The search fires on processing and waiting, but the record has a lease, a timeout and refusal codes, and a record with exhausted attempts or an expired lease goes to failed.
  source: background handler with a lease and a limited number of attempts
  code: |
    LEASE_SECONDS = SCAN_TIMEOUT_SECONDS + 60
    MAX_ATTEMPTS = 3


    async def claim_one(session_factory):
        now = utcnow()
        async with session_factory() as db:
            note = await db.scalar(
                select(VoiceNote)
                .where(
                    VoiceNote.status == "processing",
                    or_(VoiceNote.lease_until.is_(None), VoiceNote.lease_until <= now),
                )
                .order_by(VoiceNote.created_at)
                .with_for_update(skip_locked=True)
                .limit(1)
            )
            if note is None:
                await db.rollback()
                return None
            if note.attempts >= MAX_ATTEMPTS:
                note.status = "failed"
                note.error_code = "transcription_attempts_exhausted"
                note.lease_id = None
                note.lease_until = None
                await db.commit()
                return None
            lease_id = uuid.uuid4()
            note.attempts += 1
            note.lease_id = lease_id
            note.lease_until = now + timedelta(seconds=LEASE_SECONDS)
            await db.commit()
            return note.id, lease_id, note.storage_path, note.attempts


    async def transcribe_one(session_factory, claim) -> None:
        note_id, lease_id, path, attempts = claim
        text, error_code = None, None
        try:
            text = await asyncio.wait_for(
                run_transcriber(path), timeout=SCAN_TIMEOUT_SECONDS
            )
        except asyncio.TimeoutError:
            error_code = "transcription_timeout"
        except TranscriptionError as exc:
            error_code = exc.code
        await store_result(session_factory, note_id, lease_id, text, error_code, attempts)

