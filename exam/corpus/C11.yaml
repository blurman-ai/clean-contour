  why: The document gets exporting before the service call, but a timeout and any error move it to failed with a code.
  source: server task handler in TypeScript with a timeout and a failure state
  code: |
    const RENDER_TIMEOUT_MS = 30_000;

    function withTimeout<T>(promise: Promise<T>, ms: number): Promise<T> {
      return new Promise<T>((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error("render_timeout")), ms);
        promise.then(
          value => {
            clearTimeout(timer);
            resolve(value);
          },
          error => {
            clearTimeout(timer);
            reject(error);
          },
        );
      });
    }

    export async function exportReport(db: Db, documentId: string): Promise<void> {
      await db.documents.update(documentId, { exportStatus: "exporting" });
      try {
        const file = await withTimeout(reportRenderer.render(documentId), RENDER_TIMEOUT_MS);
        const url = await storage.put(`exports/${documentId}.pdf`, file);
        await db.documents.update(documentId, { exportStatus: "ready", exportUrl: url });
      } catch (error) {
        const timedOut = error instanceof Error && error.message === "render_timeout";
        await db.documents.update(documentId, {
          exportStatus: "failed",
          exportError: timedOut ? "export_timeout" : "export_failed",
        });
        logger.warn({ documentId, error }, "report export failed");
      }
    }

