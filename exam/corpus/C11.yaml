- id: C11-09
  card: C11
  expected: clean
  path: pickups/queue.py
  why: The request moves to queued before publishing to the queue, but the same module names the cleaner expire_stale_pickups that moves overdue queued and dispatching to failed.
  source: putting a request in a queue and a periodic cleaner of overdue states
  code: |
    STALE_AFTER = timedelta(minutes=15)


    async def enqueue_pickup(db, queue, request_id) -> PickupRequest:
        pickup = PickupRequest(id=request_id, status="queued", queued_at=utcnow())
        db.add(pickup)
        await db.commit()
        await queue.publish("pickup.dispatch", {"pickup_id": str(pickup.id)})
        return pickup


    async def expire_stale_pickups(db) -> int:
        """Run by the scheduler once a minute."""
        stale = (
            await db.scalars(
                select(PickupRequest)
                .where(
                    PickupRequest.status.in_(("queued", "dispatching")),
                    PickupRequest.updated_at < utcnow() - STALE_AFTER,
                )
                .with_for_update(skip_locked=True)
                .limit(100)
            )
        ).all()
        for pickup in stale:
            pickup.status = "failed"
            pickup.error_code = "pickup_expired"
            pickup.finished_at = utcnow()
        await db.commit()
        return len(stale)

