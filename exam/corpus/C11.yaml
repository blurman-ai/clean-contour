  code: |
    async def request_shift_swap(db, shift_id, requester_id, partner_id) -> ShiftSwap:
        shift = await db.get(Shift, shift_id)
        if shift is None or shift.employee_id != requester_id:
            raise SwapRefused("shift_not_found")
        existing = await db.scalar(
            select(ShiftSwap).where(
                ShiftSwap.shift_id == shift_id, ShiftSwap.status == "pending"
            )
        )
        if existing is not None:
            raise SwapRefused("swap_already_requested")
        swap = ShiftSwap(
            shift_id=shift_id,
            requester_id=requester_id,
            partner_id=partner_id,
            status="pending",
            requested_at=utcnow(),
        )
        db.add(swap)
        await db.commit()
        return swap


    async def decide_shift_swap(db, swap_id, supervisor_id, approve: bool) -> ShiftSwap:
        swap = await db.get(ShiftSwap, swap_id, with_for_update=True)
        if swap.status != "pending":
            raise SwapRefused("swap_already_decided")
        swap.status = "approved" if approve else "rejected"
        swap.decided_by = supervisor_id
        swap.decided_at = utcnow()
        await db.commit()
        return swap

