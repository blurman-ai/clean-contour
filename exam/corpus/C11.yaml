  card: C11
  expected: dirty
  path: bookings/carrier_wait.py
  why: The booking gets the state awaiting_carrier and is committed, then polling the carrier goes without a limit on time and number of attempts; there is no move to failed or timeout.
  source: Waiting for a booking confirmation from an external carrier with a polling loop, by form
  code: |
    import asyncio
    import logging

    from bookings.models import Booking
    from carriers.client import CarrierClient

    logger = logging.getLogger(__name__)

    POLL_SECONDS = 5


    async def wait_for_carrier(db, booking: Booking, carrier: CarrierClient) -> None:
        """Waits until the carrier confirms the booking."""
        booking.status = "awaiting_carrier"
        booking.requested_at = utcnow()
        await db.commit()
        # we poll the carrier every POLL_SECONDS
        while True:
            reply = await carrier.get_booking(booking.external_id)
            logger.info("carrier_poll booking=%s state=%s", booking.id, reply.state)
            if reply.state == "confirmed":
                booking.status = "confirmed"
                booking.confirmed_at = utcnow()
                await db.commit()
                return
            await asyncio.sleep(POLL_SECONDS)
