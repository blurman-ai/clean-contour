    const STALE_AFTER_MS = 10 * 60 * 1000;
    const REAP_EVERY_MS = 60 * 1000;

    export async function startStopsSync(db: Db, routeId: string): Promise<void> {
      await db.routes.update(routeId, { syncStatus: "syncing", syncStartedAt: new Date() });
      await syncQueue.add("stops-sync", { routeId });
    }

    export async function reapStalledSyncs(db: Db): Promise<number> {
      const cutoff = new Date(Date.now() - STALE_AFTER_MS);
      const stalled = await db.routes.findMany({
        syncStatus: "syncing",
        syncStartedAt: { lt: cutoff },
      });
      for (const route of stalled) {
        await db.routes.update(route.id, {
          syncStatus: "failed",
          syncError: "sync_expired",
        });
      }
      return stalled.length;
    }

    export function scheduleReaper(db: Db): NodeJS.Timeout {
      // the sweep runs once a minute
      return setInterval(() => {
        void reapStalledSyncs(db);
      }, REAP_EVERY_MS);
    }
