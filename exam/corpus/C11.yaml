    import threading

    from exports.models import Export
    from exports.render import load_rows, render_xlsx
    from exports.storage import upload
    from db import SessionLocal


    def start_export(db, export_id: int) -> None:
        """Marks the export and starts building the file in a separate thread."""
        export = db.get(Export, export_id)
        export.status = "generating"
        db.commit()
        thread = threading.Thread(target=_run_export, args=(export_id,), daemon=True)
        thread.start()


    def _run_export(export_id: int) -> None:
        with SessionLocal() as db:
            export = db.get(Export, export_id)
            rows = load_rows(db, export.filters)
            # the finished file is put into external storage
            url = upload(render_xlsx(rows), name=f"export-{export_id}.xlsx")
            export.status = "ready"
            export.file_url = url
            export.rows_count = len(rows)
            db.commit()
