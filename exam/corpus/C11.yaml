- id: C11-01
  card: C11
  expected: dirty
  path: dispatch/worker.py
  why: The task gets the dispatching state before the call to the external carrier, and the fragment has no path to failed on an exception, a timeout, or the death of the process, and no cleaner.
  source: loop of a background task queue handler with a call to an external service
  code: |
    import asyncio
    import logging

    logger = logging.getLogger(__name__)

    POLL_SECONDS = 2.0


    async def run_dispatch_worker(session_factory, carrier_api) -> None:
        while True:
            async with session_factory() as db:
                job = await claim_next_job(db)
                if job is None:
                    await asyncio.sleep(POLL_SECONDS)
                    continue
                job.status = "dispatching"
                job.started_at = utcnow()
                await db.commit()
                logger.info("dispatch_started job=%s", job.id)
                metrics.inc("dispatch_started")

                response = await carrier_api.create_pickup(job.payload)

                job.carrier_ref = response["ref"]
                job.status = "dispatched"
                job.finished_at = utcnow()
                await db.commit()
                metrics.inc("dispatch_done")

- id: C11-02
  card: C11
  expected: clean
  path: pricing/estimates.py
  why: The estimate gets pending before the external call, but a timeout, a service refusal and a cancellation move it to failed with a code, that is, the way out of the wait is in the fragment.
  source: service function requesting an estimate from an external service with a timeout and a failure state
  code: |
    import asyncio

    ESTIMATE_TIMEOUT_SECONDS = 20


    async def request_estimate(db, shipment_id, pricing_api) -> Estimate:
        estimate = Estimate(shipment_id=shipment_id, status="pending")
        db.add(estimate)
        await db.commit()
        try:
            async with asyncio.timeout(ESTIMATE_TIMEOUT_SECONDS):
                quote = await pricing_api.quote(shipment_id)
        except TimeoutError:
            estimate.status = "failed"
            estimate.error_code = "estimate_timeout"
        except PricingApiError as exc:
            estimate.status = "failed"
            estimate.error_code = exc.code
        except asyncio.CancelledError:
            estimate.status = "failed"
            estimate.error_code = "estimate_cancelled"
            await db.commit()
            raise
        else:
            estimate.status = "ready"
            estimate.amount = quote.amount
        await db.commit()
        return estimate

