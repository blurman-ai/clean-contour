    import subprocess

    PRINT_TIMEOUT_SECONDS = 20


    def print_label(session, job_id: int) -> None:
        job = session.get(PrintJob, job_id)
        job.status = "printing"
        session.commit()
        try:
            # the printer name is taken from the task
            subprocess.run(
                ["lp", "-d", job.printer, job.file_path],
                check=True,
                timeout=PRINT_TIMEOUT_SECONDS,
                capture_output=True,
            )
        except subprocess.TimeoutExpired:
            job.status = "failed"
            job.error_code = "printer_timeout"
        except subprocess.CalledProcessError as exc:
            job.status = "failed"
            job.error_code = "printer_refused"
            job.error_detail = exc.stderr.decode("utf-8", "replace")[:200]
        else:
            job.status = "printed"
            job.printed_at = utcnow()
        session.commit()
