  source: background canvas component with a render unavailability flag
  code: |
    export function MapBackdrop() {
      const canvasRef = useRef<HTMLCanvasElement | null>(null);
      const [snapshot, setSnapshot] = useState<TileSnapshot | null>(null);
      const [now, setNow] = useState(() => new Date());
      const [failed, setFailed] = useState(false);

      useEffect(() => {
        let cancelled = false;
        void loadMapTiles().then(next => {
          if (!cancelled) setSnapshot(next);
        });
        return () => {
          cancelled = true;
        };
      }, []);

      useEffect(() => {
        const id = window.setInterval(() => setNow(new Date()), TIME_TICK_MS);
        return () => window.clearInterval(id);
      }, []);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas || failed) return;

        const gl = canvas.getContext("webgl", { alpha: true, depth: false });
        if (!gl) {
          setFailed(true);
          return;
        }

        const vertex = buildShader(gl, gl.VERTEX_SHADER, VERT);
        const fragment = buildShader(gl, gl.FRAGMENT_SHADER, FRAG);
        const program = gl.createProgram();
        if (!vertex || !fragment || !program) {
          setFailed(true);
          return;
        }
        gl.attachShader(program, vertex);
        gl.attachShader(program, fragment);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          setFailed(true);
          return;
        }
        return startRenderLoop(gl, program, snapshot, now);
      }, [failed, snapshot, now]);

      if (failed) return <StaticMapFallback />;
      return <canvas ref={canvasRef} aria-hidden />;
    }
