  code: |
    export function RouteStopsNav({ contentRef, contentKey, maxLevel = 2 }: RouteStopsNavProps) {
      const [items, setItems] = useState<StopItem[]>([]);
      const [activeKey, setActiveKey] = useState<string | null>(null);

      const refresh = useCallback(() => {
        const next = collectStops(contentRef.current, maxLevel);
        setItems(next);
        setActiveKey(prev =>
          prev && next.some(item => item.key === prev) ? prev : next[0]?.key ?? null,
        );
      }, [contentRef, maxLevel]);

      useEffect(() => {
        refresh();
        const root = contentRef.current;
        if (!root || typeof MutationObserver === "undefined") return;
        const observer = new MutationObserver(() => refresh());
        observer.observe(root, { childList: true, subtree: true });
        return () => observer.disconnect();
      }, [contentKey, contentRef, refresh]);

      useEffect(() => {
        const anchor = items[0]?.element;
        const scrollRoot = anchor ? findScrollContainer(anchor) : null;
        if (!scrollRoot) return;

        let frame = 0;
        const update = () => {
          frame = 0;
          setActiveKey(
            pickActiveStopKey(items, scrollRoot.getBoundingClientRect().top),
          );
        };
        const onScroll = () => {
          if (frame) return;
          frame = window.requestAnimationFrame(update);
        };

        update();
        scrollRoot.addEventListener("scroll", onScroll, { passive: true });
        return () => {
          if (frame) window.cancelAnimationFrame(frame);
          scrollRoot.removeEventListener("scroll", onScroll);
        };
      }, [items]);

      if (items.length === 0) return null;
      return <StopsList items={items} activeKey={activeKey} onPick={setActiveKey} />;
    }
