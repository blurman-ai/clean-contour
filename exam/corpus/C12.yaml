    import { useInvoiceQuery } from "@/entities/invoice/api/useInvoiceQuery";
    import {
      InvoiceCancelledView,
      InvoiceDraftView,
      InvoiceIssuedView,
      InvoiceOverdueView,
      InvoicePaidView,
      InvoiceSkeleton,
      LoadError,
    } from "./views";

    export function InvoiceScreen({ invoiceId }: { invoiceId: string }) {
      const { data: invoice, isLoading, isError, refetch } = useInvoiceQuery(invoiceId);

      if (isLoading) return <InvoiceSkeleton />;
      if (isError || !invoice) return <LoadError onRetry={() => void refetch()} />;

      // The view is chosen by the stage that the server returns.
      switch (invoice.stage) {
        case "draft":
          return <InvoiceDraftView invoice={invoice} />;
        case "issued":
          return <InvoiceIssuedView invoice={invoice} />;
        case "overdue":
          return <InvoiceOverdueView invoice={invoice} />;
        case "paid":
          return <InvoicePaidView invoice={invoice} />;
        case "cancelled":
          return <InvoiceCancelledView invoice={invoice} />;
      }
    }
