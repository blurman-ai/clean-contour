  source: pure function that derives the receiving stage from several fields of the manifest response, by form
  code: |
    import type { ReceivingManifest } from "@/shared/api/types";

    export type ReceivingStage =
      | "loading"
      | "counting"
      | "ready_to_seal"
      | "sealed"
      | "handed_over";

    type ManifestFields = Pick<
      ReceivingManifest,
      "pallets_expected" | "pallets_scanned" | "sealed_at" | "carrier_signed_at"
    >;

    // The stage is shown in the manifest header and on the card in the receiving list.
    export function resolveReceivingStage(
      manifest: ManifestFields | null | undefined,
    ): ReceivingStage {
      if (!manifest) return "loading";
      if (manifest.carrier_signed_at) return "handed_over";
      if (manifest.sealed_at) return "sealed";
      if (
        manifest.pallets_expected > 0 &&
        manifest.pallets_scanned >= manifest.pallets_expected
      ) {
        return "ready_to_seal";
      }
      return "counting";
    }

    export function stageLabelKey(stage: ReceivingStage): string {
      return `receiving.stage.${stage}`;
    }

    // A pallet can be added until the receiving reaches the seal.
    export function canAddPallet(stage: ReceivingStage): boolean {
      return stage === "counting" || stage === "ready_to_seal";
    }
