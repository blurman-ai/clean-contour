  source: store with a polling loop of the recalculation task that declares a failure by the local time, not a hook, by form
  code: |
    import { create } from "zustand";
    import { fetchRecalcJob } from "@/shared/api/tariffs";

    const POLL_MS = 3_000;
    const GIVE_UP_MS = 120_000;

    type RecalcStatus = "idle" | "running" | "done" | "failed";

    type RecalcStore = {
      jobId: string | null;
      status: RecalcStatus;
      watch: (jobId: string) => void;
      reset: () => void;
    };

    let timer: ReturnType<typeof setInterval> | null = null;

    function stopTimer() {
      if (timer) clearInterval(timer);
      timer = null;
    }

    export const useRecalcStore = create<RecalcStore>(set => ({
      jobId: null,
      status: "idle",
      // The recalculation runs on the server; here we only wait for its end.
      watch: jobId => {
        stopTimer();
        const startedAt = Date.now();
        set({ jobId, status: "running" });
        timer = setInterval(async () => {
          if (Date.now() - startedAt > GIVE_UP_MS) {
            stopTimer();
            set({ status: "failed" });
            return;
          }
          try {
            const job = await fetchRecalcJob(jobId);
            if (job.finished) {
              stopTimer();
              set({ status: "done" });
            }
          } catch {
            // the next tick will repeat the request
          }
        }, POLL_MS);
      },
      reset: () => {
        stopTimer();
        set({ jobId: null, status: "idle" });
      },
    }));
