  code: |
    export function useShipmentResume(activeShipmentId: string | null, ownerId: string) {
      // The packing queue lives in the browser: a localStorage key per user.
      const [queueJobs] = useState(() => readQueueJobs(ownerId));
      const listQuery = useShipmentListQuery();
      const layoutQuery = useShipmentStructureQuery(activeShipmentId);

      const listShipment = listQuery.items.find(item => item.shipment_id === activeShipmentId);
      const resumeStructure = layoutQuery.data;

      const resumeStillPacking = Boolean(
        (activeShipmentId && hasActiveQueueJob(queueJobs, activeShipmentId)) ||
          (listShipment &&
            (isShipmentPacking(listShipment) ||
              listShipment.packing_in_progress === true)),
      );

      const resumeRouteReady = Boolean(
        resumeStructure?.route_ready || (listShipment && isRouteReady(listShipment)),
      );

      const resumeDeliveredId =
        resumeStructure?.delivery_id?.trim() || listShipment?.delivery_id?.trim() || null;

      const resumeAlreadyDelivered = Boolean(
        resumeDeliveredId ||
          resumeStructure?.phase === "delivered" ||
          resumeStructure?.status === "delivered" ||
          listShipment?.status === "delivered",
      );

      const shouldShowDispatchReview =
        resumeRouteReady &&
        !resumeStillPacking &&
        !resumeAlreadyDelivered &&
        !listShipment?.has_completed_batch;

      return {
        resumeStillPacking,
        resumeAlreadyDelivered,
        shouldShowDispatchReview,
        resumeDeliveredId,
      };
    }
