- id: C12-08
  card: C12
  expected: dirty
  path: src/widgets/photo-check/model/usePhotoInspection.ts
  why: The manual review state of a check is stored on the server, and the hook sets it by a browser timer of 90 seconds (questions 1 and 2).
  source: screen hook with polling and a timer waiting for a decision on a submitted answer
  code: |
    type InspectionState = {
      step_id: string;
      status: "pending" | "needs_review" | "passed" | "failed";
    };

    type PendingPhotoCheck = {
      stepId: string;
      startedAt: number;
      resubmit: () => Promise<InspectionState>;
    };

    export function usePhotoInspection(sessionKey: string) {
      const [pendingCheck, setPendingCheck] = useState<PendingPhotoCheck | null>(null);
      const [reviewPending, setReviewPending] = useState<{ stepId: string } | null>(null);

      useEffect(() => {
        setPendingCheck(null);
        setReviewPending(null);
      }, [sessionKey]);

      // The photo is accepted, the decision on it comes later: we ask the server again
      // every 10 seconds, and after 90 seconds we consider that the check went to manual review.
      useEffect(() => {
        if (!pendingCheck) return;
        let cancelled = false;
        let timer: ReturnType<typeof setTimeout>;
        const POLL_MS = 10_000;
        const MAX_WAIT_MS = 90_000;

        const tick = async () => {
          if (cancelled) return;
          if (Date.now() - pendingCheck.startedAt >= MAX_WAIT_MS) {
            setReviewPending({ stepId: pendingCheck.stepId });
            setPendingCheck(null);
            return;
          }
          try {
            await pendingCheck.resubmit();
          } catch {
            // We will retry on the next tick: the photo is already accepted and does not change.
          }
          if (cancelled) return;
          timer = setTimeout(() => void tick(), POLL_MS);
        };

        timer = setTimeout(() => void tick(), POLL_MS);
        return () => {
          cancelled = true;
          clearTimeout(timer);
        };
      }, [pendingCheck]);

      const controlsLocked = Boolean(pendingCheck) || Boolean(reviewPending);
      return { pendingCheck, reviewPending, controlsLocked, startCheck: setPendingCheck };
    }
