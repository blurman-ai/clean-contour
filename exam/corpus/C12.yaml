  card: C12
  expected: dirty
  path: src/shared/api/lib/shipmentPhase.ts
  why: The shipment stage is assembled in the browser from the phase field and the revision status together, instead of one field of the server response (question 2).
  source: function that derives the entity stage from several list fields and the revision status on the client side
  code: |
    const BATCH_STATUS = {
      PACKING: "packing",
      DONE: "done",
      FAILED: "failed",
      TIMEOUT: "timeout",
    } as const;

    const FLOW_PHASE = {
      ROUTE_BUILDING: "route_building",
      PACKING: "packing",
      READY_TO_SEND: "ready_to_send",
      DELIVERED: "delivered",
    } as const;

    export type ShipmentPhase =
      | "initial"
      | "delivered"
      | "failed"
      | "packing"
      | "route_pending"
      | "route_ready";

    export function computeShipmentPhase(input: {
      listItem?: ShipmentListItem | ShipmentStatusDetail | null;
      activeBatch?: PackingRevision | null;
    }): ShipmentPhase {
      const item = input.listItem;
      if (!item) return "initial";

      const revision = input.activeBatch;
      const listItem = item as ShipmentListItem & {
        active_batch_status?: string | null;
      };
      const revStatus = revision?.status ?? listItem.active_batch_status ?? null;

      if (item.phase === FLOW_PHASE.DELIVERED) return "delivered";
      if (
        isTerminalError(item as StatusCarrier) ||
        revStatus === BATCH_STATUS.FAILED ||
        revStatus === BATCH_STATUS.TIMEOUT
      ) {
        return "failed";
      }
      if (
        item.phase === FLOW_PHASE.PACKING ||
        (item.phase !== FLOW_PHASE.READY_TO_SEND &&
          revStatus === BATCH_STATUS.PACKING)
      ) {
        return "packing";
      }
      if (isRouteBuilding(item as StatusCarrier)) return "route_pending";
      if (isRouteReady(item as StatusCarrier)) return "route_ready";
      return "route_pending";
    }
- id: C12-02
  card: C12
  expected: clean
  path: src/shared/lib/useTickerText.ts
  why: The state and phase fields describe a text typing animation in the interface; there is no such entity on the server.
  source: hook of a phrase typing animation driven by a timer
  code: |
    export function useTickerText({
      phrases,
      enabled = true,
      typingSpeed = 48,
      deletingSpeed = 22,
      pauseAfterType = 1800,
      pauseAfterDelete = 400,
    }: UseTickerTextOptions): TickerState {
      const [state, setState] = useState<TickerInternal>(initialTickerState);

      useEffect(() => {
        if (!enabled || phrases.length === 0) return;

        const current = phrases[state.phraseIndex] ?? "";
        let delay = typingSpeed;
        let nextState: typeof state | null = null;

        if (state.phase === "typing") {
          const nextChar = state.charIndex + 1;
          nextState = {
            ...state,
            charIndex: nextChar,
            text: current.slice(0, nextChar),
            phase: nextChar >= current.length ? "pausing" : "typing",
          };
        } else if (state.phase === "pausing") {
          nextState = { ...state, phase: "deleting", isTyping: false };
          delay = pauseAfterType;
        } else if (state.phase === "deleting") {
          const nextChar = state.charIndex - 1;
          nextState = {
            ...state,
            charIndex: nextChar,
            text: current.slice(0, nextChar),
            phase: nextChar <= 0 ? "waiting" : "deleting",
          };
          delay = deletingSpeed;
        } else if (state.phase === "waiting") {
          nextState = {
            ...state,
            phraseIndex: (state.phraseIndex + 1) % phrases.length,
            charIndex: 0,
            text: "",
            phase: "typing",
            isTyping: true,
          };
          delay = pauseAfterDelete;
        }

        if (!nextState) return;
        const captured = nextState;
        const id = setTimeout(() => setState(captured), delay);
        return () => clearTimeout(id);
      }, [enabled, state, phrases, typingSpeed, deletingSpeed, pauseAfterType, pauseAfterDelete]);

      return { text: state.text, isTyping: state.isTyping };
    }
