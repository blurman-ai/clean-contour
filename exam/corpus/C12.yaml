  code: |
    export const RUN_STATUS = {
      QUEUED: "queued",
      RUNNING: "running",
      DONE: "done",
      FAILED: "failed",
      TIMEOUT: "timeout",
      CANCELLED: "cancelled",
    } as const;

    export const FLOW_PHASE = {
      LOADING: "loading",
      DISPATCH: "dispatch",
      FAILED: "failed",
      DELIVERED: "delivered",
    } as const;

    export function isRunTerminalFailure(status: string | null | undefined) {
      return (
        status === RUN_STATUS.FAILED ||
        status === RUN_STATUS.TIMEOUT ||
        status === RUN_STATUS.CANCELLED
      );
    }

    export function isDispatchRunFailure(status: ShipmentStatusDetail) {
      return Boolean(
        status.phase === FLOW_PHASE.FAILED ||
          status.status === RUN_STATUS.FAILED ||
          status.status === RUN_STATUS.TIMEOUT ||
          status.status === RUN_STATUS.CANCELLED ||
          isRunTerminalFailure(status.active_run_status) ||
          isRunTerminalFailure(status.completed_run_status) ||
          (!status.dispatch_in_progress && status.error),
      );
    }
