    export function ResendCodeBlock({ token }: { token: string }) {
      const { t } = useTranslation();
      const [resendState, setResendState] = useState<"idle" | "sending" | "sent">("idle");
      const [resendError, setResendError] = useState<string | null>(null);

      const handleResend = async () => {
        if (!token || resendState === "sending") return;
        setResendState("sending");
        setResendError(null);
        try {
          await resendCourierEmail(token);
          setResendState("sent");
        } catch (err: unknown) {
          setResendState("idle");
          if (err instanceof CourierEmailApiError && err.status === 429) {
            setResendError(
              t("courierEmail.errors.resendTooOften", {
                minutes: Math.max(1, Math.ceil((err.retryAfterSec ?? 300) / 60)),
              }),
            );
            return;
          }
          setResendError(t("courierEmail.errors.resendFailed"));
        }
      };

      return (
        <Stack gap="xs">
          <Button
            variant="light"
            loading={resendState === "sending"}
            disabled={resendState === "sent"}
            onClick={() => void handleResend()}
          >
            {resendState === "sent"
              ? t("courierEmail.resendSent")
              : t("courierEmail.resend")}
          </Button>
          {resendError ? <Text c="red" size="sm">{resendError}</Text> : null}
        </Stack>
      );
    }
