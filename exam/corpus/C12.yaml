  why: The report outcome by deadline is determined by the browser clock with its own limit of 15 minutes, although the report state is stored on the server (questions 1 and 2).
  source: status polling loop with a local deadline that moves the entity to a failure by the browser time
  code: |
    const REPORT_QUEUE_TIMEOUT_MS = 15 * 60 * 1000;
    const REPORT_POLL_MS = 2_500;

    export async function pollReportUntilDone(args: {
      queryClient: QueryClient;
      reportId: string;
      runId?: string | null;
    }): Promise<{ runId: string | null; readyToSend: boolean }> {
      const { queryClient, reportId } = args;
      let runId: string | null = args.runId ?? null;
      const deadline = Date.now() + REPORT_QUEUE_TIMEOUT_MS;

      while (true) {
        if (Date.now() >= deadline) {
          throw new ReportQueueFailure("reportQueue.runTimeout", RUN_STATUS.TIMEOUT);
        }
        const status = await queryClient.fetchQuery<ReportStatusDetail>({
          queryKey: queryKeys.report.status(reportId),
          queryFn: () => getReportStatus(reportId),
          staleTime: 0,
        });
        runId = status.active_run_id ?? status.completed_run_id ?? runId;

        if (isReportRunFailure(status)) {
          throw new ReportQueueFailure(
            "reportQueue.runFailed",
            status.error_code ?? undefined,
          );
        }

        if (status.phase === FLOW_PHASE.SENT) {
          return { runId, readyToSend: false };
        }

        const runCompleted =
          status.completed_run_status === RUN_STATUS.DONE ||
          status.active_run_status === RUN_STATUS.DONE;
        if (isReadyToSend(status) || runCompleted) {
          return { runId, readyToSend: true };
        }

        await sleep(REPORT_POLL_MS);
      }
    }
