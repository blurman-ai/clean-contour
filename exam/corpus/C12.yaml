  source: hook that assembles the slot stage from the fields of two requests in useMemo, by form
  code: |
    import { useMemo } from "react";
    import { useDockSlotQuery } from "../api/useDockSlotQuery";
    import { useTruckArrivalQuery } from "../api/useTruckArrivalQuery";

    export type DockSlotStage = "unknown" | "booked" | "unloading" | "unloaded" | "left" | "released";

    export function useDockSlotStage(slotId: string) {
      const slotQuery = useDockSlotQuery(slotId);
      const arrivalQuery = useTruckArrivalQuery(slotId);
      const slot = slotQuery.data;
      const arrival = arrivalQuery.data;

      // The stage is needed by the gate table and by the notification for the warehouse dispatcher.
      const stage = useMemo<DockSlotStage>(() => {
        if (!slot) return "unknown";
        if (slot.released_at) return "released";
        if (arrival?.gate_out_at) return "left";
        if (arrival?.gate_in_at && !arrival.unloading_finished_at) return "unloading";
        if (arrival?.gate_in_at) return "unloaded";
        return "booked";
      }, [slot, arrival]);

      return {
        stage,
        isLoading: slotQuery.isLoading || arrivalQuery.isLoading,
      };
    }
