  why: The route building stage is stored on the server, and the hook sets it in an effect from a flag in localStorage and two response fields (question 2).
  source: hook with a useState stage set in useEffect from browser storage and route fields, by form
  code: |
    import { useCallback, useEffect, useState } from "react";
    import { requestRouteBuild } from "@/shared/api/routes";
    import { useRouteQuery } from "@/entities/route/api/useRouteQuery";

    type BuildPhase = "idle" | "building" | "ready";

    export function useRouteBuildPhase(routeId: string) {
      const { data: route } = useRouteQuery(routeId);
      const storageKey = `route-build-started:${routeId}`;
      const [phase, setPhase] = useState<BuildPhase>("idle");

      // The flag in localStorage is needed so as not to lose the wait after a page reload.
      useEffect(() => {
        const startedHere = localStorage.getItem(storageKey) === "1";
        if (route?.optimized_at) {
          localStorage.removeItem(storageKey);
          setPhase("ready");
        } else if (startedHere || route?.build_requested_at) {
          setPhase("building");
        } else {
          setPhase("idle");
        }
      }, [route?.optimized_at, route?.build_requested_at, storageKey]);

      const start = useCallback(async () => {
        localStorage.setItem(storageKey, "1");
        setPhase("building");
        await requestRouteBuild(routeId);
      }, [routeId, storageKey]);

      return { phase, start };
    }
