  source: form validity function over several input fields and a component that uses it, by form
  code: |
    type PalletFormValues = {
      sku: string;
      quantity: string;
      weightKg: string;
      zone: string | null;
    };

    export function canSubmitPalletForm(values: PalletFormValues, isSaving: boolean): boolean {
      if (isSaving) return false;
      const quantity = Number(values.quantity);
      const weight = Number(values.weightKg.replace(",", "."));
      return (
        values.sku.trim().length > 0 &&
        Number.isInteger(quantity) &&
        quantity > 0 &&
        Number.isFinite(weight) &&
        weight > 0 &&
        values.zone !== null
      );
    }

    export function PalletForm({ onSave }: { onSave: (values: PalletFormValues) => Promise<void> }) {
      const [values, setValues] = useState<PalletFormValues>({
        sku: "",
        quantity: "1",
        weightKg: "",
        zone: null,
      });
      const [isSaving, setIsSaving] = useState(false);
      // The submit button is unavailable until the form is fully filled or while saving is in progress.
      const ready = canSubmitPalletForm(values, isSaving);

      const submit = async () => {
        setIsSaving(true);
        try {
          await onSave(values);
        } finally {
          setIsSaving(false);
        }
      };

      return <PalletFields values={values} onChange={setValues} onSubmit={submit} disabled={!ready} />;
    }
