    type DropStatus = "idle" | "dragging" | "uploading" | "failed";

    export function PriceFileDrop({ onUploaded }: { onUploaded: (priceListId: string) => void }) {
      const { t } = useTranslation();
      const [status, setStatus] = useState<DropStatus>("idle");
      const [fileName, setFileName] = useState<string | null>(null);

      // The file goes to the server right after the choice or the drag.
      const upload = async (file: File) => {
        setFileName(file.name);
        setStatus("uploading");
        try {
          const { price_list_id } = await uploadPriceFile(file);
          setStatus("idle");
          onUploaded(price_list_id);
        } catch {
          setStatus("failed");
        }
      };

      return (
        <Box
          onDragOver={e => {
            e.preventDefault();
            if (status === "idle") setStatus("dragging");
          }}
          onDragLeave={() => setStatus(s => (s === "dragging" ? "idle" : s))}
          onDrop={e => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file) void upload(file);
          }}
          data-active={status === "dragging"}
        >
          <Text size="sm">{fileName ?? t("priceImport.drop.hint")}</Text>
          {status === "uploading" ? <Loader size="xs" /> : null}
          {status === "failed" ? <Text c="red">{t("priceImport.drop.failed")}</Text> : null}
        </Box>
      );
    }
