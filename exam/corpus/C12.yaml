  source: hook that derives in an effect the check stage from several fields of the state snapshot
  code: |
    type CheckSnapshot = {
      current_step_id?: string | null;
      completed?: boolean;
      attempt_status?: "active" | "pending_check" | "closed";
      check_result?: { status: "passed" | "failed" | "needs_review" } | null;
    };

    export function useReviewHold(
      snapshot: CheckSnapshot | null,
      clarification: Clarification | null,
      activeActionStepId: string | null,
    ) {
      const [reviewPending, setReviewPending] = useState<{ stepId: string } | null>(null);

      useEffect(() => {
        const stepId = snapshot?.current_step_id ?? null;
        const stuck =
          Boolean(stepId) &&
          !clarification &&
          snapshot?.attempt_status === "pending_check" &&
          snapshot?.check_result?.status === "needs_review";

        setReviewPending(prev => {
          if (stuck) {
            if (prev?.stepId === stepId) return prev;
            return { stepId: stepId as string };
          }
          if (!prev) return prev;
          if (activeActionStepId && activeActionStepId !== prev.stepId) {
            return null;
          }
          if (clarification || snapshot?.completed) return null;
          const checkStatus = snapshot?.check_result?.status;
          if (
            checkStatus &&
            checkStatus !== "needs_review" &&
            snapshot?.attempt_status !== "pending_check"
          ) {
            return null;
          }
          return prev;
        });
      }, [activeActionStepId, clarification, snapshot]);

      return reviewPending;
    }
