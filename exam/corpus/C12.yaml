  code: |
    export function PriceListViewerPage() {
      const { jobId } = useParams<{ jobId: string }>();
      const [state, setState] = useState<ViewerState>({ status: "loading" });

      const trimmedJobId = jobId?.trim() || null;

      useEffect(() => {
        if (!trimmedJobId) return;
        let cancelled = false;
        let timer: ReturnType<typeof setTimeout> | undefined;
        setState({ status: "loading" });

        // The price list upload goes on in the background: while the task is queued or running,
        // we ask the server with the same interval as the import screen.
        const poll = () => {
          getPriceImportJob(trimmedJobId)
            .then(job => {
              if (cancelled) return;
              setState({ status: "ready", job });
              if (job.status === "queued" || job.status === "running") {
                timer = setTimeout(poll, PRICE_IMPORT_POLL_MS);
              }
            })
            .catch((error: unknown) => {
              if (cancelled) return;
              const notFound =
                error instanceof PriceImportApiError && error.status === 404;
              setState({ status: "error", kind: notFound ? "not_found" : "other" });
            });
        };
        poll();

        return () => {
          cancelled = true;
          if (timer) clearTimeout(timer);
        };
      }, [trimmedJobId]);

      const effectiveState: ViewerState = trimmedJobId
        ? state
        : { status: "error", kind: "not_found" };

      const screenState: ScreenState =
        effectiveState.status === "ready"
          ? resolveJobScreenState(effectiveState.job.status)
          : effectiveState.status;

      return <ViewerShell screenState={screenState} state={effectiveState} />;
    }
