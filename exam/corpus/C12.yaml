  why: The status and the failure code are taken from the server response, and Date.now() - startedAt serves only for the line "N seconds passed" and does not declare a failure.
  source: report export polling hook where the browser clock goes only into showing the elapsed time, by form
  code: |
    import { useEffect, useState } from "react";
    import { useQuery } from "@tanstack/react-query";
    import { getReportExport, isFinalExportStatus } from "@/shared/api/reports";

    export function useExportProgress(exportId: string) {
      const [startedAt] = useState(() => Date.now());
      const [elapsedSec, setElapsedSec] = useState(0);

      const query = useQuery({
        queryKey: ["report-export", exportId],
        queryFn: () => getReportExport(exportId),
        refetchInterval: q => (isFinalExportStatus(q.state.data?.status) ? false : 2_000),
      });

      const status = query.data?.status ?? "queued";
      const finished = isFinalExportStatus(status);

      useEffect(() => {
        if (finished) return;
        const id = setInterval(() => {
          setElapsedSec(Math.floor((Date.now() - startedAt) / 1000));
        }, 1_000);
        return () => clearInterval(id);
      }, [finished, startedAt]);

      return {
        status,
        elapsedSec,
        errorCode: query.data?.error_code ?? null,
      };
    }
