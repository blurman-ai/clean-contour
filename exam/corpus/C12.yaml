  source: board view choice hook with remembering in browser storage, by form
  code: |
    import { useCallback, useEffect, useState } from "react";

    const VIEW_KEY = "dispatch-board:view";

    type BoardView = "table" | "map";

    function readView(): BoardView {
      try {
        return localStorage.getItem(VIEW_KEY) === "map" ? "map" : "table";
      } catch {
        return "table";
      }
    }

    export function useBoardView() {
      const [mode, setMode] = useState<BoardView>(readView);

      useEffect(() => {
        try {
          localStorage.setItem(VIEW_KEY, mode);
        } catch {
          // in private mode the storage may be unavailable
        }
      }, [mode]);

      const toggle = useCallback(
        () => setMode(current => (current === "table" ? "map" : "table")),
        [],
      );

      return { mode, setMode, toggle };
    }
