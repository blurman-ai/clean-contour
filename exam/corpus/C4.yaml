    router = APIRouter(prefix="/hooks")


    @router.post("/invoice-sent")
    def invoice_sent(event: InvoiceSentEvent, db: Session = Depends(get_session)) -> dict:
        invoice = db.get(Invoice, event.invoice_id)
        if invoice is None:
            raise HTTPException(status_code=404, detail="invoice_not_found")
        if event.carrier_ref != invoice.carrier_ref:
