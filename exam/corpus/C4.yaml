  code: |
    from enum import Enum

    from sqlalchemy.orm import Session

    from app.warehouse.models import Pallet


    class PalletStatus(str, Enum):
        EXPECTED = "expected"
        RECEIVED = "received"
        STORED = "stored"
        SHIPPED = "shipped"


    TRANSITIONS = {
        PalletStatus.EXPECTED: {PalletStatus.RECEIVED},
        PalletStatus.RECEIVED: {PalletStatus.STORED},
        PalletStatus.STORED: {PalletStatus.SHIPPED},
        PalletStatus.SHIPPED: set(),
    }


    class InvalidTransition(Exception):
        pass


    def transition_pallet_status(session: Session, pallet: Pallet, new: PalletStatus) -> Pallet:
        current = PalletStatus(pallet.status)
        if new not in TRANSITIONS[current]:
            raise InvalidTransition(f"{current.value} -> {new.value}")
        # the transition table check is above, the write is in one place
        pallet.status = new.value
        session.add(pallet)
        return pallet
