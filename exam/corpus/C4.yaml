    from fastapi import APIRouter, Depends, HTTPException
    from sqlalchemy.orm import Session

    from app.db import get_session
    from app.shifts.models import Shift
    from app.shifts.state import InvalidTransition, ShiftStatus, set_shift_status

    router = APIRouter(prefix="/shifts")


    @router.post("/{shift_id}/close")
    def close_shift(shift_id: int, db: Session = Depends(get_session)) -> dict:
        """Closes the shift at the supervisor's request."""
        shift = db.get(Shift, shift_id)
        if shift is None:
            raise HTTPException(status_code=404, detail="shift_not_found")
        if shift.status == ShiftStatus.CLOSED:
            return {"shift_id": shift.id, "status": shift.status}
        try:
            set_shift_status(db, shift, ShiftStatus.CLOSED)
        except InvalidTransition as exc:
            raise HTTPException(status_code=409, detail=str(exc)) from exc
        db.commit()
        return {"shift_id": shift.id, "status": shift.status}
