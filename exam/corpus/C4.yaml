    from sqlalchemy.orm import Session

    from app.shifts.models import Shift, ShiftStatus
    from app.shifts.payroll import accrue_shift_pay

    log = logging.getLogger(__name__)


    def close_finished_shifts(session: Session, now: datetime | None = None) -> int:
        """Closes shifts whose time has run out and accrues pay."""
        now = now or datetime.now(timezone.utc)
        shifts = session.scalars(
            select(Shift).where(Shift.status == ShiftStatus.ACTIVE, Shift.ends_at <= now)
        ).all()
        for shift in shifts:
