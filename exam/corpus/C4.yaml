    import time
    from dataclasses import dataclass, field

    import httpx


    @dataclass
    class ProbeResult:
        name: str
        status: str = "unknown"
        latency_ms: float = 0.0
        details: dict = field(default_factory=dict)


    def probe_carrier_api(client: httpx.Client, url: str) -> ProbeResult:
        # check of the carrier API availability
        result = ProbeResult(name="carrier_api")
        started = time.monotonic()
        try:
            response = client.get(url, timeout=3.0)
            result.status = "ok" if response.status_code == 200 else "degraded"
            result.details["http"] = response.status_code
        except httpx.HTTPError as exc:
            result.status = "down"
            result.details["error"] = type(exc).__name__
        result.latency_ms = (time.monotonic() - started) * 1000
        return result
