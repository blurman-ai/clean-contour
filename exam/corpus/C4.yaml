    from sqlalchemy import select, update
    from sqlalchemy.orm import Session

    from app.orders.models import Order
    from app.warehouse.models import PackingTask


    class OrderPackingService:
        def __init__(self, session: Session) -> None:
            self.session = session

        def pending_orders(self, depot_id: int) -> list[Order]:
            return list(
                self.session.scalars(
                    select(Order).where(Order.depot_id == depot_id, Order.status == "picked")
                )
            )

        def mark_packed(self, order_ids: list[int], packer_id: int) -> int:
            """Marks orders as packed in one operation."""
            result = self.session.execute(
                update(Order)
                .where(Order.id.in_(order_ids), Order.status == "picked")
                .values(status="packed", packed_by=packer_id)
            )
            for order_id in order_ids:
                self.session.add(PackingTask(order_id=order_id, packer_id=packer_id))
            self.session.commit()
            return result.rowcount
