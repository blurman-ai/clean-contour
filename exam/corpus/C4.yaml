    async def _claim_next(
        session_factory: async_sessionmaker[AsyncSession],
    ) -> tuple | None:
        now = _now()
        async with session_factory() as db:
            version = await db.scalar(
                select(PriceImportVersion)
                .where(
                    PriceImportVersion.processing_status == "processing",
                    or_(
                        PriceImportVersion.handling_retry_at.is_(None),
                        PriceImportVersion.handling_retry_at <= now,
                    ),
                )
                .order_by(PriceImportVersion.created_at, PriceImportVersion.id)
                .with_for_update(skip_locked=True)
                .limit(1)
            )
            if version is None:
                await db.rollback()
                return None
            if int(version.parse_attempts or 0) >= PARSE_MAX_ATTEMPTS:
                version.processing_error = "parse_attempts_exhausted"
                version.handling_retry_at = None
                version.handling_lease_id = None
                version.handling_lease_until = None
                set_price_import_version_status(version, PriceImportStatus.FAILED)
                await db.commit()
                return None
            lease_id = uuid.uuid4()
            version.parse_attempts = int(version.parse_attempts or 0) + 1
            version.handling_lease_id = lease_id
            version.handling_lease_until = now + timedelta(seconds=_LEASE_SECONDS)
            await db.commit()
            return (version.id, lease_id, version.storage_path, version.parse_attempts)

