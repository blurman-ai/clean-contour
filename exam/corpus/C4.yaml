    import sqlalchemy as sa
    from alembic import op

    revision = "8c41d2e7a903"
    down_revision = "5b7e19f0c2aa"

    _couriers = sa.table(
        "couriers",
        sa.column("id"),
        sa.column("status", sa.String),
        sa.column("deleted_at"),
        sa.column("user_id"),
        sa.column("device_id"),
    )


    def upgrade() -> None:
        conn = op.get_bind()
        entered = sa.or_(
            _couriers.c.user_id.is_not(None), _couriers.c.device_id.is_not(None)
        )
        live = _couriers.c.deleted_at.is_(None)
        conn.execute(
            sa.update(_couriers)
            .where(_couriers.c.deleted_at.is_not(None), _couriers.c.status != "inactive")
            .values(status="inactive")
        )
        conn.execute(
            sa.update(_couriers)
            .where(live, entered, _couriers.c.status.notin_(["inactive", "active"]))
            .values(status="active")
        )
        conn.execute(
            sa.update(_couriers)
            .where(live, sa.not_(entered), _couriers.c.status.notin_(["inactive", "invited"]))
            .values(status="invited")
        )


