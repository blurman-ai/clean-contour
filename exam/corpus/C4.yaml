    from sqlalchemy import select
    from sqlalchemy.orm import Session

    from app.bots.replies import reply
    from app.couriers.models import Courier
    from app.shifts.models import Shift


    def handle_break_command(session: Session, chat_id: int, minutes: int) -> str:
        """Courier command "break" with a number of minutes."""
        courier = session.scalars(select(Courier).where(Courier.chat_id == chat_id)).first()
        if courier is None:
            return reply("unknown_courier")
        shift = session.scalars(
            select(Shift).where(Shift.courier_id == courier.id, Shift.closed_at.is_(None))
        ).first()
        if shift is None:
            return reply("no_open_shift")
        if minutes > 30:
            return reply("break_too_long", limit=30)
        # the break is counted within the current shift
        courier.status = "on_break"
        shift.break_minutes += minutes
        session.commit()
        return reply("break_started", minutes=minutes)
