    import logging

    from sqlalchemy.orm import Session

    from app.pricing.models import PriceListUpload
    from app.pricing.parser import PriceListError, parse_price_list

    log = logging.getLogger(__name__)


    def handle_upload(session: Session, upload_id: int, raw: bytes) -> PriceListUpload:
        """Parses the uploaded price list and saves the parse result."""
        upload = session.get(PriceListUpload, upload_id)
        if upload is None:
            raise LookupError("upload_not_found")
        try:
            rows = parse_price_list(raw)
        except PriceListError as exc:
            log.warning("price list %s rejected: %s", upload_id, exc.code)
            upload.status = "failed"
            upload.error_code = exc.code
            session.commit()
            return upload
        upload.rows_count = len(rows)
        upload.status = "parsed"
        # tariff rows are saved in a separate step
        session.commit()
        return upload
