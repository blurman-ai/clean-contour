    STALE_TICKET_DAYS = 14
    SWEEP_BATCH = 200


    async def close_stale_tickets(db: AsyncSession, *, now: datetime) -> int:
        """Nightly sweep: tickets nobody answered for two weeks are closed."""

        cutoff = now - timedelta(days=STALE_TICKET_DAYS)
        rows = (
            await db.scalars(
                select(Ticket)
                .where(
                    Ticket.status.in_(("open", "waiting_customer")),
                    Ticket.last_activity_at < cutoff,
                    Ticket.deleted_at.is_(None),
                )
                .order_by(Ticket.last_activity_at)
                .with_for_update(skip_locked=True)
                .limit(SWEEP_BATCH)
            )
        ).all()
        closed = 0
        for ticket in rows:
            if await _has_pending_courier_visit(db, ticket.id):
                continue
            if ticket.assignee_id is None:
                log.warning("ticket_without_assignee ticket_id=%s", ticket.id)
            ticket.status = "closed"
            ticket.closed_at = now
            ticket.close_reason = "stale"
            closed += 1
            log.info("ticket_closed_stale ticket_id=%s", ticket.id)
        await db.commit()
        return closed

