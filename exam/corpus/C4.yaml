    def active_couriers_filter():
        """
        The one filter for reports and flows that mean "everyone who has not
        been deactivated", including a courier who has never signed in.
        """

        return Courier.status != CourierStatus.INACTIVE


    def is_deactivated(courier: Courier) -> bool:
        return courier.status == CourierStatus.INACTIVE


    def set_courier_status(courier: Courier, new: CourierStatus) -> None:
        """The one place a courier row changes its stored status."""

        new = CourierStatus(new)
        # Writing the stored value again is not a move.
        if courier.status == new:
            return
        if not courier_status_transition_allowed(courier.status, new):
            reject_unlisted_transition(
                f"courier_transition_not_allowed:{_name(courier.status)}->{new.value}"
            )
        courier.status = new


    def mark_courier_signed_in(courier: Courier) -> None:
        """First sign-in: ``invited`` -> ``active``.

        A switched-off courier stays ``inactive``; an active one stays active.
        """

        if courier.status == CourierStatus.INVITED:
            set_courier_status(courier, CourierStatus.ACTIVE)

