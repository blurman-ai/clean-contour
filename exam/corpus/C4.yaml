    _FUNCTION_SQL = f"""
    CREATE OR REPLACE FUNCTION {FUNCTION_NAME}() RETURNS trigger AS $$
    BEGIN
      IF NEW.id IS DISTINCT FROM OLD.id
         OR NEW.version IS DISTINCT FROM OLD.version
         OR NEW.route_name IS DISTINCT FROM OLD.route_name
         OR NEW.schema_version IS DISTINCT FROM OLD.schema_version
         OR NEW.config_sha256 IS DISTINCT FROM OLD.config_sha256
         OR NEW.created_by IS DISTINCT FROM OLD.created_by
         OR NEW.created_at IS DISTINCT FROM OLD.created_at THEN
        RAISE EXCEPTION 'route payload is immutable';
      END IF;

      IF OLD.status = 'draft' AND NEW.status = 'active' THEN
        IF NEW.activated_at IS NULL
           OR NEW.superseded_at IS DISTINCT FROM OLD.superseded_at THEN
          RAISE EXCEPTION 'invalid route activation transition';
        END IF;
        RETURN NEW;
      END IF;

      IF OLD.status = 'draft' AND NEW.status = 'expired' THEN
        IF NEW.activated_at IS DISTINCT FROM OLD.activated_at
           OR NEW.superseded_at IS NULL THEN
          RAISE EXCEPTION 'invalid route draft expiry transition';
        END IF;
        RETURN NEW;
      END IF;

      IF OLD.status = 'active' AND NEW.status IN ('superseded', 'expired') THEN
        IF NEW.activated_at IS DISTINCT FROM OLD.activated_at
           OR NEW.superseded_at IS NULL THEN
          RAISE EXCEPTION 'invalid route retirement transition';
        END IF;
        RETURN NEW;
      END IF;

      RAISE EXCEPTION 'invalid route lifecycle transition';
    END;
    $$ LANGUAGE plpgsql
    """

