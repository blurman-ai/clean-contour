    import asyncio
    from contextlib import contextmanager
    from contextvars import ContextVar
    from datetime import UTC, datetime

    from sqlalchemy import delete, select, update

    from app.contracts.route_stop_states import STOP_TRANSITIONS, StopState
    from app.db.route_stop.model import RouteStop

    _active_writer: ContextVar[object | None] = ContextVar("active_stop_writer", default=None)


    class StopWriter:
        async def _close_unfinished(self):
            async with self.factory() as session:
                await session.execute(
                    update(RouteStop)
                    .where(
                        RouteStop.route_id == self.route_id,
                        RouteStop.state == StopState.RUNNING,
                    )
                    .values(state=StopState.FAILED.value, finished_at=datetime.now(UTC))
                )
                await session.execute(
                    update(RouteStop)
                    .where(
                        RouteStop.route_id == self.route_id,
                        RouteStop.state == StopState.QUEUED,
                    )
                    .values(state=StopState.CANCELLED.value, finished_at=datetime.now(UTC))
                )
                await session.commit()

        @contextmanager
        def scope(self):
            self.thread.start()
            token = _active_writer.set(self)
            try:
                yield self
            finally:
                _active_writer.reset(token)

