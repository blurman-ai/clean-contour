  source: Entity cancellation method in a service layer that declares a transition table.
  code: |
    ALLOWED_TRANSITIONS = {
        "queued": {"running", "cancelled"},
        "running": {"completed", "failed", "cancelled"},
        "completed": set(),
        "failed": set(),
        "cancelled": set(),
    }


    class DispatchService:
        def __init__(self, router, clock, store) -> None:
            self.router = router
            self.clock = clock
            self.store = store

        def status(self, dispatch_id: str) -> dict:
            dispatch = self._require(dispatch_id)
            return {
                "dispatch_id": dispatch.dispatch_id,
                "status": dispatch.status,
                "failure_stage": dispatch.failure_stage,
                "failure_rule": dispatch.failure_rule,
            }

        def cancel(self, dispatch_id: str) -> dict:
            """Stop the trip. The cancellation names a reason even without a culprit segment."""

            dispatch = self._require(dispatch_id)
            dispatch.cancel_requested = True
            if dispatch.status in {"queued", "running"}:
                self._release_remaining_stops(dispatch, cause="dispatch:cancel_requested")
                dispatch.status = "cancelled"
            self._save(dispatch)
            return self.status(dispatch_id)

