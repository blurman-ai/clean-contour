    async def _store_result(
        session_factory: async_sessionmaker[AsyncSession],
        *,
        version_id: uuid.UUID,
        import_id: uuid.UUID,
        lease_id: uuid.UUID,
        rows: list[dict] | None,
        error_code: str | None,
        retryable: bool,
        attempts: int,
    ) -> None:
        async with session_factory() as db:
            version = await db.scalar(
                select(PriceImportVersion).where(
                    PriceImportVersion.id == version_id,
                    PriceImportVersion.import_id == import_id,
                    PriceImportVersion.processing_status == "processing",
                    PriceImportVersion.handling_lease_id == lease_id,
                )
            )
            if version is None:
                await db.rollback()
                return
            version.handling_lease_id = None
            version.handling_lease_until = None
            if error_code is None:
                version.parsed_rows = rows
                version.handling_retry_at = None
                version.processing_error = None
                version.processing_status = PriceImportStatus.PROCESSED.value
                state = "processed"
            elif retryable and attempts < PARSE_MAX_ATTEMPTS:
                delay = PARSE_RETRY_DELAY_SECONDS * (2 ** (attempts - 1))
                version.handling_retry_at = _now() + timedelta(seconds=delay)
                version.processing_error = error_code
                state = "processing"
            else:
                version.handling_retry_at = None
                version.processing_error = error_code
                version.processing_status = PriceImportStatus.FAILED.value
                state = "failed"
            await db.commit()
            logger.info(
                "price_import_parse_finished import_id=%s state=%s attempt=%s error_code=%s",
                import_id,
                state,
                attempts,
                error_code,
            )

