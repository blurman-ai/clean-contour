  why: Near miss — each failure class maps to its own refusal member and an unexpected throwable is rethrown, not folded into one code.
  source: The same scan wrapper keeping causes apart.
  code: |
    package scanning

    sealed class ScanRefusal {
        object DeviceOffline : ScanRefusal()
        object LicenseInvalid : ScanRefusal()
        data class TrayJam(val tray: String) : ScanRefusal()
    }

    sealed class ScanOutcome {
        data class Done(val result: ScanResult) : ScanOutcome()
        data class Refused(val refusal: ScanRefusal) : ScanOutcome()
    }

    fun runBatch(device: ScanDevice, tray: Tray): ScanOutcome {
        try {
            return ScanOutcome.Done(ScanResult(device.scan(tray)))
        } catch (e: DeviceUnreachable) {
            return ScanOutcome.Refused(ScanRefusal.DeviceOffline)
        } catch (e: LicenseException) {
            return ScanOutcome.Refused(ScanRefusal.LicenseInvalid)
        } catch (e: TrayJammed) {
            return ScanOutcome.Refused(ScanRefusal.TrayJam(tray.id))
        }
    }

- id: C27-16
  card: C27
  expected: clean
  path: internal/fulfillment/pick.go
  why: Near miss — every refusal is matched to its own code by errors.Is and an unmatched error is returned as itself, no invented common text.
  source: The same pick handler matching sentinels.
  code: |
    var (
        ErrUnknownSku  = errors.New("unknown sku")
        ErrShelfEmpty  = errors.New("shelf empty")
        ErrWaveLocked  = errors.New("wave locked")
    )

    func refusalCode(err error) string {
        switch {
        case errors.Is(err, ErrUnknownSku):
            return "pick_unknown_sku"
        case errors.Is(err, ErrShelfEmpty):
            return "pick_shelf_empty"
        case errors.Is(err, ErrWaveLocked):
            return "pick_wave_locked"
        default:
            return ""
        }
    }

    func (s *Server) pick(c *gin.Context) {
        var req PickRequest
        if err := c.ShouldBindJSON(&req); err != nil {
            c.JSON(400, gin.H{"error": "bad request"})
            return
        }
        err := s.store.Pick(c, req)
        if err != nil {
            if code := refusalCode(err); code != "" {
                c.JSON(409, gin.H{"code": code})
                return
            }
            _ = c.Error(err)               // unexpected errors surface with their own identity
            c.JSON(500, gin.H{"code": "internal_panic"})
            return
        }
        c.JSON(201, gin.H{"picked": true})
    }

- id: C27-17
  card: C27
  expected: clean
  path: internal/notify/send.go
  why: Near miss — the helper maps each typed refusal to its own code and passes anything else through unwrapped.
  source: A notifier refusing per cause.
  code: |
    package notify

    type Refusal struct {
        Code string
        Err  error
    }

    func Classify(err error) (Refusal, bool) {
        var rate RateLimited
        if errorsAs(err, &rate) {
            return Refusal{Code: "notify_rate_limited", Err: err}, true
        }
        var auth AuthRejected
        if errorsAs(err, &auth) {
            return Refusal{Code: "notify_auth_rejected", Err: err}, true
        }
        var quota QuotaExceeded
        if errorsAs(err, &quota) {
            return Refusal{Code: "notify_quota_exceeded", Err: err}, true
        }
        return Refusal{}, false
    }

    func errorsAs(err error, target any) bool {
        return errors.As(err, target)
    }

