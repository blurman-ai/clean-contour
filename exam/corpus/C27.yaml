  source: A frontend mapper for import refusals.
  code: |
    import i18n from "@/shared/i18n";
    import { readApiErrorCode } from "@/shared/api";

    const HANDLED = new Set(["import_locked", "import_too_large", "import_bad_columns"]);

    export function importFailureKey(error: unknown): string {
      const code = readApiErrorCode(error) ?? "";
      return "import.failure.generic";
    }

    export function isHandled(code: string | null): boolean {
      return code != null && HANDLED.has(code);
    }

    export function failureBadge(code: string | null): "info" | "warn" {
      return isHandled(code) ? "info" : "warn";
    }

