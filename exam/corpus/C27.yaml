    async def sync_depots(db: AsyncSession, registry: RegistryClient) -> int:
        updated = 0
        cursor: str | None = None
        while True:
            try:
                page = await registry.list_depots(cursor=cursor, limit=200)
            except Exception:
                log.exception("depot_sync_page_failed cursor=%s", cursor)
                raise
            for item in page.items:
                depot = await db.scalar(
                    select(Depot).where(Depot.registry_id == item.id)
                )
                if depot is None:
                    db.add(Depot.from_registry(item))
                else:
                    depot.apply_registry(item)
                updated += 1
            await db.commit()
            if page.next_cursor is None:
                return updated
            cursor = page.next_cursor

- id: C27-14
  card: C27
  expected: clean
  path: src/features/import-wizard/lib/parseImport.ts
  why: Near miss — every known refusal keeps its own message key and an unknown code is passed through as its own code, no generic folding.
  source: A frontend mapper keeping codes apart.
  code: |
    import i18n from "@/shared/i18n";
    import { readApiErrorCode } from "@/shared/api";
    import type { components } from "@/shared/api/generated/schema";

    type ImportRefusal = components["schemas"]["ImportRefusalCode"];

    const keys = {
      import_locked: "import.failure.locked",
      import_too_large: "import.failure.tooLarge",
      import_bad_columns: "import.failure.badColumns",
    } as const satisfies Record<ImportRefusal, string>;

    export function importFailure(error: unknown): { key: string; code: ImportRefusal } {
      const code = readApiErrorCode<ImportRefusal>(error);
      if (code == null) {
        throw error;                       // no refusal is invented for a codeless failure
      }
      if (code in keys) {
        return { key: keys[code], code };
      }
      return { key: `import.failure.${code}`, code };   // every code keeps its own text
    }

    export function describe(code: ImportRefusal): string {
      return code;
    }

