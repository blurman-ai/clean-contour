    package push

    data class PushOutcome(val delivered: Boolean, val refusal: String?)

    class Notifier(private val provider: Provider) {

        fun send(token: String, payload: Payload): PushOutcome =
            runCatching { provider.send(token, payload) }
                .getOrElse {
                    log.warn("push_send_failed token=%s", token)
                    PushOutcome(delivered = false, refusal = "push_failed")
                }

    fun sendAll(tokens: List<String>, payload: Payload): List<PushOutcome> =
        tokens.map { send(it, payload) }
    }

