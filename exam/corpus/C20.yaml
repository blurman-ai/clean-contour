  source: An ERP answer read as a raw dict.
  code: |
    from __future__ import annotations

    from app.connector.model import Code, Task

    TEXTS = {"expired": "expired", "no_reference": "no reference", "erp_error": "ERP error"}


    def erp_words(detail: str) -> str:
        return " ".join(detail.split()[:20])


    def failure(task: Task, reply: dict) -> str:
        """Why the task stopped: the kind of work and the refusal in words."""
        if task.expired:
            return f"{task.kind} — {TEXTS['expired']}"
        code = Code(reply["code"])
        words = f"{task.kind} — {TEXTS[code.value]}"
        detail = erp_words(reply.get("detail", "")) if code is Code.ERP_ERROR else ""
        return f"{words}: {detail}" if detail else words


    def refused(reply: dict) -> bool:
        return reply["posted"] is False or reply["code"] == "erp_error"


    def number_of(reply: dict) -> str:
        return str(reply["number"])


    def codes(replies: list[dict]) -> list[str]:
        return [reply["code"] for reply in replies]


    def words(task: Task) -> str:
        return f"{task.kind} {task.expired}"
