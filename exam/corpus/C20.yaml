  card: C20
  expected: dirty
  path: internal/runs/plan.go
  why: A stored JSON blob is unmarshalled into raw maps in the run package and its keys drive the cleanup plan; the adapter that wrote the blob is the decoder, this package is not.
  source: A stored JSON blob whose keys drive the plan, in Go.
  code: |
    package runs

    import "encoding/json"

    // Cleanup plan of the run, as the adapter stored it.
    func plan(run Run) ([]map[string]interface{}, error) {
    	var steps []map[string]interface{}
    	if err := json.Unmarshal([]byte(run.PlanText), &steps); err != nil {
    		return nil, err
    	}
    	return steps, nil
    }

    func kinds(run Run) ([]string, error) {
    	steps, err := plan(run)
    	if err != nil {
    		return nil, err
    	}
    	found := make([]string, 0, len(steps))
    	for _, step := range steps {
    		found = append(found, step["kind"].(string))
    	}
    	return found, nil
    }

    func commandOf(run Run, kind string) (map[string]interface{}, error) {
    	steps, err := plan(run)
    	if err != nil {
    		return nil, err
    	}
    	for _, step := range steps {
    		if step["kind"] == kind {
    			command, _ := step["command"].(map[string]interface{})
    			return command, nil
    		}
    	}
    	return nil, nil
    }

    func removals(run Run) (int, error) {
    	steps, err := plan(run)
    	if err != nil {
    		return 0, err
    	}
    	count := 0
    	for _, step := range steps {
    		if kind, ok := step["kind"].(string); ok && len(kind) > 6 && kind[:6] == "delete" {
    			count++
    		}
    	}
    	return count, nil
    }
