- id: C20-02
  card: C20
  expected: dirty
  path: app/forwarder/order.py
  why: The XML of the forwarder order is assembled from the config mapping by string literals all over the body; the config's shape is not declared anywhere in the fragment.
  source: A forwarder order assembled from config literals.
  code: |
    from __future__ import annotations

    import xml.etree.ElementTree as ET
    from datetime import date, timedelta

    from app import config, places

    SETTINGS = config.load("forwarder_order")


    def party(parent: ET.Element, tag: str, entry: dict) -> None:
        element = ET.SubElement(parent, tag)
        ET.SubElement(ET.SubElement(element, "IdInfo"), "LegalEntity", entry["org"])
        address = ET.SubElement(element, "Address")
        if "AddressLocal" in entry["address"]:
            ET.SubElement(address, "AddressLocal", entry["address"]["AddressLocal"])
        else:
            ET.SubElement(address, "AddressRegistry", entry["address"]["AddressRegistry"])


    def build(trip) -> bytes:
        form = SETTINGS["format"]
        root = ET.Element("File", ProgVersion=form["program"], FormVersion=form["version"])
        doc = ET.SubElement(root, "Document", DocCode=form["doc_code"], DocName=form["name"])
        content = ET.SubElement(doc, "ClientContent", Operation=form["operation"])
        forwarder = SETTINGS["forwarder"]
        ET.SubElement(content, "ForwarderContract", forwarder["contract"])
        rule = forwarder["route"]
        ET.SubElement(content, "DeliveryDate",
                      (trip.loading_date + timedelta(days=rule["delivery_days"])).isoformat())
        party(content, "Client", SETTINGS["client"])
        ET.SubElement(content, "Vehicle", VehicleKind=SETTINGS["cargo"]["vehicle_kind"])
        return ET.tostring(root, encoding="utf-8")
