  source: ERP rows read by literal property names, in C#.
  code: |
    using System.Text.Json;

    namespace App.Drivers;

    public static class Snapshot
    {
        private static JsonElement? Latest(JsonElement rows, string array, string nameColumn, string dateColumn)
        {
            var found = rows.GetProperty(array).EnumerateArray()
                .Where(row => row.TryGetProperty(nameColumn, out var value) && value.ValueKind == JsonValueKind.String)
                .OrderByDescending(row => row.GetProperty(dateColumn).GetString())
                .ToList();
            return found.Count == 0 ? null : found[0];
        }

        /// <summary>Driver card text: name, plate and passport, as the ERP answer has them.</summary>
        public static string LabelOf(string replyJson, string fullName)
        {
            using var document = JsonDocument.Parse(replyJson);
            var rows = document.RootElement.GetProperty("rows");
            var passport = Latest(rows, "passports", "FullName", "Period");
            var sale = Latest(rows, "sales", "Driver", "Date");
            if (passport is null && sale is null)
                return fullName;
            var plate = sale is JsonElement s ? s.GetProperty("Plate").GetString() : "";
            var series = passport is JsonElement p
                ? $"{p.GetProperty("Series").GetString()} {p.GetProperty("Number").GetString()}" : "";
            return $"{fullName} | {plate} | {series}".Trim(' ', '|');
        }
    }
