    from __future__ import annotations

    import json
    import sqlite3
    from dataclasses import dataclass


    @dataclass(frozen=True)
    class Step:
        kind: str
        command: dict


    @dataclass(frozen=True)
    class Task:
        number: int
        state: str
        steps: tuple[Step, ...]


    def task_of(row: sqlite3.Row) -> Task:
        return Task(number=row["id"], state=row["state"],
                    steps=tuple(Step(kind=step["kind"], command=step["command"])
                                for step in json.loads(row["command"])))


    class Tasks:
        def __init__(self, db: sqlite3.Connection) -> None:
            self.db = db

        def one(self, number: int) -> Task | None:
            row = self.db.execute("SELECT id, state, command FROM tasks WHERE id = ?",
                                  (number,)).fetchone()
            return task_of(row) if row else None

        def states(self) -> dict[int, str]:
            return {row["id"]: row["state"]
                    for row in self.db.execute("SELECT id, state FROM tasks")}
