  why: Rows of the ERP answer are read by literal column names and go straight into the text of the driver card; no typed row or object is built anywhere in the fragment.
  source: ERP rows read by literal column names.
  code: |
    from __future__ import annotations

    import json


    def latest(rows: list[dict], name: str, date_column: str) -> dict | None:
        found = [row for row in rows if row.get(name)]
        return max(found, key=lambda row: row[date_column], default=None)


    def label_of(reply: dict, full_name: str) -> str:
        """Driver card text: name, plate and passport, as the ERP answer has them."""
        rows = json.loads(reply["rows"])
        passport = latest(rows["passports"], "FullName", "Period")
        sale = latest(rows["sales"], "Driver", "Date")
        if passport is None and sale is None:
            return full_name
        plate = sale["Plate"] if sale else ""
        series = f"{passport['Series']} {passport['Number']}" if passport else ""
        return f"{full_name} | {plate} | {series}".strip(" |")


    def has_passport(reply: dict, full_name: str) -> bool:
        rows = json.loads(reply["rows"])
        return latest(rows["passports"], "FullName", "Period") is not None


    def plate_of(reply: dict, full_name: str) -> str | None:
        sale = latest(json.loads(reply["rows"])["sales"], "Driver", "Date")
        return sale["Plate"] if sale else None
