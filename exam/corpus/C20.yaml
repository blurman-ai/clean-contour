    // Rows of the stand history index, as the builder wrote them.
    export function rows(folder: string): any[] {
      return JSON.parse(readFileSync(join(folder, "index.json"), "utf-8"));
    }

    export function several(folder: string): any[] {
      return rows(folder).filter((row) => row["binding"] === "several");
    }

    export function numbers(folder: string): string[] {
      return rows(folder).map((row) => row["number"]);
    }

    export function buyerOf(folder: string, number: string): string | null {
      for (const row of rows(folder)) {
        if (row["number"] === number) {
          return row["buyer"];
        }
      }
      return null;
    }

    export function mailboxesOf(folder: string, number: string): string[] | null {
      for (const row of rows(folder)) {
        if (row["number"] === number) {
          return "mailboxes" in row ? row["mailboxes"] : null;
        }
      }
      return null;
    }

    export function plants(folder: string): Set<string> {
      return new Set(rows(folder).filter((row) => row["plant"]).map((row) => row["plant"]));
    }
