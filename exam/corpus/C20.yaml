  code: |
    from __future__ import annotations

    import enum
    from pathlib import Path


    class FileKind(enum.Enum):
        PDF = "pdf"
        TEXT = "text"
        OTHER = "other"


    SUFFIXES = {".pdf": FileKind.PDF, ".txt": FileKind.TEXT, ".csv": FileKind.TEXT,
                ".doc": FileKind.OTHER, ".xls": FileKind.OTHER}


    def by_name(name: str) -> FileKind:
        return SUFFIXES.get(Path(name).suffix.lower(), FileKind.OTHER)


    def readable(kind: FileKind) -> bool:
        return kind in (FileKind.PDF, FileKind.TEXT)


    def described(kind: FileKind) -> str:
        return {"pdf": "PDF", "text": "text", "other": "other"}[kind.value]


    def suffixes(kind: FileKind) -> list[str]:
        return [suffix for suffix, found in SUFFIXES.items() if found is kind]


    def kinds() -> list[FileKind]:
        return list(FileKind)
