    package app.storage

    import com.fasterxml.jackson.module.kotlin.jacksonObjectMapper
    import com.fasterxml.jackson.module.kotlin.readValue
    import org.springframework.jdbc.core.JdbcTemplate

    data class Step(val kind: String, val command: Map<String, Any?>)

    data class Task(
        val number: Long,
        val state: String,
        val steps: List<Step>,
    )

    private val mapper = jacksonObjectMapper()

    fun taskOf(id: Long, state: String, payload: String): Task =
        Task(number = id, state = state, steps = mapper.readValue(payload))

    class Tasks(private val jdbcTemplate: JdbcTemplate) {

        fun one(number: Long): Task? = jdbcTemplate.query(
            "SELECT id, state, command FROM tasks WHERE id = ?",
            { rs, _ -> taskOf(rs.getLong("id"), rs.getString("state"), rs.getString("command")) },
            number,
        ).firstOrNull()

        fun states(): Map<Long, String> = jdbcTemplate.query(
            "SELECT id, state FROM tasks",
            { rs, _ -> rs.getLong("id") to rs.getString("state") },
        ).toMap()
    }
