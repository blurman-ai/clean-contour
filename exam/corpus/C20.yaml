  why: The columns of a database row are read next to the SQL that produced them, inside the storage adapter; there is no foreign mapping.
  source: Columns read next to the SQL that produced them.
  code: |
    from __future__ import annotations

    import sqlite3
    from dataclasses import dataclass
    from datetime import datetime


    @dataclass(frozen=True)
    class Order:
        number: str
        state: str
        created_at: datetime


    def order_of(row: sqlite3.Row) -> Order:
        return Order(number=row["number"], state=row["state"],
                     created_at=datetime.fromisoformat(row["created_at"]))


    class Orders:
        def __init__(self, db: sqlite3.Connection) -> None:
            self.db = db

        def one(self, number: str) -> Order | None:
            row = self.db.execute(
                "SELECT number, state, created_at FROM orders WHERE number = ?",
                (number,)).fetchone()
            return order_of(row) if row else None

        def in_state(self, state: str) -> list[Order]:
            rows = self.db.execute(
                "SELECT number, state, created_at FROM orders WHERE state = ? ORDER BY number",
                (state,)).fetchall()
            return [order_of(row) for row in rows]

        def save(self, order: Order) -> None:
            self.db.execute(
                "INSERT INTO orders (number, state, created_at) VALUES (?, ?, ?) "
                "ON CONFLICT (number) DO UPDATE SET state = excluded.state",
                (order.number, order.state, order.created_at.isoformat()))
- id: C20-14
  card: C20
  expected: clean
  path: app/notices/envelope.py
  why: The mapping is built and read in the same fragment — it is the outgoing message parts of this function, not a config or a payload of another system.
  source: A mapping built and read in one fragment.
  code: |
    from __future__ import annotations

    from dataclasses import dataclass
    from email.message import EmailMessage
    from email.utils import format_datetime


    @dataclass(frozen=True)
    class Envelope:
        sender: str
        to: str
        subject: str
        at: object


    def parts(envelope: Envelope) -> dict[str, str]:
        return {"From": envelope.sender, "To": envelope.to, "Subject": envelope.subject,
                "Date": format_datetime(envelope.at)}


    def build(envelope: Envelope, text: str) -> EmailMessage:
        message = EmailMessage()
        written = parts(envelope)
        for name, value in written.items():
            message[name] = value
        message.set_content(text)
        return message


    def renamed(envelope: Envelope, subject: str) -> EmailMessage:
        written = parts(envelope)
        written["Subject"] = subject
        message = EmailMessage()
        for name, value in written.items():
            message[name] = value
        return message
