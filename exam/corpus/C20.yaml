        return now - timedelta(minutes=SETTINGS["login_window_minutes"])


    def refused(store, name: str, now: datetime) -> bool:
        return store.login_failures(name, window(now)) >= SETTINGS["login_attempts"]


    def session_until(now: datetime) -> datetime:
        return now + timedelta(days=SETTINGS["session_days"])


