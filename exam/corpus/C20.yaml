  code: |
    import { Code, Task } from "./model";

    const TEXTS: Record<string, string> = {
      expired: "expired",
      no_reference: "no reference",
      erp_error: "ERP error",
    };

    function erpWords(detail: string): string {
      return detail.split(/\s+/).slice(0, 20).join(" ");
    }

    export function repliesOf(body: string): any[] {
      return JSON.parse(body)["replies"];
    }

    // Why the task stopped: the kind of work and the refusal in words.
    export function failure(task: Task, reply: any): string {
      if (task.expired) {
        return `${task.kind} — ${TEXTS["expired"]}`;
      }
      const code = reply["code"] as Code;
      const words = `${task.kind} — ${TEXTS[code]}`;
      const detail = code === "erp_error" ? erpWords(reply["detail"] ?? "") : "";
      return detail ? `${words}: ${detail}` : words;
    }

    export function refused(reply: any): boolean {
      return reply["posted"] === false || reply["code"] === "erp_error";
    }

    export function numberOf(reply: any): string {
      return String(reply["number"]);
    }

    export function codes(replies: any[]): string[] {
      return replies.map((reply) => reply["code"]);
    }
