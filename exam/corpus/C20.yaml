  path: src/notices/envelope.ts
  why: The mapping is built and read in the same fragment — it is the outgoing message parts of this module, not a config or a payload of another system.
  source: A mapping built and read in one fragment, in TypeScript.
  code: |
    export interface Envelope {
      sender: string;
      to: string;
      subject: string;
      at: Date;
    }

    export function parts(envelope: Envelope): Record<string, string> {
      return {
        From: envelope.sender,
        To: envelope.to,
        Subject: envelope.subject,
        Date: envelope.at.toUTCString(),
      };
    }

    export function build(envelope: Envelope, text: string): string {
      const written = parts(envelope);
      const head = Object.entries(written)
        .map(([name, value]) => `${name}: ${value}`)
        .join("\r\n");
      return `${head}\r\n\r\n${text}`;
    }

    export function headers(envelope: Envelope): string[] {
      return Object.keys(parts(envelope));
    }

    export function described(envelope: Envelope): string {
      return `${parts(envelope)["To"]} — ${envelope.subject}`;
    }
