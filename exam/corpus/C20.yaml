    from __future__ import annotations

    from dataclasses import dataclass

    from app.letters.settings import LetterSettings
    from app.places import find
    from app.trips.model import Trip


    @dataclass(frozen=True)
    class Letter:
        to: str
        subject: str
        text: str


    def plant_of(trip: Trip, settings: LetterSettings) -> object:
        found = find(settings.plants, trip.contract.loading_place)
        if found is None:
            raise ValueError(f"unknown loading place {trip.contract.loading_place}")
        return found


    def values(trip: Trip, plant) -> dict[str, str]:
        return {"number": trip.number, "place": plant.address,
                "driver": trip.contract.driver.full_name}


    def letter(trip: Trip, settings: LetterSettings) -> Letter:
        """Letter to the plant of the loading address."""
        plant = plant_of(trip, settings)
        template = settings.templates[plant.letter]
        filled = values(trip, plant)
        return Letter(to=plant.mail, subject=template.subject.format(**filled),
                      text=template.text.format(**filled))
