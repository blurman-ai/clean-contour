  why: The command for another system is built by walking the config mapping with literal keys in every branch; the config schema exists only as keys repeated across functions.
  source: A command built by walking config keys.
  code: |
    from __future__ import annotations

    from app import config
    from app.documents.model import Kind

    SETTINGS = config.load("connector")


    def value(target: dict, text: str) -> dict:
        if target["type"] == "date":
            return {"date": text}
        if target["type"] == "catalog":
            return {"catalog": target["catalog"], "name": text}
        return {"string": text}


    def write_command(draft) -> dict:
        """Copy of the sample document with the requisites of the draft."""
        document = SETTINGS["documents"][draft.kind.value]
        where = dict(document["sample"])
        values = dict(document["clear"])
        for field in draft.fields:
            if field.name in document["sample_fields"]:
                where[document["sample_fields"][field.name]] = field.value
            elif field.name in document["fields"]:
                target = document["fields"][field.name]
                values[target["requisite"]] = value(target, field.value)
            elif field.name not in document["not_written"]:
                raise ValueError(f"field '{field.name}' is not named in config/connector.json")
        return {"op": "write", "document": document["document"], "sample": where,
                "keep": list(document["keep"]), "set": values,
                "clear_tables": list(document["tables"])}


    def print_command(kind: Kind, number: str) -> dict:
        printing = SETTINGS["documents"][kind.value]["print"]
        return {"op": "print", "document": SETTINGS["documents"][kind.value]["document"],
                "manager": printing["manager"], "form": printing["form"], "key": number}
