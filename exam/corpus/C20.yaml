    from __future__ import annotations

    import json

    from app.runs.model import Run


    def plan(run: Run) -> list[dict]:
        """Cleanup plan of the run, as the adapter stored it."""
        return list(json.loads(run.plan_text))


    def kinds(run: Run) -> list[str]:
        return [step["kind"] for step in plan(run)]


    def command_of(run: Run, kind: str) -> dict | None:
        for step in plan(run):
            if step["kind"] == kind:
                return step["command"]
        return None


    def removals(run: Run) -> int:
        return sum(1 for step in plan(run) if step["kind"].startswith("delete"))


    def tasks_of(run: Run) -> tuple[int, ...]:
        return tuple(json.loads(run.tasks_text))


    def boxes_of(run: Run) -> tuple[str, ...]:
        return tuple(json.loads(run.boxes_text))


    def letters_of(run: Run) -> tuple[str, ...]:
        return tuple(json.loads(run.later_text))


    def why_of(run: Run) -> str:
        return run.why
