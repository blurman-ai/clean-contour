    package app.store

    import app.config.Settings
    import java.time.Duration
    import java.time.Instant

    val SETTINGS = Settings.load("site")

    fun window(now: Instant): Instant =
        now - Duration.ofMinutes((SETTINGS["login_window_minutes"] as Number).toLong())

    fun refused(store: LoginFailures, name: String, now: Instant): Boolean =
        store.loginFailures(name, window(now)) >= (SETTINGS["login_attempts"] as Number).toInt()

    fun sessionUntil(now: Instant): Instant =
        now + Duration.ofDays((SETTINGS["session_days"] as Number).toLong())

    fun cost(): Pair<Int, Int> {
        val scrypt = SETTINGS["scrypt"] as Map<*, *>
        return (scrypt["n"] as Number).toInt() to (scrypt["r"] as Number).toInt()
    }

    fun cookieName(): String = (SETTINGS["cookie"] as Map<*, *>)["name"] as String

    fun describe(): String =
        "attempts=${SETTINGS["login_attempts"]}, " +
            "window=${SETTINGS["login_window_minutes"]} min, " +
            "session=${SETTINGS["session_days"]} days"
