    from urllib.parse import parse_qs

    from fastapi import Request


    def form_of(body: str) -> dict[str, str]:
        """Form fields as the pages expect them: one value per name."""
        parsed = parse_qs(body, keep_blank_values=True)
        return {name: values[0] if values else "" for name, values in parsed.items()}


    async def fields(request: Request) -> dict[str, str]:
        return form_of((await request.body()).decode())


    def chosen(fields: dict[str, str], name: str) -> list[str]:
        return [value for value in fields.get(name, "").split(",") if value]


    def number(fields: dict[str, str], name: str, default: int = 0) -> int:
        try:
            return int(fields[name])
        except (KeyError, ValueError):
            return default


    def summary(fields: dict[str, str]) -> str:
        return ", ".join(f"{name}={value}" for name, value in fields.items())
