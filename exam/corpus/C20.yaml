    from app.connector.model import Kind


    @dataclass(frozen=True)
    class Draft:
        kind: Kind
        trip: str
        fields: Mapping[str, str]


    def requisites(fields: dict[str, str], dates: set[str]) -> dict:
        return {name: ({"date": value} if name in dates else {"string": value})
                for name, value in fields.items()}


    def write_payload(draft: Draft, sample: dict, keep: list[str]) -> dict:
        """The command sent to the connector: the shape is declared right here."""
        return {
