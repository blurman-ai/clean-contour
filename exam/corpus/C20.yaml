    from __future__ import annotations

    import json
    from pathlib import Path


    def rows(folder: Path) -> list[dict]:
        """Rows of the stand history index, as the builder wrote them."""
        return json.loads((folder / "index.json").read_text(encoding="utf-8"))


    def several(folder: Path) -> list[dict]:
        return [row for row in rows(folder) if row["binding"] == "several"]


    def numbers(folder: Path) -> list[str]:
        return [row["number"] for row in rows(folder)]


    def buyer_of(folder: Path, number: str) -> str | None:
        for row in rows(folder):
            if row["number"] == number:
                return row["buyer"]
        return None


    def mailboxes_of(folder: Path, number: str) -> tuple[str, ...] | None:
        for row in rows(folder):
            if row["number"] == number:
                return tuple(row["mailboxes"]) if "mailboxes" in row else None
        return None


    def plants(folder: Path) -> set[str]:
        return {row["plant"] for row in rows(folder) if row["plant"]}
