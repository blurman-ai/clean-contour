  why: The module declares the connector settings as typed records and reads the config in one decoder; callers get properties, not literal keys.
  source: The decoder of the connector config, in C#.
  code: |
    using System.Text.Json;

    namespace App.Settings;

    public sealed record DocumentSettings(string Document, IReadOnlyList<string> Keep,
        IReadOnlyList<string> Tables, string Title);

    public sealed record ConnectorSettings(IReadOnlyDictionary<string, DocumentSettings> Documents,
        int TakeLimit, int ReplyMinutes)
    {
        public DocumentSettings Document(string kind) => Documents[kind];
    }

    public static class ConnectorSettingsDecoder
    {
        /// <summary>The single place that knows the keys of config/connector.json.</summary>
        public static ConnectorSettings Load(JsonElement raw)
        {
            var documents = new Dictionary<string, DocumentSettings>();
            foreach (var entry in raw.GetProperty("documents").EnumerateObject())
            {
                var body = entry.Value;
                documents[entry.Name] = new DocumentSettings(
                    Document: body.GetProperty("document").GetString()!,
                    Keep: body.GetProperty("keep").EnumerateArray().Select(x => x.GetString()!).ToList(),
                    Tables: body.GetProperty("tables").EnumerateArray().Select(x => x.GetString()!).ToList(),
                    Title: body.GetProperty("print").GetProperty("title").GetString()!);
            }
            return new ConnectorSettings(documents,
                raw.GetProperty("take_limit").GetInt32(), raw.GetProperty("reply_minutes").GetInt32());
        }
    }
