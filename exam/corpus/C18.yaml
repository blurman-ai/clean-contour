    from __future__ import annotations

    import sqlite3

    from app.inventory.model import Item, ItemState


    def settle(item: Item, db: sqlite3.Connection) -> Item:
        """Mark the item as reserved when the reservation row is already there."""
        row = db.execute("SELECT reserved_at FROM reservations WHERE item = ?",
                         (item.id,)).fetchone()
        if row is None:
            item.state = ItemState.FREE
        else:
            item.state = ItemState.RESERVED
            item.reserved_at = row[0]
        return item


    def rows_of(db: sqlite3.Connection, state: ItemState) -> list[tuple]:
        return list(db.execute("SELECT id, reserved_at FROM reservations WHERE state = ?",
                               (state.value,)))

    def free(items: list[Item]) -> list[Item]:
        """Items nobody holds."""
        return [item for item in items if item.state is ItemState.FREE]


    def reserved(items: list[Item]) -> int:
        return sum(1 for item in items if item.state is ItemState.RESERVED)
