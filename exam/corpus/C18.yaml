    from __future__ import annotations

    import os
    from pathlib import Path

    from fastapi import FastAPI

    from app.inbox import Inbox, Target
    from app.mail import mailbox_adapter
    from app.site import pages
    from app.storage.schema import connect


    STORE = connect(Path(os.environ["STATE"]))
    MAIL = mailbox_adapter.access_from_env()
    TARGET = Inbox.Target(STORE, os.environ["INSTALLATION"]) if MAIL else None


    def build() -> FastAPI:
        app = FastAPI()
        app.include_router(pages.section(STORE).router)
        return app


    def start_mail() -> None:
        if TARGET is None or MAIL is None:
            return
        TARGET.inbox = Inbox(STORE, MAIL)


    def health() -> dict[str, str]:
        return {"state": "ok" if STORE else "down"}
