  why: The loop writes every part with its own INSERT and sets the whole report to failed on the first part that fails, so the database calls and the all-or-nothing rule share one function.
  source: A report writer that fails the whole on one part.
  code: |
    from __future__ import annotations

    import sqlite3

    from app.reports.model import Part, Report, ReportState


    def save_part(db: sqlite3.Connection, report: Report, part: Part) -> None:
        db.execute("INSERT INTO report_parts (report, name, body) VALUES (?, ?, ?)",
                   (report.id, part.name, part.body))


    def build(report: Report, parts: list[Part], db: sqlite3.Connection) -> Report:
        """Write the report from its parts; one bad part fails the whole report."""
        for part in parts:
            try:
                save_part(db, report, part)
            except sqlite3.OperationalError:
                report.state = ReportState.FAILED
                db.execute("DELETE FROM report_parts WHERE report = ?", (report.id,))
                return report
        report.state = ReportState.READY
        return report

    def parts_of(db: sqlite3.Connection, report: Report) -> list[tuple]:
        return list(db.execute("SELECT name, body FROM report_parts WHERE report = ?",
                               (report.id,)))


    def ready(report: Report) -> bool:
        return report.state is ReportState.READY
