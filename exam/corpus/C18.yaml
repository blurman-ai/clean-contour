  why: The function fetches messages over IMAP and in the same function decides which of them are invoices by their subject, so transport and the domain decision share one body.
  source: An IMAP scan that picks invoices by subject.
  code: |
    from __future__ import annotations

    import imaplib

    from app.mail.model import Message, Kind


    def open_box(host: str, user: str, password: str) -> imaplib.IMAP4:
        connection = imaplib.IMAP4_SSL(host)
        connection.login(user, password)
        return connection


    def scan(host: str, user: str, password: str, folder: str) -> list[Message]:
        """Read new messages and keep the invoices."""
        connection = open_box(host, user, password)
        try:
            connection.select(folder)
            _, found = connection.search(None, "UNSEEN")
            messages = []
            for uid in found[0].split():
                _, data = connection.fetch(uid, "(BODY.PEEK[HEADER.FIELDS (SUBJECT)])")
                subject = data[0][1].decode(errors="replace").strip()
                kind = Kind.INVOICE if "invoice" in subject.lower() else Kind.LETTER
                if kind is Kind.INVOICE:
                    messages.append(Message(uid=uid.decode(), subject=subject, kind=kind))
            return messages
        finally:
            connection.logout()

    def subject_of(data: list) -> str:
        return data[0][1].decode(errors="replace").strip()
