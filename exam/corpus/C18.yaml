  source: An SMTP policy for long header lines.
  code: |
    from __future__ import annotations

    from dataclasses import dataclass
    from email import policy
    from email.message import EmailMessage
    from email.utils import format_datetime


    WHOLE_LINES = policy.SMTP.clone(max_line_length=None)


    @dataclass(frozen=True)
    class Envelope:
        sender: str
        to: str
        subject: str
        at: object


    def build(envelope: Envelope, text: str) -> EmailMessage:
        message = EmailMessage(policy=WHOLE_LINES)
        message["From"] = envelope.sender
        message["To"] = envelope.to
        message["Subject"] = envelope.subject
        message["Date"] = format_datetime(envelope.at)
        message.set_content(text)
        return message

    def subject(envelope: Envelope, number: str) -> str:
        return f"{envelope.subject} {number}"


    def recipient(envelope: Envelope) -> str:
        return envelope.to
