    from __future__ import annotations

    from urllib.parse import parse_qs

    from fastapi import Request


    async def fields(request: Request) -> dict[str, list[str]]:
        raw = (await request.body()).decode()
        return parse_qs(raw, keep_blank_values=True)


    async def picked(request: Request, name: str) -> list[str]:
        return (await fields(request)).get(name, [])


    async def one(request: Request, name: str, default: str = "") -> str:
        found = await picked(request, name)
        return found[0] if found else default

    def flags(fields: dict[str, list[str]], name: str) -> bool:
        return fields.get(name, [""])[0] in {"1", "on", "true"}


    def number(fields: dict[str, list[str]], name: str, default: int = 0) -> int:
        try:
            return int(fields[name][0])
        except (KeyError, ValueError, IndexError):
            return default


    def summary(fields: dict[str, list[str]]) -> str:
        return ", ".join(sorted(fields))
