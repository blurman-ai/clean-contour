  why: One function checks for an active assignment with SQL and then inserts a new one, so the one-active rule is enforced by the I/O body instead of the state writer.
  source: An assignment guarded by an active-courier check.
  code: |
    from __future__ import annotations

    import sqlite3

    from app.shipments.model import Assignment, Refused


    def current(db: sqlite3.Connection, order: str) -> str | None:
        row = db.execute("SELECT courier FROM assignments WHERE order = ? AND active = 1",
                         (order,)).fetchone()
        return row[0] if row else None


    def assign(order: str, courier: str, db: sqlite3.Connection) -> Assignment:
        """Give the order to the courier unless somebody already holds it."""
        held = current(db, order)
        if held is not None:
            raise Refused(f"the order is already held by {held}")
        db.execute("INSERT INTO assignments (order, courier, active) VALUES (?, ?, 1)",
                   (order, courier))
        return Assignment(order=order, courier=courier, active=True)

    def free_order(db: sqlite3.Connection, order: str) -> bool:
        return current(db, order) is None


    def release(order: str, db: sqlite3.Connection) -> None:
        db.execute("UPDATE assignments SET active = 0 WHERE \"order\" = ?", (order,))


    def of_courier(courier: str, db: sqlite3.Connection) -> list[str]:
        rows = db.execute("SELECT \"order\" FROM assignments WHERE courier = ? AND active = 1",
                          (courier,))
        return [row[0] for row in rows]
