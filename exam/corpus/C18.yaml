  why: The function inserts a document row and computes its number from a config table inside the same function, so the business numbering rule sits in the SQL-writing body.
  source: A document insert that computes its own number.
  code: |
    from __future__ import annotations

    import sqlite3

    from app.warehouse.model import Document, Kind


    def plain(text: str) -> str:
        return " ".join(text.split())


    def next_number(db: sqlite3.Connection, kind: Kind, prefix: str) -> str:
        row = db.execute("SELECT MAX(number) AS last FROM documents WHERE kind = ?",
                         (kind.value,)).fetchone()
        last = int((row["last"] or "0").rsplit("-", 1)[-1])
        return f"{prefix}-{last + 1:05d}"


    def store(document: Document, db: sqlite3.Connection, prefixes: dict[str, str]) -> Document:
        """Write the document under the next free number of its kind."""
        prefix = prefixes[document.kind.value]
        number = next_number(db, document.kind, prefix)
        document = document.with_number(number)
        db.execute("INSERT INTO documents (number, kind, body, created_at) VALUES (?, ?, ?, ?)",
                   (number, document.kind.value, plain(document.body), document.created_at))
        return document

    def kind_of(row: sqlite3.Row) -> Kind:
        return Kind(row[1])


    def prefix_for(kind: Kind, prefixes: dict[str, str]) -> str:
        return prefixes[kind.value]
