  source: A run repository that gates a letter on the run's state.
  code: |
    from __future__ import annotations

    import json
    import sqlite3
    import threading


    class Letters:
        """Letters of a run, in the same file as the run repository."""

        def __init__(self, db: sqlite3.Connection, lock: threading.Lock) -> None:
            self.db, self.lock = db, lock

        def add(self, run_id: int, letter: str) -> bool:
            """Attach a letter to the run unless the run has already stopped."""
            with self.lock:
                cursor = self.db.execute(
                    "UPDATE runs SET letters = json_insert(letters, '$[#]', ?) "
                    "WHERE id = ? AND state = 'going'",
                    (letter, run_id))
            return cursor.rowcount == 1

        def of(self, run_id: int) -> list[str]:
            with self.lock:
                row = self.db.execute("SELECT letters FROM runs WHERE id = ?",
                                      (run_id,)).fetchone()
            return list(json.loads(row[0])) if row else []

        def empty(self, run_id: int) -> bool:
            """Whether the run has no letter yet."""
            return not self.of(run_id)

        def count(self, run_id: int) -> int:
            return len(self.of(run_id))
