  code: |
    from __future__ import annotations

    import sqlite3
    from collections.abc import Callable
    from contextlib import contextmanager


    class StorageDown(Exception):
        """The storage did not answer; the pass stops and retries later."""

        code = "storage_down"


    @contextmanager
    def translated():
        try:
            yield
        except sqlite3.Error as error:
            raise StorageDown(str(error)) from error


    def run(write: Callable[[], None]) -> None:
        with translated():
            write()


    def known(db: sqlite3.Connection, key: str) -> bool:
        row = db.execute("SELECT 1 FROM seen WHERE key = ?", (key,)).fetchone()
        return row is not None

    def missing(error: StorageDown) -> str:
        return error.code
