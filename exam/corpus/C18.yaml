    from __future__ import annotations

    import sqlite3

    from fastapi import APIRouter, Request
    from fastapi.responses import RedirectResponse

    from app.orders.model import OrderState


    routes = APIRouter()


    @routes.get("/orders")
    def list_orders(request: Request, db: sqlite3.Connection):
        rows = db.execute("SELECT number, state FROM orders ORDER BY number").fetchall()
        return {"orders": [{"number": number, "state": state} for number, state in rows]}


    @routes.post("/orders/{number}/cancel")
    def cancel(number: str, db: sqlite3.Connection) -> RedirectResponse:
        db.execute("UPDATE orders SET state = ? WHERE number = ? AND state <> ?",
                   (OrderState.CANCELLED.value, number, OrderState.SHIPPED.value))
        return RedirectResponse("/orders", status_code=303)

    ACTIVE = ("new", "confirmed")


    def active(number: str, state: str) -> bool:
        return state in ACTIVE and bool(number)
