  code: |
    from __future__ import annotations

    import imaplib
    from collections.abc import Iterator
    from contextlib import contextmanager


    class Unavailable(Exception):
        """The mailbox did not answer."""

        code = "unavailable"


    @contextmanager
    def session(host: str, user: str, password: str) -> Iterator[imaplib.IMAP4]:
        try:
            connection = imaplib.IMAP4_SSL(host)
            connection.login(user, password)
        except (OSError, imaplib.IMAP4.error) as error:
            raise Unavailable(str(error)) from error
        try:
            yield connection
        finally:
            try:
                connection.logout()
            except (OSError, imaplib.IMAP4.error):
                pass


    def uids(connection: imaplib.IMAP4, folder: str, criteria: str) -> list[bytes]:
        connection.select(folder)
        _, found = connection.search(None, criteria)
        return found[0].split() if found and found[0] else []
