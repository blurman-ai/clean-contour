  source: An HTTP price-list refresh that also decides acceptance.
  code: |
    from __future__ import annotations

    import json
    import urllib.request

    from app.catalog.model import Price, PriceList


    TIMEOUT = 20


    def accepted(prices: list[Price], minimum: int) -> list[Price]:
        return [price for price in prices if price.amount >= minimum]


    def prices_of(payload: dict) -> list[Price]:
        return [Price(name=row["name"], amount=row["amount"]) for row in payload["prices"]]


    def refresh(url: str, current: PriceList, minimum: int) -> PriceList:
        """Take the supplier price list and keep the prices we accept."""
        request = urllib.request.Request(url, method="GET")
        with urllib.request.urlopen(request, timeout=TIMEOUT) as answer:
            payload = json.loads(answer.read().decode())
        kept = accepted(prices_of(payload), minimum)
        if not kept:
            current.state = "refused"
            return current
        current.state = "ready"
        return PriceList(prices=kept, state=current.state)


    def describe(price_list: PriceList) -> str:
        return f"{len(price_list.prices)} prices, state {price_list.state}"
