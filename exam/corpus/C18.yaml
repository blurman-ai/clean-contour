  code: |
    from __future__ import annotations

    import smtplib

    from app.notices.model import Notice, NoticeState


    ACCOUNT = "robot@example.invalid"


    def header_of(notice: Notice) -> dict[str, str]:
        return {"From": ACCOUNT, "To": notice.address, "Subject": notice.subject}


    def send_notice(notice: Notice, raw: bytes, host: str, port: int) -> Notice:
        """Deliver one notice to its address and remember how it ended."""
        with smtplib.SMTP(host, port, timeout=15) as smtp:
            smtp.sendmail(ACCOUNT, [notice.address], raw)
        notice.state = NoticeState.SENT
        return notice


    def send_all(notices: list[Notice], raw_of, host: str, port: int) -> list[Notice]:
        sent = []
        for notice in notices:
            try:
                sent.append(send_notice(notice, raw_of(notice), host, port))
            except OSError:
                notice.state = NoticeState.FAILED
                sent.append(notice)
        return sent
