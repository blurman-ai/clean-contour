    from __future__ import annotations

    import os
    from dataclasses import dataclass


    @dataclass(frozen=True)
    class Access:
        host: str
        port: int
        tls: bool


    def configured(settings: dict) -> bool:
        return bool(settings.get("host")) and int(settings.get("port", 0)) > 0


    def access(settings: dict) -> Access:
        """Mail access of the contour: the environment wins over the config file."""
        host = os.environ.get("MAIL_HOST", settings["host"])
        port = int(os.environ.get("MAIL_PORT", settings["port"]))
        tls = os.environ.get("MAIL_TLS", str(settings["tls"])).lower() == "true"
        if not host or port <= 0:
            raise ValueError("mail access is not configured")
        return Access(host=host, port=port, tls=tls)

    def tls_of(access: Access) -> str:
        return "tls" if access.tls else "plain"


    def address(access: Access) -> str:
        return f"{access.host}:{access.port}"
