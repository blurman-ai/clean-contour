  why: The rule function decides through the state writer and calls adapter methods; the driver stay behind save() and forget(), so the I/O is not in this body.
  source: A state rule that calls adapter methods.
  code: |
    from __future__ import annotations

    from app.runs.model import Actor, Refused, Run, RunState, write_state
    from app.runs.repository import Runs
    from app.runs.scenario import Scenario


    FINISHABLE = frozenset({RunState.GOING, RunState.NOT_STARTED})


    def writing(store, scenario: Scenario) -> bool:
        return any(task.kind in store.writes and task.state == "taken"
                   for number in scenario.numbers for task in store.tasks_of(number))


    def finish(store, runs: Runs, scenario: Scenario, now) -> Refused | None:
        """Stop the run: forget its scenario data on the stand and hand the cleanup on."""
        run = runs.open(scenario.slug)
        if run is None or run.state not in FINISHABLE:
            return None
        if run.state is RunState.GOING:
            if writing(store, scenario):
                return Refused.WRITING
            for number in scenario.numbers:
                store.forget_trip(number)
        run = write_state(run, RunState.CLEANING, Actor.ENGINEER)
        runs.save(run)
        return None

    def open_run(runs: Runs, scenario: Scenario):
        return runs.open(scenario.slug)
