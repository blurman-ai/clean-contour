  source: Schema creation with a partial unique index.
  code: |
    from __future__ import annotations

    import sqlite3
    import threading

    from app.runs.model import Run, RunState


    ONE_OPEN = ("CREATE UNIQUE INDEX IF NOT EXISTS one_open ON runs (scenario) "
                "WHERE state <> 'finished'")
    REFUSED = "another run of this scenario is still open"


    class Runs:
        def __init__(self, db: sqlite3.Connection) -> None:
            self.db = db
            self.lock = threading.Lock()
            self.db.execute(
                "CREATE TABLE IF NOT EXISTS runs (id INTEGER PRIMARY KEY, scenario TEXT NOT NULL, "
                "state TEXT NOT NULL, started_at TEXT NOT NULL)")
            self.db.execute(ONE_OPEN)

        def start(self, run: Run) -> Run:
            with self.lock:
                try:
                    cursor = self.db.execute(
                        "INSERT INTO runs (scenario, state, started_at) VALUES (?, ?, ?)",
                        (run.scenario, RunState.PREPARING.value, run.started_at.isoformat()))
                except sqlite3.IntegrityError:
                    return Run(run.scenario, RunState.NOT_PREPARED, run.started_at, REFUSED)
            return Run(run.scenario, RunState.PREPARING, run.started_at, "")
