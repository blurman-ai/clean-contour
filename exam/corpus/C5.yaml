  why: Both functions answer whether a price list is in force on a date and compute it themselves, and the branches diverge; an archived price list and the boundary of the last day are treated differently.
  source: Two frontend functions in one module that determine whether a price list is in force by different rules. By form.
  code: |
    import type { PriceList } from "@/entities/price-list/model/types";

    function startOfDay(value: string): number {
      const date = new Date(value);
      date.setHours(0, 0, 0, 0);
      return date.getTime();
    }

    /** Whether the price list is in force on the given date. */
    export function isPriceListActive(list: PriceList, today: Date): boolean {
      if (list.archivedAt) return false;
      const from = startOfDay(list.validFrom);
      const to = list.validTo ? startOfDay(list.validTo) : Infinity;
      return from <= today.getTime() && today.getTime() <= to;
    }

    export function currentPriceList(
      lists: PriceList[],
      today: Date,
    ): PriceList | undefined {
      return lists.find(list => isPriceListActive(list, today));
    }

    export function isPriceListInEffect(list: PriceList, now: number = Date.now()): boolean {
      const from = new Date(list.validFrom).getTime();
      const to = list.validTo ? new Date(list.validTo).getTime() : Infinity;
      return from <= now && now < to;
    }

    export function priceCaption(list: PriceList, now: number = Date.now()): string {
      return isPriceListInEffect(list, now) ? list.title : `${list.title} (not in force)`;
    }

