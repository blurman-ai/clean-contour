    from datetime import date, datetime

    from app.models import Invoice, Shipment


    def invoice_is_overdue(invoice: Invoice, today: date) -> bool:
        """An invoice is overdue after its due date, until it is paid."""
        return invoice.paid_at is None and invoice.due_date < today


    def delivery_is_overdue(shipment: Shipment, now: datetime) -> bool:
        if shipment.delivered_at is not None:
            return False
        return shipment.promised_at is not None and shipment.promised_at < now


    def overdue_summary(
        invoices: list[Invoice], shipments: list[Shipment], now: datetime
    ) -> dict[str, int]:
        return {
            "invoices": sum(1 for item in invoices if invoice_is_overdue(item, now.date())),
            "shipments": sum(1 for item in shipments if delivery_is_overdue(item, now)),
        }
