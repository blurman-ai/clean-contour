  why: Both functions answer whether a report is finished and compute it from a snapshot, but the second allows a closing page to fail, so the rules diverge by a branch.
  source: Two functions in neighboring service-layer modules that compute the readiness of one document from a snapshot.
  code: |
    ### file: app/services/report_projection.py
    def _report_is_completed(snapshot: dict[str, Any]) -> bool:
        if not bool(snapshot.get("title_is_ready")):
            return False
        if not bool(snapshot.get("summary_is_ready")):
            return False
        if not bool(snapshot.get("pages_generated")):
            return False
        return _report_is_publishable(_to_publish_contract(snapshot))

    ### file: app/services/report_revision_gate.py
    def _report_generation_is_completed(
        snapshot: dict[str, Any], *, template_version_id: str | None = None
    ) -> bool:
        """Whether the generator has enough content to finish the author's revision.

        A closing page is required for publication, but its explicitly declared
        nonblocking failure must not keep an otherwise written report in
        ``generating`` forever.
        """

        if not bool(snapshot.get("title_is_ready")):
            return False
        if not bool(snapshot.get("summary_is_ready")):
            return False
        if not bool(snapshot.get("pages_generated")):
            return False

        publishable = _to_publish_contract(
            snapshot, template_version_id=template_version_id
        )
        if _report_is_publishable(publishable):
            return True
        if _report_has_closing_page(publishable):
            return False

        notices = snapshot.get("dispatch_notices")
        if not isinstance(notices, list) or not any(
            isinstance(notice, dict)
            and str(notice.get("code") or "").strip()
            in {"closing_page_generation_blocked", "closing_page_generation_failed"}
            for notice in notices
        ):
            return False

        pages = snapshot.get("pages")
        return isinstance(pages, list) and bool(pages)

