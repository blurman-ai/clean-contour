    export function resolveLibraryListStatus(input: {
      isLoading: boolean;
      itemsCount: number;
      visibleItemsCount: number;
      hasMore: boolean;
      isFetchingNextPage: boolean;
      hasActiveFilter: boolean;
      search: string;
    }) {
      const { isLoading, itemsCount, visibleItemsCount, hasMore, isFetchingNextPage } = input;
      const isEmpty = !isLoading && itemsCount === 0;
      const isPrefetchingFilteredResults =
        !isLoading &&
        itemsCount > 0 &&
        visibleItemsCount === 0 &&
        (hasMore || isFetchingNextPage) &&
        (input.hasActiveFilter || input.search.trim().length > 0);
      const isFilteredEmpty =
        !isLoading && itemsCount > 0 && visibleItemsCount === 0 && !isPrefetchingFilteredResults;
      return { isEmpty, isPrefetchingFilteredResults, isFilteredEmpty };
    }

