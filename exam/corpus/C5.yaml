    from app.models import Pallet


    def pallet_ready_for_dispatch(pallet: Pallet) -> bool:
        if pallet.sealed_at is None:
            return False
        if not pallet.label_printed:
            return False
        return pallet.weight_kg is not None and pallet.weight_kg > 0


    def build_dispatch_batch(pallets: list[Pallet], limit: int) -> list[Pallet]:
        ready = [item for item in pallets if pallet_ready_for_dispatch(item)]
        ready.sort(key=lambda item: item.sealed_at)
        return ready[:limit]


    def pallet_is_dispatchable(pallet: Pallet) -> bool:
        if not pallet.label_printed:
            return False
        if pallet.damage_reported:
            return False
        return pallet.sealed_at is not None


    def release_from_dock(pallets: list[Pallet]) -> list[str]:
        released = []
        for pallet in pallets:
            if pallet_is_dispatchable(pallet):
                pallet.dock_released = True
                released.append(str(pallet.id))
        return released

