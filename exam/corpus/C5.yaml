    def order_payment_status(order: Order) -> str:
        """Payment state of an order, from its payment rows."""

        paid = sum(p.amount for p in order.payments if p.confirmed_at is not None)
        if paid <= 0:
            return "unpaid"
        if paid < order.total_amount:
            return "partially_paid"
        return "paid"

