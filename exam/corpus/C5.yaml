    ### file: src/features/library/lib/inspectionCardState.ts
    export type InspectionCardStateKey =
      | "building"
      | "layoutReady"
      | "prepError"
      | "buildError";

    export function inspectionCardStateKey(
      item: CatalogItem,
      activeDispatchOrderIds?: ReadonlySet<string>,
    ): InspectionCardStateKey | null {
      if (!isBoardOrderItem(item)) return null;
      if (boardItemServiceType(item) !== "inspection") return null;

      if (isInspectionBuilding(item, activeDispatchOrderIds)) return "building";

      if (isBoardOrderTerminalFailure(item.status)) {
        return isInspectionChecklistReady(item) ? "buildError" : "prepError";
      }
      if (isInspectionChecklistReady(item)) return "layoutReady";
      if (item.status === "layout_planning") return "building";
      return null;
    }

    ### file: src/features/library/lib/boardItemKind.ts
    const INSPECTION_BUILDING_STATUSES = new Set(["full_planning", "generating", "queued"]);

    export function isInspectionBuilding(
      item: CatalogItem,
      activeDispatchOrderIds?: ReadonlySet<string>,
    ): boolean {
      if (!isBoardOrderItem(item)) return false;
      if (boardItemServiceType(item) !== "inspection") return false;
      return (
        isInActiveDispatchQueue(item, activeDispatchOrderIds) ||
        INSPECTION_BUILDING_STATUSES.has(item.status)
      );
    }

    export function inspectionDraftBadgeLabelKey(
      item: CatalogItem,
      activeDispatchOrderIds?: ReadonlySet<string>,
    ): "library.itemKind.generating" | "library.inspectionState.building" | "library.itemKind.draft" {
      if (isInActiveDispatchQueue(item, activeDispatchOrderIds)) return "library.itemKind.generating";
      if (isInspectionBuilding(item, activeDispatchOrderIds)) return "library.inspectionState.building";
      return "library.itemKind.draft";
    }

