  source: A pair of checks of whether actions on a shift are allowed, in one module. By form.
  code: |
    from datetime import datetime, timedelta

    from fastapi import HTTPException

    from app.models import Shift, ShiftStatus
    from app.services.shift_state import set_shift_status

    OPEN_WINDOW = timedelta(minutes=15)


    def shift_can_be_opened(shift: Shift, now: datetime) -> bool:
        """Opening is allowed shortly before the planned start."""
        if shift.status != ShiftStatus.PLANNED:
            return False
        return now >= shift.starts_at - OPEN_WINDOW


    def shift_can_be_closed(shift: Shift) -> bool:
        if shift.status != ShiftStatus.OPEN:
            return False
        return all(stop.finished_at is not None for stop in shift.stops)


    async def open_shift(db, shift: Shift, now: datetime) -> None:
        if not shift_can_be_opened(shift, now):
            raise HTTPException(status_code=409, detail="shift_cannot_be_opened")
        set_shift_status(shift, ShiftStatus.OPEN)
        shift.opened_at = now
        await db.commit()


    async def close_shift(db, shift: Shift, now: datetime) -> None:
        if not shift_can_be_closed(shift):
            raise HTTPException(status_code=409, detail="shift_cannot_be_closed")
        set_shift_status(shift, ShiftStatus.CLOSED)
        shift.closed_at = now
        await db.commit()

