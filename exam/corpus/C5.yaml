    def shipment_delivery_status(shipment: Shipment, now: datetime) -> str:
        """Delivery state of a shipment, from its scans and the promised date."""

        if shipment.delivered_at is not None:
            return "delivered"
        if shipment.last_scan_at is None:
            return "not_picked_up"
        if shipment.promised_at is not None and shipment.promised_at < now:
            return "late"
        return "in_transit"

