    async def _preview_result(db, *, inspection, runtime_session, status_before_view, step):
        if step.get("type") != "result_screen":
            return None
        closing_policy = resolve_completion_policy(inspection.final_cargo_json)
        score_percent = float(status_before_view.get("score_percent") or 0.0)
        passed = score_percent >= float(closing_policy["passing_rate_percent"])
        if passed:
            runtime_session.completed_at = runtime_session.completed_at or utcnow()
        await db.flush()
        return {"score_percent": score_percent, "passed": passed}

    ### file: app/services/inspection_scoring.py
    def inspection_policy_can_pass(
        state: dict[str, Any],
        *,
        policy: dict[str, Any] | None = None,
        inspection: dict[str, Any] | None = None,
    ) -> bool:
        minimum_zone = zone_passing_rate_percent(policy)
        zones_pass = inspection is None or categories_meet_minimum(
            inspection,
            state.get("answered_steps"),
            minimum_percent=minimum_zone,
        )
        if policy is None:
            return (
                float(state.get("score_percent") or 0.0) >= DEFAULT_PASSING_SCORE_PERCENT
                and zones_pass
            )
        answered_count = len(
            [item for item in state.get("answered_steps", []) if isinstance(item, dict)]
        )
        return (
            answered_count >= int(policy["effective_check_denominator"])
            and float(score_percent_for_policy(state, policy=policy))
            >= float(policy["passing_rate_percent"])
            and zones_pass
        )

