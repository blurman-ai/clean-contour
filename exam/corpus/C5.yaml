  code: |
    import uuid
    from datetime import datetime

    from sqlalchemy import select

    from app.models import Route, RouteStatus

    FINAL_ROUTE_STATUSES = frozenset({RouteStatus.COMPLETED, RouteStatus.CANCELLED})


    def route_is_final(route: Route) -> bool:
        return route.status in FINAL_ROUTE_STATUSES


    def open_routes_query(depot_id: uuid.UUID):
        return select(Route).where(
            Route.depot_id == depot_id,
            Route.status.not_in(FINAL_ROUTE_STATUSES),
        )


    async def archive_final_routes(db, depot_id: uuid.UUID, now: datetime) -> int:
        rows = (
            await db.scalars(select(Route).where(Route.depot_id == depot_id))
        ).all()
        archived = 0
        for route in rows:
            if route_is_final(route) and route.archived_at is None:
                route.archived_at = now
                archived += 1
        await db.commit()
        return archived

