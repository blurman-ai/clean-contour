    _PHOTO_EXTENSIONS = {".png", ".jpg", ".jpeg", ".gif", ".webp", ".heic"}


    def attachment_kind(
        *, content_type: str | None, original_filename: str
    ) -> AttachmentKind:
        normalized_content_type = (content_type or "").strip().lower()
        if normalized_content_type.startswith("audio/"):
            return "audio"
        if normalized_content_type.startswith("image/"):
            return "image"
        ext = ""
        if original_filename and "." in original_filename:
            ext = f".{original_filename.rsplit('.', 1)[-1].lower()}"
        if ext in SUPPORTED_SCAN_EXTENSIONS:
            return "audio"
        if ext in _PHOTO_EXTENSIONS:
            return "image"
        return "document"

    ### file: src/pages/workspace/files/lib/fileKind.ts
    const PHOTO_EXTENSIONS = new Set([
      ".png", ".jpg", ".jpeg", ".gif", ".webp", ".heic", ".bmp", ".avif",
    ]);
    const SCAN_EXTENSIONS = new Set([".mp3", ".wav", ".m4a", ".ogg", ".flac", ".aac"]);

    export function fileKindOf(params: {
      originalFilename: string;
      contentType?: string | null;
    }): "audio" | "image" | "document" {
      const ext = fileExtLower(params.originalFilename);
      const contentType = (params.contentType ?? "").split(";")[0]!.trim().toLowerCase();
      if (contentType.startsWith("image/") || PHOTO_EXTENSIONS.has(ext)) return "image";
      if (contentType.startsWith("audio/") || SCAN_EXTENSIONS.has(ext)) return "audio";
      return "document";
    }

