  code: |
    ### file: src/widgets/builder/model/parcelReadiness.ts
    export type AttachmentState =
      | "checking"
      | "uploading"
      | "processing"
      | "processed"
      | "failed";

    /** Processing status from the server response (`processing_status` / `status`). */
    export function parcelStateFromServerStatus(
      raw: string | undefined,
    ): AttachmentState {
      if (raw === "processed" || raw === "failed") return raw;
      // The server knows three values: failed, processed, processing. Any other
      // means "processing is not finished".
      return "processing";
    }

    export function initialParcelStateFromServerStatus(
      raw: string | undefined,
    ): AttachmentState {
      return raw === undefined ? "checking" : parcelStateFromServerStatus(raw);
    }

    ### file: src/pages/workspace/files/lib/fileRowState.ts
    export function fileRowState(
      processingStatus: string | null | undefined,
    ): AttachmentState {
      return initialParcelStateFromServerStatus(processingStatus ?? undefined);
    }

    export function isFileReady(processingStatus: string | null | undefined): boolean {
      return fileRowState(processingStatus) === "processed";
    }

    export function isFileFailed(processingStatus: string | null | undefined): boolean {
      return fileRowState(processingStatus) === "failed";
    }

