    ### file: app/services/order_sla.py
    from datetime import datetime, timedelta

    from app.models import Order, OrderStatus

    GRACE = timedelta(minutes=30)


    def order_is_overdue(order: Order, now: datetime) -> bool:
        if order.status in (OrderStatus.DELIVERED, OrderStatus.CANCELLED):
            return False
        if order.promised_at is None:
            return False
        return now > order.promised_at + GRACE


    def overdue_minutes(order: Order, now: datetime) -> int:
        if not order_is_overdue(order, now):
            return 0
        return int((now - order.promised_at).total_seconds() // 60)

    ### file: app/api/dashboard.py
    def _is_late(order: Order, now: datetime) -> bool:
        if order.status == OrderStatus.DELIVERED:
            return False
        return order.promised_at is not None and order.promised_at < now


    @router.get("/dashboard/late-orders")
    async def late_orders(db: AsyncSession = Depends(get_db)):
        now = utcnow()
        rows = (
            await db.scalars(select(Order).where(Order.promised_at.is_not(None)))
        ).all()
        late = [order for order in rows if _is_late(order, now)]
        return {"count": len(late), "order_ids": [str(order.id) for order in late]}

