  source: A pair of promotion state functions on the frontend designed as two different questions. By form.
  code: |
    import type { Promo } from "@/entities/promo/model/types";

    export function wasEverRedeemed(promo: Promo): boolean {
      return promo.redemptions.length > 0;
    }

    export function isPromoInEffect(promo: Promo, now: Date): boolean {
      if (promo.revokedAt) return false;
      const from = new Date(promo.startsAt);
      const to = promo.endsAt ? new Date(promo.endsAt) : null;
      return from <= now && (to === null || now < to);
    }

    export function promoBadge(promo: Promo, now: Date): "active" | "used" | "expired" {
      if (isPromoInEffect(promo, now)) return "active";
      return wasEverRedeemed(promo) ? "used" : "expired";
    }

    export function promoRows(promos: Promo[], now: Date) {
      return promos.map(promo => ({
        id: promo.id,
        title: promo.title,
        badge: promoBadge(promo, now),
        redemptions: promo.redemptions.length,
      }));
    }

