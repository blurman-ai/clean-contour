  code: |
    import { useForm } from "@mantine/form";
    import { TextInput, Button } from "@mantine/core";
    import { useTranslation } from "react-i18next";
    import { DepotRefusalCode, readApiErrorCode } from "@/shared/api";
    import { showRefusal } from "@/shared/api/lib/showRefusal";
    import { useRenameDepot } from "../model/useRenameDepot";

    export function DepotRenameForm({ depotId, name }: { depotId: string; name: string }) {
      const { t } = useTranslation();
      const form = useForm({ initialValues: { name } });
      const rename = useRenameDepot(depotId);

      const submit = form.onSubmit(async (values) => {
        try {
          await rename.mutateAsync(values.name);
        } catch (error) {
          if (readApiErrorCode(error) === DepotRefusalCode.NAME_TAKEN) {
            form.setFieldError("name", t("depots.refusal.nameTaken"));
            return;
          }
          showRefusal(error);
        }
      });

      return (
        <form onSubmit={submit}>
          <TextInput label={t("depots.name")} {...form.getInputProps("name")} />
          <Button type="submit" loading={rename.isPending}>{t("common.save")}</Button>
        </form>
      );
    }

