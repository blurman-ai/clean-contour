- id: C15-06
  card: C15
  expected: clean
  path: app/api/bookings.py
  why: Each failure class of the external carrier is mapped to its own member of the code list, there is no common code, and an unknown failure is rethrown.
  source: Carrier booking handler.
  code: |
    @router.post("/{shipment_id}/booking")
    async def book_shipment(
        shipment_id: UUID,
        db: AsyncSession = Depends(get_db),
        carrier: CarrierClient = Depends(get_carrier),
    ):
        shipment = await load_shipment(db, shipment_id)
        try:
            booking = await carrier.book(shipment.to_carrier_payload())
        except CarrierTimeout as exc:
            raise HTTPException(
                status_code=504,
                detail={"code": BookingRefusalCode.CARRIER_TIMEOUT.value},
            ) from exc
        except CarrierRejected as exc:
            raise HTTPException(
                status_code=409,
                detail={"code": BookingRefusalCode(exc.reason).value},
            ) from exc
        except CarrierQuotaExceeded as exc:
            raise HTTPException(
                status_code=429,
                detail={"code": BookingRefusalCode.CARRIER_QUOTA_EXCEEDED.value},
            ) from exc
        shipment.booking_ref = booking.reference
        await db.commit()
        return BookingOut.model_validate(booking)

