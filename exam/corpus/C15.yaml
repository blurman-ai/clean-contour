  why: The function reads the refusal code but reduces three different codes to one common text.
  source: Choosing the refusal text when connecting a carrier.
  code: |
    import i18n from "@/shared/i18n";
    import { readApiErrorCode } from "@/shared/api";

    export function connectErrorText(error: unknown): string {
      const code = readApiErrorCode(error);

      if (code === "carrier_credentials_invalid") {
        return i18n.t("carriers.connect.credentialsInvalid");
      }
      if (
        code === "carrier_account_suspended" ||
        code === "carrier_region_unsupported" ||
        code === "carrier_contract_expired"
      ) {
        return i18n.t("carriers.connect.failed");
      }
      if (code === "carrier_already_connected") {
        return i18n.t("carriers.connect.alreadyConnected");
      }
      return i18n.t("carriers.connect.failed");
    }

    export function isRetryable(error: unknown): boolean {
      return readApiErrorCode(error) === "carrier_timeout";
    }

