- id: C15-19
  card: C15
  expected: clean
  path: app/src/main/kotlin/returns/RefundState.kt
  why: Near miss — the state carries the refusal code and the screen mapper switches over the typed members, one text each.
  source: The same refund screen with the code read.
  code: |
    package returns

    enum class RefundRefusal { WINDOW_CLOSED, NO_PAYMENT, DUPLICATE }

    data class RefundUiState(
        val busy: Boolean = false,
        val refusal: RefundRefusal? = null,
    )

    fun RefundUiState.refusalText(): String? = when (refusal) {
        RefundRefusal.WINDOW_CLOSED -> "The return window is closed."
        RefundRefusal.NO_PAYMENT -> "No payment found for this order."
        RefundRefusal.DUPLICATE -> "A refund is already in progress."
        null -> null
    }

    fun reduce(state: RefundUiState, event: RefundEvent): RefundUiState {
        if (event is RefundEvent.Refused) {
            return state.copy(refusal = event.code)
        }
        return state
    }

