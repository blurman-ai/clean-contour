- id: C15-03
  card: C15
  expected: dirty
  path: src/shared/api/lib/refusalText.ts
  why: The refusal text table is declared as Record<string, string>, so a contract code without text is not caught by the compiler and falls to the generic text.
  source: Shared function that chooses the refusal text by the response code.
  code: |
    import i18n from "@/shared/i18n";
    import { readApiErrorCode } from "./apiError";

    const REFUSAL_TEXT: Record<string, string> = {
      depot_not_found: "refusal.depotNotFound",
      depot_name_taken: "refusal.depotNameTaken",
      route_closed: "refusal.routeClosed",
      carrier_unavailable: "refusal.carrierUnavailable",
      manifest_locked: "refusal.manifestLocked",
    };

    export function refusalMessage(error: unknown): string {
      const code = readApiErrorCode(error);
      if (code && code in REFUSAL_TEXT) {
        return i18n.t(REFUSAL_TEXT[code]);
      }
      return i18n.t("refusal.generic");
    }

    export function isKnownRefusal(error: unknown): boolean {
      const code = readApiErrorCode(error);
      return code != null && code in REFUSAL_TEXT;
    }

