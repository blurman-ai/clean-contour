  why: The server refuses to save the order with different codes, and the error handler does not read the code and shows one text for all reasons.
  source: Order save hook with a mutation error handler.
  code: |
    import { useMutation, useQueryClient } from "@tanstack/react-query";
    import { useTranslation } from "react-i18next";
    import { notifications } from "@mantine/notifications";
    import { api } from "@/shared/api";
    import type { OrderDraft } from "@/entities/order";

    export function useSaveOrder(orderId: string) {
      const { t } = useTranslation();
      const queryClient = useQueryClient();

      return useMutation({
        mutationFn: (draft: OrderDraft) =>
          api.PUT("/orders/{order_id}", {
            params: { path: { order_id: orderId } },
            body: draft,
          }),
        onSuccess: () => {
          queryClient.invalidateQueries({ queryKey: ["order", orderId] });
          notifications.show({ color: "green", message: t("orders.saved") });
        },
        onError: () => {
          notifications.show({ color: "red", message: t("orders.saveFailed") });
        },
      });
    }

