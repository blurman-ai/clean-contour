    ROUTE_FILE_MAX_BYTES = 5 * 1024 * 1024
    ROUTE_MAX_STOPS = 400


    async def read_route_file(file: UploadFile) -> list[dict]:
        raw = await file.read()
        if len(raw) > ROUTE_FILE_MAX_BYTES:
            raise HTTPException(
                status_code=413,
                detail="Route file is too large",
            )
        try:
            data = json.loads(raw.decode("utf-8"))
        except (UnicodeDecodeError, json.JSONDecodeError) as exc:
            raise HTTPException(
                status_code=422,
                detail="Failed to read the route file",
            ) from exc
        stops = data.get("stops")
        if not isinstance(stops, list):
            raise HTTPException(status_code=422, detail="The file has no stops")
        if len(stops) > ROUTE_MAX_STOPS:
            raise HTTPException(status_code=422, detail="Too many stops")
        return stops

- id: C15-08
  card: C15
  expected: clean
  path: app/services/route_import.py
  why: Each reason for a route import refusal is its own member of the list in detail, and the client chooses the text for the user by the code.
  source: Check of the size and contents of a route file before import.
  code: |
    class RouteImportRefusal(StrEnum):
        FILE_TOO_LARGE = "route_file_too_large"
        FILE_UNREADABLE = "route_file_unreadable"
        STOPS_MISSING = "route_stops_missing"
        STOPS_LIMIT_EXCEEDED = "route_stops_limit_exceeded"


    def refuse(status_code: int, code: RouteImportRefusal) -> HTTPException:
        return HTTPException(status_code=status_code, detail={"code": code.value})


    async def read_route_file(file: UploadFile) -> list[dict]:
        raw = await file.read()
        if len(raw) > ROUTE_FILE_MAX_BYTES:
            raise refuse(413, RouteImportRefusal.FILE_TOO_LARGE)
        try:
            data = json.loads(raw.decode("utf-8"))
        except (UnicodeDecodeError, json.JSONDecodeError) as exc:
            raise refuse(422, RouteImportRefusal.FILE_UNREADABLE) from exc
        stops = data.get("stops")
        if not isinstance(stops, list):
            raise refuse(422, RouteImportRefusal.STOPS_MISSING)
        if len(stops) > ROUTE_MAX_STOPS:
            raise refuse(422, RouteImportRefusal.STOPS_LIMIT_EXCEEDED)
        return stops

