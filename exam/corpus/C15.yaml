  why: The client keeps its own copy of the code list as strings, and a code that is not in the copy gets the generic text.
  source: List of known refusal codes and the choice of text.
  code: |
    import i18n from "@/shared/i18n";
    import { readApiErrorCode } from "./apiError";

    export const BOOKING_ERROR_CODES = [
      "carrier_timeout",
      "carrier_quota_exceeded",
      "shipment_already_booked",
      "shipment_weight_exceeded",
    ] as const;

    type BookingErrorCode = (typeof BOOKING_ERROR_CODES)[number];

    function isBookingErrorCode(code: string | null): code is BookingErrorCode {
      return code != null && (BOOKING_ERROR_CODES as readonly string[]).includes(code);
    }

    export function bookingErrorText(error: unknown): string {
      const code = readApiErrorCode(error);
      if (isBookingErrorCode(code)) {
        return i18n.t(`bookings.refusal.${code}`);
      }
      return i18n.t("bookings.refusal.generic");
    }

