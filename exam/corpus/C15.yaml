    async def sync_depots(db: AsyncSession, registry: RegistryClient) -> int:
        updated = 0
        cursor: str | None = None
        while True:
            try:
                page = await registry.list_depots(cursor=cursor, limit=200)
            except Exception:
                log.exception("depot_sync_page_failed cursor=%s", cursor)
                raise
            for item in page.items:
                depot = await db.scalar(
                    select(Depot).where(Depot.registry_id == item.id)
                )
                if depot is None:
                    db.add(Depot.from_registry(item))
                else:
                    depot.apply_registry(item)
                updated += 1
            await db.commit()
            if page.next_cursor is None:
                return updated
            cursor = page.next_cursor

