      return useMutation({
        mutationFn: (body: components["schemas"]["ShipmentCreate"]) =>
          api.POST("/shipments", { body }),
        onError: (error) => {
          const code = readApiErrorCode<ShipmentRefusalCode>(error);
          notifications.show({ color: "red", message: t(refusalText[code]) });
