  source: API call wrapper that writes failures to the frontend log.
  code: |
    import { logger } from "@/shared/lib/logger";
    import { readApiErrorCode, readApiStatus } from "./apiError";

    export async function withRequestLog<T>(
      name: string,
      request: () => Promise<T>,
    ): Promise<T> {
      const started = performance.now();
      try {
        const result = await request();
        logger.debug("api_request_ok", { name, ms: performance.now() - started });
        return result;
      } catch (error) {
        logger.warn("api_request_failed", {
          name,
          ms: performance.now() - started,
          status: readApiStatus(error),
          code: readApiErrorCode(error),
        });
        throw error;
      }
    }

    export function requestName(method: string, path: string): string {
      return `${method.toUpperCase()} ${path}`;
    }

