  code: |
    import { useState } from "react";
    import { useTranslation } from "react-i18next";
    import { api } from "@/shared/api";

    export function usePayInvoice(invoiceId: string) {
      const { t } = useTranslation();
      const [message, setMessage] = useState<string | null>(null);
      const [pending, setPending] = useState(false);

      async function pay(cardToken: string) {
        setPending(true);
        setMessage(null);
        try {
          await api.POST("/invoices/{invoice_id}/pay", {
            params: { path: { invoice_id: invoiceId } },
            body: { card_token: cardToken },
          });
          setMessage(t("invoices.paid"));
        } catch {
          setMessage(t("invoices.payDeclined"));
        } finally {
          setPending(false);
        }
      }

      return { pay, pending, message };
    }

