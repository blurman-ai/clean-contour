    import { api, readApiErrorCode } from "@/shared/api";
    import type { components } from "@/shared/api/generated/schema";

    type ShipmentRefusalCode = components["schemas"]["ShipmentRefusalCode"];

    const refusalText = {
      shipment_weight_exceeded: "shipments.refusal.weightExceeded",
      shipment_route_closed: "shipments.refusal.routeClosed",
      shipment_depot_inactive: "shipments.refusal.depotInactive",
      shipment_duplicate_reference: "shipments.refusal.duplicateReference",
    } as const satisfies Record<ShipmentRefusalCode, string>;

