- id: C25-14
  card: C25
  expected: clean
  path: src/ui/timeago.ts
  why: Near miss of Date.now() — it only formats a stored timestamp for display, no rule reads the value.
  source: A UI helper rendering ages of stored items.
  code: |
    export function timeAgo(storedAt: number, now: number = Date.now()): string {
      const seconds = Math.max(0, Math.floor((now - storedAt) / 1000));
      if (seconds < 60) return `${seconds}s ago`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      return `${Math.floor(hours / 24)}d ago`;
    }

    export function renderRow(item: { label: string; createdAt: number }): string {
      return `${item.label} — ${timeAgo(item.createdAt)}`;
    }

    export function sortNewestFirst<T extends { createdAt: number }>(items: T[]): T[] {
      return [...items].sort((a, b) => b.createdAt - a.createdAt);
    }

