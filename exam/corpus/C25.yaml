- id: C25-21
  card: C25
  expected: dirty
  path: app/src/main/kotlin/promo/Expiry.kt
  why: The expiry rule calls Instant.now() at decision time — whether a coupon counts as expired depends on the device clock.
  source: A promo expiry rule reading the clock itself.
  code: |
    package promo

    import java.time.Instant

    data class Coupon(val code: String, val validUntil: Instant, val redeemed: Int, val limit: Int)

    sealed class Verdict {
        object Ok : Verdict()
        data class Refused(val why: String) : Verdict()
    }

    fun isExpired(coupon: Coupon): Boolean = Instant.now() > coupon.validUntil

    fun judge(coupon: Coupon): Verdict {
        if (coupon.redeemed >= coupon.limit) return Verdict.Refused("limit")
        if (isExpired(coupon)) return Verdict.Refused("expired")
        return Verdict.Ok
    }

    fun usable(coupons: List<Coupon>): List<Coupon> {
        return coupons.filter { judge(it) is Verdict.Ok }
    }
