  source: A feature flag splitting customers by coin flip at read time.
  code: |
    type Variant = "control" | "treatment";

    export function pickVariant(orderId: string): Variant {
      return Math.random() < 0.5 ? "control" : "treatment";
    }

    export function shippingFee(orderId: string, base: number): number {
      const variant = pickVariant(orderId);
      return variant === "treatment" ? Math.round(base * 0.9) : base;
    }

    export function renderBadge(orderId: string): string {
      return pickVariant(orderId) === "treatment" ? "sale" : "";
    }

    export function summarize(rows: { fee: number }[]): number {
      return rows.reduce((s, r) => s + r.fee, 0);
    }

- id: C25-06
  card: C25
  expected: dirty
  path: internal/lease/holder.go
  why: The takeover decision reads time.Now() directly inside the rule — whether a lease counts as lost depends on the local clock.
  source: A job lease holder deciding to take over stalled work.
  code: |
    package lease

    import "time"

    type Lease struct {
        JobID string
        Owner string
        Until time.Time
    }

    func Stalled(l Lease) bool {
        return time.Now().After(l.Until)
    }

    func TakeOver(l Lease, newOwner string) (Lease, bool) {
        if !Stalled(l) {
            return l, false
        }
        next := Lease{JobID: l.JobID, Owner: newOwner, Until: time.Now().Add(5 * time.Minute)}
        return next, true
    }

- id: C25-07
  card: C25
  expected: clean
  path: app/src/main/kotlin/promo/Coupon.kt
  why: The coupon rule judge takes the moment as a parameter and apply is the thin boundary caller that reads the clock once to hand it in.
  source: A promo module judging coupons.
  code: |
    package promo

    import java.time.Instant

    data class Coupon(val code: String, val validUntil: Instant, val redeemed: Int, val limit: Int)

    sealed class Verdict {
        object Ok : Verdict()
        data class Refused(val why: String) : Verdict()
    }

    fun judge(coupon: Coupon, at: Instant): Verdict {
        if (coupon.redeemed >= coupon.limit) return Verdict.Refused("limit")
        if (at > coupon.validUntil) return Verdict.Refused("expired")
        return Verdict.Ok
    }

    fun apply(coupon: Coupon): Verdict = judge(coupon, Instant.now())

- id: C25-08
  card: C25
  expected: dirty
  path: Services/Reservations/Expiry.cs
  why: The reservation expiry reads UtcNow inside the rule and writes a terminal state from it.
  source: A booking service cancelling lapsed reservations.
  code: |
    using System;

    namespace Services.Reservations;

    public enum ReservationState { Hold, Confirmed, Cancelled }

    public sealed class Reservation
    {
        public Guid Id { get; init; }
        public ReservationState State { get; set; }
        public DateTime HoldsUntil { get; init; }
    }

    public static class Expiry
    {
        public static bool Lapsed(Reservation r) => DateTime.UtcNow > r.HoldsUntil;

        public static void Sweep(Reservation r)
        {
            if (r.State == ReservationState.Hold && Lapsed(r))
            {
                r.State = ReservationState.Cancelled;
            }
        }
    }

- id: C25-09
  card: C25
  expected: dirty
  path: app/api/limits.py
  why: The rate-limit window is measured by time.time() inside the rule — the limit depends on the process clock and resets silently on restart.
  source: An API limiter with a hand-rolled sliding window.
  code: |
    import time

    WINDOW = 60.0
    LIMIT = 30


    def allow(client: str, ledger: dict) -> bool:
        hits = ledger.get(client, [])
        now = time.time()
        fresh = [t for t in hits if now - t < WINDOW]
        if len(fresh) >= LIMIT:
            ledger[client] = fresh
            return False
        fresh.append(now)
        ledger[client] = fresh
        return True


    def remaining(client: str, ledger: dict) -> int:
        now = time.time()
        fresh = [t for t in ledger.get(client, []) if now - t < WINDOW]
        return max(0, LIMIT - len(fresh))

- id: C25-10
  card: C25
  expected: dirty
  path: Services/Webhooks/Delivery.cs
  why: The idempotency key is a fresh GUID per attempt — retries reach the receiver under different keys and cannot be deduplicated.
  source: A webhook dispatcher inventing its event id per attempt.
  code: |
    using System;

    namespace Services.Webhooks;

    public sealed class Dispatcher
    {
        private readonly Sender _sender = new Sender();

        public async Task DeliverAsync(Subscription sub, Payload payload)
        {
            var attempt = new OutgoingEvent
            {
                Id = Guid.NewGuid().ToString("N"),
                SubscriptionId = sub.Id,
                Body = payload.Body,
            };
            await _sender.SendAsync(sub.Url, attempt, idempotencyKey: attempt.Id);
        }

        public async Task DeliverWithRetryAsync(Subscription sub, Payload payload, int tries = 3)
        {
            for (var i = 0; i < tries; i++)
            {
                try
                {
                    await DeliverAsync(sub, payload);
                    return;
                }
                catch (SendException) when (i < tries - 1) { }
            }
        }
    }

