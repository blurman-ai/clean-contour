- id: C25-01
  card: C25
  expected: dirty
  path: app/dispatch/retry.py
  why: The worker's own clock decides whether a delivery may retry, so a skewed clock moves the rule.
  source: A dispatch worker gating retries by a deadline.
  code: |
    from datetime import datetime, timedelta

    RETRY_AFTER = timedelta(seconds=90)


    def retry_allowed(attempt) -> bool:
        if attempt.tries >= 5:
            return False
        return attempt.last_error_at + RETRY_AFTER <= datetime.now()


    def next_run(attempt, now: datetime) -> datetime:
        return attempt.last_error_at + RETRY_AFTER


    def pump(queue) -> int:
        sent = 0
        for attempt in queue.pending():
            if retry_allowed(attempt):
                deliver(attempt)
                sent += 1
        return sent

- id: C25-02
  card: C25
