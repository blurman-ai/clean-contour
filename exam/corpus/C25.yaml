  why: The expiry rule reads utcnow directly and writes a state on the session, so the transition depends on the process clock.
  source: A session service forcing a logout on expiry.
  code: |
    from datetime import datetime, timezone


    def session_state(user) -> str:
        valid_until = user.session_valid_until
        if valid_until is None:
            return "anonymous"
        if datetime.now(timezone.utc) > valid_until:
            user.session_state = "expired"
            return "expired"
        return user.session_state


    def require_user(user) -> None:
        state = session_state(user)
        if state in ("anonymous", "expired"):
            raise NotAuthenticated(state)


    def open_session(user, ttl_seconds: int) -> datetime:
        user.session_valid_until = datetime.now(timezone.utc) + timedelta(seconds=ttl_seconds)
        return user.session_valid_until

- id: C25-03
  card: C25
  expected: dirty
  path: app/payments/submit.py
  why: A fresh random idempotency key per attempt — retries can no longer be deduplicated, the random value decides the key.
  source: A payment submit generating its own dedup key.
  code: |
    import uuid


    def submit(payment, gateway) -> str:
        key = uuid.uuid4().hex
        return gateway.charge(
            card=payment.card_token,
            amount=payment.amount,
            currency=payment.currency,
            idempotency_key=key,
        )


    def submit_with_retry(payment, gateway, tries: int = 3) -> str:
        last = None
        for _ in range(tries):
            try:
                return submit(payment, gateway)
            except GatewayTimeout as e:
                last = e
        raise last

- id: C25-04
  card: C25
  expected: dirty
  path: src/tasks/overdue.ts
  why: The browser clock decides the expired state of a stored task — the rule reads Date.now() instead of a server field.
  source: A task tracker marking overdue items in a rule module.
  code: |
    type Task = { id: string; dueAt: number; state: "open" | "expired" | "done" };

    export function isOverdue(task: Task): boolean {
      return task.state === "open" && Date.now() > task.dueAt;
    }

    export function applyOverdue(task: Task): Task {
      if (isOverdue(task)) {
        return { ...task, state: "expired" };
      }
      return task;
    }

    export function rollup(tasks: Task[]): { open: number; expired: number } {
      const next = tasks.map(applyOverdue);
      return {
        open: next.filter((t) => t.state === "open").length,
        expired: next.filter((t) => t.state === "expired").length,
      };
    }

