- id: C25-19
  card: C25
  expected: clean
  path: app/dispatch/backoff.py
  why: Near miss of random — the jitter only spaces the sleep between retries; it decides neither the outcome nor any key.
  source: A retry loop with jittered backoff.
  code: |
    import random
    import time

    BASE_DELAY = 2.0
    MAX_DELAY = 30.0


    def sleep_jitter(tries: int) -> None:
        cap = min(MAX_DELAY, BASE_DELAY * 2 ** tries)
        time.sleep(random.uniform(0, cap))


    def deliver(attempt) -> bool:
        for try_no in range(4):
            try:
                send(attempt)
                return True
            except TransportError:
                if try_no == 3:
                    raise
                sleep_jitter(try_no)
        return False

