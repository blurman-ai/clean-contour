- id: C17-01
  card: C17
  expected: dirty
  path: web/src/features/orders/OrderDetails.tsx
  why: The cancel button is shown by a client copy of the rule status === submitted; the server allows cancel from more statuses.
  source: Order details page with a cancel action.
  code: |
    import { useMutation, useQuery } from "@tanstack/react-query";
    import { api } from "../../api";
    import type { OrderDto } from "../../api/types";

    export function OrderDetails({ orderId }: { orderId: string }) {
      const { data: order } = useQuery({
        queryKey: ["order", orderId],
        queryFn: () => api.get<OrderDto>(`/orders/${orderId}`),
      });
      const cancel = useMutation({
        mutationFn: () => api.put(`/orders/${orderId}/cancel`),
      });

      if (!order) return <Spinner />;

      const canCancel = order.status === "submitted";

      return (
        <section>
          <h1>Order {order.number}</h1>
          <StatusBadge status={order.status} />
          <ItemsTable items={order.items} />
          {canCancel && (
            <Button variant="danger" onClick={() => cancel.mutate()}>
              Cancel order
            </Button>
          )}
        </section>
      );
    }

- id: C17-02
  card: C17
  expected: dirty
  path: web/src/features/imports/ImportRow.tsx
  why: Whether a retry is offered is decided by the client from attempts < 3, a copy of the server retry limit.
  source: Row of a list of price imports with a retry button.
  code: |
    import type { PriceImportDto } from "../../api/types";

    const MAX_ATTEMPTS = 3;

    type Props = {
      item: PriceImportDto;
      onRetry: (id: string) => void;
    };

    export function ImportRow({ item, onRetry }: Props) {
      const failed = item.status === "failed";
      const showRetry = failed && item.attempts < MAX_ATTEMPTS;

      return (
        <tr>
          <td>{item.fileName}</td>
          <td>{item.supplierName}</td>
          <td>
            <StatusBadge status={item.status} />
          </td>
          <td>{item.attempts}</td>
          <td>
            {showRetry ? (
              <button type="button" onClick={() => onRetry(item.id)}>
                Retry
              </button>
            ) : null}
          </td>
        </tr>
      );
    }

- id: C17-03
  card: C17
  expected: dirty
  path: web/src/features/bookings/EditBookingButton.tsx
  why: Whether editing is allowed is decided by comparing the browser clock with a deadline; the server rule is copied on the client.
  source: Delivery slot booking card with an edit action.
  code: |
    import { Link } from "react-router-dom";
    import type { SlotBookingDto } from "../../api/types";

    const EDIT_WINDOW_HOURS = 24;

    export function EditBookingButton({ booking }: { booking: SlotBookingDto }) {
      const slotStart = new Date(booking.slotStart).getTime();
      const editableUntil = slotStart - EDIT_WINDOW_HOURS * 60 * 60 * 1000;
      const canEdit = booking.status === "confirmed" && Date.now() < editableUntil;

      return (
        <div className="booking-actions">
          <span>
            {new Date(booking.slotStart).toLocaleString()} at dock {booking.dock}
          </span>
          {canEdit ? (
            <Link to={`/bookings/${booking.id}/edit`} className="btn">
              Change slot
            </Link>
          ) : (
            <span className="muted">Slot is locked</span>
          )}
        </div>
      );
    }

- id: C17-04
  card: C17
  expected: dirty
  path: web/src/features/expenses/ExpenseActions.tsx
  why: The approve button is shown by the client from the user role and the report status, not from a server field.
  source: Expense report page with approve and reject actions.
  code: |
    import { useCurrentUser } from "../../auth/useCurrentUser";
    import type { ExpenseReportDto } from "../../api/types";

    type Props = {
      report: ExpenseReportDto;
      onApprove: () => void;
      onReject: () => void;
    };

    export function ExpenseActions({ report, onApprove, onReject }: Props) {
      const user = useCurrentUser();
      const isApprover = user.role === "manager" || user.role === "finance";
      const pending = report.status === "submitted";
      const notOwn = report.authorId !== user.id;

      if (!(isApprover && pending && notOwn)) {
        return null;
      }

      return (
        <div className="actions">
          <button type="button" onClick={onApprove}>
            Approve
          </button>
          <button type="button" onClick={onReject}>
            Reject
          </button>
        </div>
      );
    }

- id: C17-05
  card: C17
  expected: dirty
  path: web/src/lib/tickets.ts
  why: canReopen is a client rule over status and a lock flag, used to show the reopen action.
  source: Helper module for the support ticket screens.
  code: |
    import type { TicketDto } from "../api/types";

    export function ticketTitle(t: TicketDto): string {
      return `#${t.number} ${t.subject}`;
    }

    export function canReopen(t: TicketDto): boolean {
      return ["closed", "resolved"].includes(t.status) && !t.locked;
    }

    export function canReply(t: TicketDto): boolean {
      return t.status !== "closed" && !t.locked;
    }

    export function ticketMenu(t: TicketDto): { key: string; label: string }[] {
      const items = [{ key: "copy-link", label: "Copy link" }];
      if (canReply(t)) {
        items.push({ key: "reply", label: "Reply" });
      }
      if (canReopen(t)) {
        items.push({ key: "reopen", label: "Reopen" });
      }
      return items;
    }

