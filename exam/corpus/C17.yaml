- id: C17-16
  card: C17
  expected: clean
  path: src/ShipmentApp/ViewModels/ShipmentDetailViewModel.cs
  why: IsCancellable is copied from CanCancel of the server response; the client keeps no rule.
  source: MAUI view model of a shipment details screen.
  code: |
    public partial class ShipmentDetailViewModel : ViewModelBase
    {
        private readonly IShipmentService _shipments;

        [ObservableProperty]
        private ShipmentDto _shipment;

        [ObservableProperty]
        private bool _isCancellable;

        public ShipmentDetailViewModel(IShipmentService shipments, INavigationService nav)
            : base(nav)
        {
            _shipments = shipments;
        }

        public override async Task InitializeAsync(string shipmentId)
        {
            await IsBusyFor(async () =>
            {
                Shipment = await _shipments.GetAsync(shipmentId);
                IsCancellable = Shipment.CanCancel;
            });
        }

        [RelayCommand]
        private async Task CancelAsync()
        {
            await _shipments.CancelAsync(Shipment.Id);
            Shipment = await _shipments.GetAsync(Shipment.Id);
            IsCancellable = Shipment.CanCancel;
        }
    }

