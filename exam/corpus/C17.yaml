- id: C17-09
  card: C17
  expected: dirty
  path: web/src/features/drafts/ReviewPage.tsx
  why: The route opens the review page only when the client sees stage review; the decision to let the user review is made from a stage value on the client.
  source: Review page of a document draft.
  code: |
    import { useEffect } from "react";
    import { useNavigate, useParams } from "react-router-dom";
    import { useDraft } from "./useDraft";

    export function ReviewPage() {
      const { draftId } = useParams();
      const navigate = useNavigate();
      const { data: draft } = useDraft(draftId!);

      useEffect(() => {
        if (!draft) return;
        if (draft.stage !== "review" || draft.reviewerId === null) {
          navigate(`/drafts/${draftId}`, { replace: true });
        }
      }, [draft, draftId, navigate]);

      if (!draft) return <Spinner />;

      return (
        <ReviewLayout>
          <DraftText text={draft.body} />
          <ReviewForm draftId={draft.id} />
        </ReviewLayout>
      );
    }

- id: C17-10
  card: C17
  expected: dirty
  path: web/src/features/subscriptions/actions.ts
  why: The list of actions offered to the user is built on the client from the subscription status.
  source: Subscription screen helper that builds menu actions.
  code: |
    import type { SubscriptionDto } from "../../api/types";

    export type SubscriptionAction = "pause" | "resume" | "cancel" | "change-plan";

    export function subscriptionActions(sub: SubscriptionDto): SubscriptionAction[] {
      const actions: SubscriptionAction[] = [];
      if (sub.status === "active") {
        actions.push("pause", "change-plan");
      }
      if (sub.status === "paused") {
        actions.push("resume");
      }
      if (sub.status === "active" || sub.status === "paused") {
        actions.push("cancel");
      }
      return actions;
    }

    export const actionLabels: Record<SubscriptionAction, string> = {
      pause: "Pause",
      resume: "Resume",
      cancel: "Cancel subscription",
      "change-plan": "Change plan",
    };

