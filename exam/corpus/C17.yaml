- id: C17-13
  card: C17
  expected: clean
  path: web/src/features/account/InviteForm.tsx
  why: The submit button is disabled by the shape of the input (an email format, a required name); that is input checking, not a permission.
  source: Form for inviting a colleague.
  code: |
    import { useState } from "react";

    const EMAIL = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

    export function InviteForm({ onInvite }: { onInvite: (v: InviteValues) => void }) {
      const [email, setEmail] = useState("");
      const [name, setName] = useState("");

      const emailOk = EMAIL.test(email);
      const nameOk = name.trim().length > 0 && name.length <= 80;

      return (
        <form
          onSubmit={(e) => {
            e.preventDefault();
            onInvite({ email, name });
          }}
        >
          <label>
            Email
            <input value={email} onChange={(e) => setEmail(e.target.value)} />
          </label>
          <label>
            Name
            <input value={name} onChange={(e) => setName(e.target.value)} />
          </label>
          <button type="submit" disabled={!emailOk || !nameOk}>
            Send invite
          </button>
        </form>
      );
    }

