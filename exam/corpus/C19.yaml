  code: |
    from __future__ import annotations

    from app.documents.model import DocumentKind
    from app.progress.model import Progress
    from app.storage.orders import Store
    from app.web.stand import picked_boxes


    STATES = {DocumentKind.PROXY: "ready", DocumentKind.SALE: "ready"}


    def remaining(drafts: list) -> set[DocumentKind]:
        return {kind for kind, state in STATES.items()
                if not any(draft.kind is kind and draft.state.value == state for draft in drafts)}


    def settle(progress: Progress, drafts: list) -> Progress:
        left = remaining(drafts)
        if not left:
            return progress.with_state("ready")
        return progress.with_state("waiting")


    def boxes_of(store: Store, query: str) -> list[str]:
        """Mailboxes of a run: the ones the page form ticked, checked against the accounts."""
        known = {user.name: user.mailbox for user in store.users() if user.mailbox}
        return [known[name] for name in picked_boxes(query) if name in known]


    def state_of(progress: Progress) -> str:
        return progress.state
