    from __future__ import annotations

    import os
    import sys
    from pathlib import Path

    from app.accounts import Role, User
    from app.storage.schema import connect


    def usage() -> str:
        return "accounts add <name> <role> | accounts disable <name> | accounts list"


    def main(argv: list[str]) -> int:
        store = connect(Path(os.environ["STATE"]))
        match argv:
            case ["add", name, role]:
                store.save_user(User(name=name, role=Role(role)))
            case ["disable", name]:
                store.save_user(store.user(name).disabled())
            case ["list"]:
                for user in store.users():
                    print(user.name, user.role.value)
            case _:
                print(usage(), file=sys.stderr)
                return 2
        return 0


    if __name__ == "__main__":
        sys.exit(main(sys.argv[1:]))
