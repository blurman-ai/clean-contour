    from __future__ import annotations

    from dataclasses import dataclass, field

    from app.cli.output import warn
    from app.documents.model import Document, Field
    from app.trips.model import Trip


    @dataclass
    class Draft:
        kind: str
        fields: list[Field] = field(default_factory=list)


    def empty(field: Field) -> bool:
        return not str(field.value).strip()


    def assemble(trip: Trip, kind: str) -> Draft:
        """Build the draft of the document from the trip, naming empty fields."""
        draft = Draft(kind=kind)
        for name, value in trip.requisites(kind).items():
            draft.fields.append(Field(name=name, value=value))
        for field in draft.fields:
            if empty(field):
                warn(f"{kind}: {field.name} is empty — the manager fills it in the ERP")
        return draft


    def counted(drafts: list[Draft]) -> dict[str, int]:
        found: dict[str, int] = {}
        for draft in drafts:
            found[draft.kind] = found.get(draft.kind, 0) + 1
        return found
