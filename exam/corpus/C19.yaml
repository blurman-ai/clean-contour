  code: |
    from __future__ import annotations

    import importlib

    from app.binding.model import Basis, Binding, Unbound
    from app.trips.model import Trip


    PLACES = {"Springfield": "buyer-a", "Riverton": "buyer-b"}


    def by_address(trip: Trip) -> Binding | Unbound:
        buyer = PLACES.get(trip.unloading_place)
        if buyer is None:
            return Unbound(reason="unknown address")
        return Binding(buyer=buyer, contract=None, basis=Basis.ADDRESS)


    def by_address_confirmed(trip: Trip, ask: bool = False) -> Binding | Unbound:
        """Resolve the buyer by the unloading address; an ambiguous place asks the operator."""
        found = by_address(trip)
        if ask and found.buyer in {"buyer-a", "buyer-b"}:
            module = importlib.import_module("app.cli.confirm")
            if not module.answer(f"bind {trip.number} to {found.buyer}?"):
                return Unbound(reason="the operator refused the binding")
        return found

    def places() -> dict[str, str]:
        return dict(PLACES)


    def known(place: str) -> bool:
        return place in PLACES
