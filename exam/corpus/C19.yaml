  why: The storage class imports the web framework to throw and return a transport response, so data access depends on the web layer and its error shape.
  source: Storage answers through the web framework, in Kotlin.
  code: |
    package app.storage

    import org.springframework.http.HttpStatus
    import org.springframework.http.ResponseEntity
    import org.springframework.jdbc.core.JdbcTemplate
    import org.springframework.web.server.ResponseStatusException

    data class Draft(val trip: String, val kind: String, val state: String)

    class Drafts(private val jdbcTemplate: JdbcTemplate) {

        fun of(trip: String): List<Draft> = jdbcTemplate.query(
            "SELECT kind, state FROM drafts WHERE trip = ?",
            { rs, _ -> Draft(trip = trip, kind = rs.getString("kind"), state = rs.getString("state")) },
            trip,
        )

        fun required(trip: String): List<Draft> {
            val found = of(trip)
            if (found.isEmpty()) {
                throw ResponseStatusException(HttpStatus.NOT_FOUND, "draft not found")
            }
            return found
        }

        fun answer(trip: String): ResponseEntity<Map<String, List<String>>> =
            ResponseEntity.ok(mapOf("drafts" to required(trip).map { it.kind }))
    }
