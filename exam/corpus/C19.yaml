    from __future__ import annotations

    import enum
    from dataclasses import dataclass, replace

    from app.lifecycle import Actor, Lifecycle, Transition
    from app.web.stand import SendOutcome


    class RunState(enum.Enum):
        PREPARING = "preparing"
        GOING = "going"
        NOT_PREPARED = "not prepared"
        FINISHED = "finished"


    LIFECYCLE = Lifecycle(
        initial=RunState.PREPARING,
        final=frozenset({RunState.FINISHED}),
        transitions=frozenset({
            Transition(RunState.PREPARING, RunState.GOING, Actor.SYSTEM),
            Transition(RunState.PREPARING, RunState.NOT_PREPARED, Actor.SYSTEM),
            Transition(RunState.GOING, RunState.FINISHED, Actor.ENGINEER),
        }),
    )


    @dataclass(frozen=True)
    class Run:
        scenario: str
        state: RunState
        why: str = ""


    def not_prepared(run: Run, outcome: SendOutcome | None) -> Run:
        """The letter never left: remember why the run stopped."""
        LIFECYCLE.check(run.state, RunState.NOT_PREPARED, Actor.SYSTEM, None)
        reason = outcome.value if outcome is not None else SendOutcome.REFUSED.value
        return replace(run, state=RunState.NOT_PREPARED, why=reason)
