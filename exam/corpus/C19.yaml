    package trips

    import (
    	"fmt"
    	"net/http"

    	"example.com/app/lifecycle"
    )

    type TripState string

    const (
    	TripNew     TripState = "new"
    	TripBound   TripState = "bound"
    	TripShipped TripState = "shipped"
    )

    var tripLifecycle = lifecycle.New(
    	TripNew,
    	[]lifecycle.Transition{
    		{From: TripNew, To: TripBound, Actor: lifecycle.System},
    		{From: TripBound, To: TripShipped, Actor: lifecycle.Manager},
    	},
    )

    type Trip struct {
    	Number string
    	State  TripState
    }

    // Bind the trip to a buyer by the table of transitions.
    func Bind(trip Trip, actor lifecycle.Actor) (Trip, error) {
    	if !tripLifecycle.Allows(trip.State, TripBound, actor) {
    		return trip, lifecycle.Refusal{
    			Status:  http.StatusConflict,
    			Message: fmt.Sprintf("trip %s cannot be bound from %s", trip.Number, trip.State),
    		}
    	}
    	trip.State = TripBound
    	return trip, nil
    }
