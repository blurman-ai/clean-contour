    from __future__ import annotations

    import enum
    from dataclasses import dataclass, replace

    from app.lifecycle import Actor, Lifecycle, Transition


    class TripState(enum.Enum):
        NEW = "new"
        BOUND = "bound"
        SHIPPED = "shipped"


    LIFECYCLE = Lifecycle(
        initial=TripState.NEW,
        final=frozenset({TripState.SHIPPED}),
        transitions=frozenset({
            Transition(TripState.NEW, TripState.BOUND, Actor.SYSTEM),
            Transition(TripState.BOUND, TripState.SHIPPED, Actor.MANAGER),
        }),
    )


    @dataclass(frozen=True)
    class Trip:
        number: str
        state: TripState = TripState.NEW

        def bind(self, actor: Actor) -> "Trip":
            LIFECYCLE.check(self.state, TripState.BOUND, actor, None)
            return replace(self, state=TripState.BOUND)

        def shipped(self, actor: Actor) -> "Trip":
            LIFECYCLE.check(self.state, TripState.SHIPPED, actor, None)
            return replace(self, state=TripState.SHIPPED)
