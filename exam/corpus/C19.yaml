  source: A pass imports the mail adapter.
  code: |
    from __future__ import annotations

    from collections.abc import Mapping

    from app.inbox.model import Report, Target
    from app.mail import mailbox
    from app.mail.model import Unavailable


    def boxes(store, access: mailbox.Access) -> tuple[dict[str, object], list[str]]:
        found, without = {}, []
        for user in store.active_users():
            account = access.account(user.mailbox) if user.mailbox else None
            if account is None:
                without.append(user.name)
            else:
                found[user.name] = account
        return found, without


    def read(target: Target, boxes: Mapping[str, object], now) -> Report:
        """One pass over the mailboxes; a mailbox that is down does not stop the others."""
        report = Report()
        for owner, account in boxes.items():
            try:
                for letter in mailbox.read(account, "INBOX"):
                    report.taken += target.take(letter, now)
            except Unavailable as refused:
                report.refused[owner] = refused.code
        return report
