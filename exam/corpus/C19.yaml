  code: |
    using Microsoft.Data.SqlClient;
    using App.Defaults;

    namespace App.Storage;

    public enum DraftKind { Proxy, Sale }

    public sealed record Draft(string Trip, DraftKind Kind, string State, int Round);

    public class Drafts
    {
        private readonly SqlConnection _db;

        public Drafts(SqlConnection db) => _db = db;

        public async Task<IReadOnlyList<Draft>> Of(string trip)
        {
            var found = new List<Draft>();
            await using var cmd = new SqlCommand(
                "SELECT kind, state, round FROM drafts WHERE trip = @trip ORDER BY kind", _db);
            cmd.Parameters.AddWithValue("@trip", trip);
            await using var reader = await cmd.ExecuteReaderAsync();
            while (await reader.ReadAsync())
                found.Add(new Draft(trip, Enum.Parse<DraftKind>(reader.GetString(0)),
                    reader.GetString(1), reader.GetInt32(2)));
            return found;
        }

        public async Task<int> Round()
        {
            await using var cmd = new SqlCommand("SELECT number FROM rounds", _db);
            var row = await cmd.ExecuteScalarAsync();
            return row is int number ? number : Defaults.FirstRound;
        }
    }
