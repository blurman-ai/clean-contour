    from __future__ import annotations

    import enum
    from dataclasses import dataclass, replace

    from fastapi import HTTPException

    from app.lifecycle import Actor, Lifecycle, Transition


    class TripState(enum.Enum):
        NEW = "new"
        BOUND = "bound"
        SHIPPED = "shipped"


    LIFECYCLE = Lifecycle(
        initial=TripState.NEW,
        final=frozenset({TripState.SHIPPED}),
        transitions=frozenset({
            Transition(TripState.NEW, TripState.BOUND, Actor.SYSTEM),
            Transition(TripState.BOUND, TripState.SHIPPED, Actor.MANAGER),
        }),
    )


    @dataclass(frozen=True)
    class Trip:
        number: str
        state: TripState


    def bind(trip: Trip, actor: Actor) -> Trip:
        """Bind the trip to a buyer by the table of transitions."""
        if not LIFECYCLE.allows(trip.state, TripState.BOUND, actor):
            raise HTTPException(409, f"trip {trip.number} cannot be bound from {trip.state.value}")
        return replace(trip, state=TripState.BOUND)
