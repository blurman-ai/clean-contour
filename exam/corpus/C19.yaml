    using Microsoft.AspNetCore.Http;

    namespace App.Trips;

    public enum TripState { New, Bound, Shipped }

    public sealed record Trip(string Number, TripState State);

    public static class TripLifecycle
    {
        private static readonly IReadOnlyDictionary<(TripState, TripState), string> Allowed =
            new Dictionary<(TripState, TripState), string>
            {
                [(TripState.New, TripState.Bound)] = "system",
                [(TripState.Bound, TripState.Shipped)] = "manager",
            };

        public static bool Allows(TripState from, TripState to) => Allowed.ContainsKey((from, to));

        /// <summary>Bind the trip to a buyer by the table of transitions.</summary>
        public static Trip Bind(Trip trip)
        {
            if (!Allows(trip.State, TripState.Bound))
            {
                throw new BadHttpRequestException(
                    $"trip {trip.Number} cannot be bound from {trip.State}", StatusCodes.Status409Conflict);
            }
            return trip with { State = TripState.Bound };
        }
    }
