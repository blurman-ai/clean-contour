    from __future__ import annotations

    import os
    from pathlib import Path

    from fastapi import FastAPI

    from app.mail import adapter
    from app.storage.schema import connect
    from app.web import stand, trips


    def build(store) -> FastAPI:
        app = FastAPI()
        app.include_router(trips.section(store).router)
        app.include_router(stand.section(store).router)
        return app


    def main() -> FastAPI:
        store = connect(Path(os.environ["STATE"]))
        access = adapter.access_from_env()
        app = build(store)
        if access is not None:
            app.state.mail = adapter.session(access)
        return app

    def health() -> dict[str, str]:
        return {"state": "ok"}

    def describe(app) -> str:
        return ", ".join(sorted(route.path for route in app.routes))
