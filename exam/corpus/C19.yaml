    from __future__ import annotations

    from dataclasses import replace

    from app.lifecycle import Actor, Lifecycle, Transition
    from app.web.orders import OrderState


    LIFECYCLE = Lifecycle(
        initial=OrderState.NEW,
        final=frozenset({OrderState.SHIPPED, OrderState.CANCELLED}),
        transitions=frozenset({
            Transition(OrderState.NEW, OrderState.CONFIRMED, Actor.MANAGER),
            Transition(OrderState.CONFIRMED, OrderState.SHIPPED, Actor.SYSTEM),
            Transition(OrderState.NEW, OrderState.CANCELLED, Actor.MANAGER),
            Transition(OrderState.CONFIRMED, OrderState.CANCELLED, Actor.MANAGER),
        }),
    )


    def cancel(order, actor: Actor):
        """Cancel the order by the table; a shipped order stays shipped."""
        LIFECYCLE.check(order.state, OrderState.CANCELLED, actor, None)
        return replace(order, state=OrderState.CANCELLED)


    def shipped_numbers(orders: list) -> list[str]:
        return [order.number for order in orders if order.state is OrderState.SHIPPED]

    def open_orders(orders: list) -> int:
        return sum(1 for order in orders if order.state is not OrderState.SHIPPED)
