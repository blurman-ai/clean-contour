    import { Response } from "express";
    import { db } from "./db";
    import { Draft } from "./model";

    export class NotFound extends Error {
      readonly status = 404;
    }

    export async function draftsOf(trip: string): Promise<Draft[]> {
      const rows = await db.query("SELECT kind, state FROM drafts WHERE trip = $1", [trip]);
      return rows.map((row) => ({ trip, kind: row.kind, state: row.state }));
    }

    // Answer 404 right from the storage when the trip has no drafts.
    export async function required(trip: string, res: Response): Promise<Draft[]> {
      const found = await draftsOf(trip);
      if (found.length === 0) {
        res.status(404).json({ error: "draft not found" });
        throw new NotFound("draft not found");
      }
      return found;
    }

    export async function answer(trip: string, res: Response): Promise<void> {
      const found = await required(trip, res);
      res.json({ drafts: found.map((draft) => draft.kind) });
    }
