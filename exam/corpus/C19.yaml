    from __future__ import annotations

    from dataclasses import dataclass

    from app.places import find
    from app.web.site import form_of
    from app.trips.model import Trip


    @dataclass(frozen=True)
    class Letter:
        to: str
        subject: str
        text: str


    TEMPLATE = {"subject": "Loading {number}", "text": "Loading address: {place}"}


    def plant_of(trip: Trip, plants: list[dict]) -> dict:
        found = find(plants, trip.contract.loading_place)
        if found is None:
            raise ValueError(f"unknown loading place {trip.contract.loading_place}")
        return found


    def letter(trip: Trip, plants: list[dict]) -> Letter:
        """Letter to the plant of the loading address."""
        plant = plant_of(trip, plants)
        values = form_of({"number": trip.number, "place": plant["address"]})
        return Letter(to=plant["mail"], subject=TEMPLATE["subject"].format(**values),
                      text=TEMPLATE["text"].format(**values))
