    from __future__ import annotations

    import hashlib
    import hmac

    import click

    from app.accounts.model import Refused, Role, User, UserState


    ATTEMPTS = 5
    WINDOW_MINUTES = 15


    def hash_password(password: str, salt: bytes) -> str:
        return hashlib.scrypt(password.encode(), salt=salt, n=2 ** 14, r=8, p=1).hex()


    def verify(user: User, password: str, salt: bytes) -> bool:
        return hmac.compare_digest(user.password_hash, hash_password(password, salt))


    def login(user: User, password: str, salt: bytes, failures: int) -> User:
        """Let the user in unless the account is disabled or the attempts ran out."""
        if user.state is not UserState.ACTIVE:
            raise Refused("the account is disabled")
        if failures >= ATTEMPTS:
            raise Refused("too many attempts")
        if not verify(user, password, salt):
            click.echo(f"{user.name}: wrong password", err=True)
            raise Refused("wrong password")
        return user.with_role(Role.MANAGER)
