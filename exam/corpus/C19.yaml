    package app.trips

    import app.lifecycle.Actor
    import app.lifecycle.Lifecycle
    import app.lifecycle.Transition

    enum class TripState(val wire: String) {
        NEW("new"),
        BOUND("bound"),
        SHIPPED("shipped"),
    }

    val LIFECYCLE = Lifecycle(
        initial = TripState.NEW,
        final = setOf(TripState.SHIPPED),
        transitions = setOf(
            Transition(TripState.NEW, TripState.BOUND, Actor.SYSTEM),
            Transition(TripState.BOUND, TripState.SHIPPED, Actor.MANAGER),
        ),
    )

    data class Trip(
        val number: String,
        val state: TripState = TripState.NEW,
    ) {
        fun bind(actor: Actor): Trip {
            LIFECYCLE.check(state, TripState.BOUND, actor, null)
            return copy(state = TripState.BOUND)
        }

        fun shipped(actor: Actor): Trip {
            LIFECYCLE.check(state, TripState.SHIPPED, actor, null)
            return copy(state = TripState.SHIPPED)
        }
    }
