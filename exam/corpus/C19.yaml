    from __future__ import annotations

    import sqlite3

    from fastapi import HTTPException
    from fastapi.responses import JSONResponse

    from app.storage.model import Draft


    NOT_FOUND = "draft not found"


    class Drafts:
        def __init__(self, db: sqlite3.Connection) -> None:
            self.db = db

        def of(self, trip: str) -> list[Draft]:
            rows = self.db.execute("SELECT kind, state FROM drafts WHERE trip = ?",
                                   (trip,)).fetchall()
            return [Draft(trip=trip, kind=kind, state=state) for kind, state in rows]

        def required(self, trip: str) -> list[Draft]:
            found = self.of(trip)
            if not found:
                raise HTTPException(404, NOT_FOUND)
            return found

        def answer(self, trip: str) -> JSONResponse:
            return JSONResponse({"drafts": [draft.kind for draft in self.required(trip)]})
