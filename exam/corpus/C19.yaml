  code: |
    from __future__ import annotations

    import sqlite3

    from app.defaults import FIRST_ROUND
    from app.storage.model import Draft, Kind


    class Drafts:
        def __init__(self, db: sqlite3.Connection) -> None:
            self.db = db

        def of(self, trip: str) -> list[Draft]:
            rows = self.db.execute(
                "SELECT kind, state, round FROM drafts WHERE trip = ? ORDER BY kind",
                (trip,)).fetchall()
            return [Draft(trip=trip, kind=Kind(kind), state=state, round=number)
                    for kind, state, number in rows]

        def save(self, draft: Draft) -> None:
            self.db.execute(
                "INSERT INTO drafts (trip, kind, state, round) VALUES (?, ?, ?, ?) "
                "ON CONFLICT (trip, kind) DO UPDATE SET state = excluded.state",
                (draft.trip, draft.kind.value, draft.state, draft.round))

        def round(self) -> int:
            row = self.db.execute("SELECT number FROM rounds").fetchone()
            return int(row[0]) if row else FIRST_ROUND

    def numbers(drafts: list[Draft]) -> list[str]:
        return [draft.trip for draft in drafts]
