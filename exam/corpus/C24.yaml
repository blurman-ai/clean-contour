- id: C24-19
  card: C24
  expected: clean
  path: internal/notify/fanout.go
  why: Near miss of the naked fanout goroutines — each collects its own outcome on a buffered channel and the caller counts real sends and failures.
  source: The same notifier, the counted variant.
  code: |
    package notify

    type outcome struct {
        token string
        err   error
    }

    func Fanout(msg Message, tokens []string) (int, int) {
        results := make(chan outcome, len(tokens))
        for _, tk := range tokens {
            go func(token string) {
                results <- outcome{token: token, err: pushProvider.Send(token, msg)}
            }(tk)
        }
        sent, failed := 0, 0
        for range tokens {
            r := <-results
            if r.err != nil {
                failed++
                recordFailure(r.token, r.err)
            } else {
                sent++
            }
        }
        return sent, failed
    }

- id: C24-20
  card: C24
  expected: clean
  path: Services/Media/Transcoder.cs
  why: Near miss of the ignored task — the kick stores the task and a continuation writes the failure to the job row before removing it.
  source: The same transcoder, the tracked variant.
  code: |
    using System.Threading.Tasks;

    namespace Services.Media;

    public sealed class Transcoder
    {
        private readonly Encoder _encoder = new Encoder();
        private readonly JobStore _store;
        private readonly System.Collections.Generic.List<Task> _running = new();

        public Transcoder(JobStore store) => _store = store;

        public void Kick(Job job)
        {
            var t = Task.Run(() => _encoder.Encode(job.SourcePath, job.TargetPath));
            _running.Add(t);
            t.ContinueWith(done => {
                _running.Remove(done);
                if (done.IsFaulted)
                {
                    _store.MarkFailed(job.Id, done.Exception?.GetBaseException().Message ?? "encode failed");
                }
            });
            _store.MarkStarted(job.Id);
        }
    }
