    type Delivery = { orderId: string; url: string };

    const pending = new Map<string, number>();

    export function deliver(d: Delivery): void {
      void postDelivery(d);
    }

    async function postDelivery(d: Delivery): Promise<void> {
      const resp = await fetch(d.url, {
        method: "POST",
        body: JSON.stringify({ orderId: d.orderId }),
      });
      pending.set(d.orderId, resp.status);
      if (resp.status >= 400) {
        await recordFailure(d.orderId, resp.status);
      }
    }

    export function markNotified(orderId: string): void {
      pending.delete(orderId);
    }

