- id: C24-01
  card: C24
  expected: dirty
  path: app/billing/hooks.py
  why: The receipt task is created and dropped — no reference is kept and no done-callback records a failure, so a dead send leaves no trace.
  source: A billing service sending receipts after payment.
  code: |
    import asyncio

    from app.mail import receipt_mailer


    async def send_receipt(payment) -> None:
        await receipt_mailer.send(
            to=payment.customer_email,
            template="receipt",
            amount=payment.amount,
        )


    def on_payment_paid(payment) -> None:
        asyncio.create_task(send_receipt(payment))


    def close_day(payments) -> int:
        sent = 0
        for p in payments:
            if p.paid_at is not None:
                on_payment_paid(p)
                sent += 1
        return sent

