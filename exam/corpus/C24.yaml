  code: |
    type Shard = { name: string; docs: number };

    export function reindexShard(shard: Shard): Promise<number> {
      return postIndex(shard.name);
    }

    export function onDeploy(shards: Shard[]): void {
      for (const shard of shards) {
        reindexShard(shard).then((docs) => {
          console.log(`${shard.name}: ${docs} docs`);
        });
      }
    }

    export function deployDone(shards: Shard[]): boolean {
      return shards.every((s) => s.docs > 0);
    }

