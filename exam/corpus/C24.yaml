- id: C24-14
  card: C24
  expected: clean
  path: internal/scout/refresh.go
  why: Near miss of the naked goroutine — the job body recovers panics and sends errors on a channel the caller reads, so the failure reaches the fragment.
  source: The same scout, the guarded variant.
  code: |
    package scout

    import "log"

    type Scout struct {
        errs chan error
    }

    func NewScout() *Scout {
        return &Scout{errs: make(chan error, 16)}
    }

    func (s *Scout) RefreshAll(pair string) error {
        go func() {
            defer func() {
                if r := recover(); r != nil {
                    s.errs <- fmt.Errorf("scout panic: %v", r)
                }
            }()
            quotes, err := fetchQuotes(pair)
            if err != nil {
                s.errs <- err
                return
            }
            for _, q := range quotes {
                if err = saveQuote(q); err != nil {
                    s.errs <- err
                    return
                }
            }
        }()
        select {
        case err := <-s.errs:
            log.Printf("scout: %v", err)
            return err
        default:
            return nil
        }
    }

- id: C24-15
  card: C24
  expected: clean
  path: Services/Exports/ExportRunner.cs
  why: Near miss of the discarded task — the runner awaits it inside a tracked list with a continuation that writes the failure to the job.
  source: The same export runner, the tracked variant.
  code: |
    using System.Collections.Concurrent;
    using System.Threading.Tasks;

    namespace Services.Exports;

    public sealed class ExportRunner
    {
        private readonly Exporter _exporter = new Exporter();
        private readonly ConcurrentDictionary<Guid, Task> _running = new();

        public void Run(ExportJob job)
        {
            var t = RunAsync(job);
            _running[job.Id] = t;
            t.ContinueWith(done => {
                _running.TryRemove(job.Id, out _);
                if (done.IsFaulted)
                {
                    _exporter.MarkFailedAsync(job.Id, done.Exception?.GetBaseException().Message);
                }
            });
        }

        private async Task RunAsync(ExportJob job)
        {
            var path = await _exporter.RenderAsync(job);
            await _exporter.UploadAsync(job, path);
            await _exporter.MarkReadyAsync(job.Id);
        }
    }

- id: C24-16
  card: C24
  expected: clean
  path: app/src/main/kotlin/media/Preview.kt
  why: Near miss of GlobalScope — the launch carries a CoroutineExceptionHandler that stores the failure, so the item leaves its waiting state.
  source: The same preview maker, the guarded variant.
  code: |
    package media

    import kotlinx.coroutines.CoroutineExceptionHandler
    import kotlinx.coroutines.GlobalScope
    import kotlinx.coroutines.launch

    class PreviewMaker(private val store: PreviewStore) {

        private val handler = CoroutineExceptionHandler { _, e ->
            store.markFailed(store.currentItemId(), e.message ?: "preview failed")
        }

        fun makePreview(itemId: String) {
            GlobalScope.launch(handler) {
                store.setCurrentItem(itemId)
                val bitmap = decodeThumb(store.sourcePath(itemId))
                store.save(itemId, bitmap)
                store.markReady(itemId)
            }
        }
    }

- id: C24-17
  card: C24
  expected: clean
  path: app/cdn/purge.py
  why: Near miss of the dropped purge tasks — gather awaits every task with return_exceptions and the failures are recorded per path.
  source: The same publisher, the awaited variant.
  code: |
    import asyncio

    import httpx

    PURGE_URL = "https://purger.example.invalid/v2"


    async def purge(client: httpx.AsyncClient, path: str) -> str:
        r = await client.post(PURGE_URL, json={"path": path})
        r.raise_for_status()
        return path


    async def publish_assets(paths: list[str]) -> int:
        failures = []
        async with httpx.AsyncClient() as client:
            results = await asyncio.gather(
                *(purge(client, path) for path in paths),
                return_exceptions=True,
            )
        for path, res in zip(paths, results):
            if isinstance(res, Exception):
                failures.append((path, res))
        record_purge_failures(failures)
        mark_published([p for p, res in zip(paths, results) if not isinstance(res, Exception)])
        return len(paths) - len(failures)

