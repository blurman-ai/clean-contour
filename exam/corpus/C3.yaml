  code: |
    from sqlalchemy.orm import Session

    from app.requests.models import CarrierBooking, TransportRequest
    from app.requests.state import RequestState, transition_request_state


    def on_carrier_rejected(session: Session, booking_id: int, reason: str) -> None:
        with session.begin():
            booking = session.get(CarrierBooking, booking_id)
            if booking is None:
                raise LookupError("booking_not_found")
            request = session.get(TransportRequest, booking.request_id)
            # the reason for the refusal stays in the booking
            booking.rejection_reason = reason
            if request.state == RequestState.BOOKED:
                transition_request_state(
                    session,
                    request,
                    RequestState.REBOOKING,
                    reason=booking.rejection_reason,
                )
