    from app.stocktakes.models import CountRun, Stocktake


    def stocktake_state(stocktake: Stocktake, runs: list[CountRun]) -> str:
        """Inventory state by counting passes."""
        if any(run.status == "failed" for run in runs):
            return "failed"
        if runs and all(run.status == "done" for run in runs):
            return "completed"
        if any(run.status == "running" for run in runs):
            return "counting"
        return "planned"


    def stocktake_row(stocktake: Stocktake, runs: list[CountRun]) -> dict:
        return {
