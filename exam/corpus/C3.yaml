  code: |
    import httpx

    from app.couriers.models import Courier

    TRACKING_URL = "https://tracking.example.test/v1/couriers"


    async def courier_live_state(courier: Courier, client: httpx.AsyncClient) -> str:
        """State for the dispatcher panel."""
        response = await client.get(f"{TRACKING_URL}/{courier.tracker_id}")
        if response.status_code == 404:
            return "unknown"
        payload = response.json()
        if payload["status"] == "unreachable":
            return "offline"
        if payload["status"] == "moving":
            return "on_route"
        return "idle"


    async def dispatcher_row(courier: Courier, client: httpx.AsyncClient) -> dict:
        return {
            "courier_id": courier.id,
            "full_name": courier.full_name,
            "depot_id": courier.depot_id,
            "state": await courier_live_state(courier, client),
            "shift_status": courier.shift_status,
        }
