    import type { Delivery, Order } from "./types";

    export type OrderPhase = "waiting" | "on_the_way" | "problem" | "delivered";

    export function orderPhase(order: Order, delivery: Delivery | undefined): OrderPhase {
      if (!delivery) return "waiting";
      if (delivery.status === "failed" || delivery.status === "returned") return "problem";
      if (delivery.status === "delivered") return "delivered";
      return "on_the_way";
    }

    export function orderListItem(order: Order, delivery: Delivery | undefined) {
      // row of the orders list in the recipient's account
      return {
        id: order.id,
        recipient: order.recipientName,
        status: order.status,
        phase: orderPhase(order, delivery),
        courier: delivery?.courierName ?? "",
      };
    }
