  code: |
    from sqlalchemy import select
    from sqlalchemy.orm import Session

    from app.requests.models import CarrierBooking, TransportRequest

    REQUEST_STATE_BY_BOOKING = {
        "pending": "booking",
        "confirmed": "booked",
        "rejected": "rebooking",
        "expired": "rebooking",
    }


    def request_state(session: Session, request: TransportRequest) -> str:
        """Request state for the logistician's table."""
        booking_status = session.scalar(
            select(CarrierBooking.status)
            .where(CarrierBooking.request_id == request.id)
            .order_by(CarrierBooking.created_at.desc())
            .limit(1)
        )
        if booking_status is None:
            return "new"
        return REQUEST_STATE_BY_BOOKING[booking_status]


    def request_row(session: Session, request: TransportRequest) -> dict:
        # row of the transport requests table
        return {
            "id": request.id,
            "route": f"{request.origin} - {request.destination}",
            "state": request_state(session, request),
            "own_state": request.state,
        }
