    from app.jobs.models import DeliveryJob


    async def queue_depth(db: AsyncSession) -> int:
        return await db.scalar(
            select(func.count(DeliveryJob.id)).where(DeliveryJob.status == "queued")
        )


    async def running_count(db: AsyncSession) -> int:
        return await db.scalar(
            select(func.count(DeliveryJob.id)).where(DeliveryJob.status == "running")
        )


    async def queue_snapshot(db: AsyncSession, max_running: int) -> dict:
        queued = await queue_depth(db)
        running = await running_count(db)
        return {
            "queued": queued,
            "running": running,
            "free_slots": max(max_running - running, 0),
        }
