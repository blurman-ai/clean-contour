  why: The function returns the workspace lock from a list of jobs, not the state of one entity; the status of each job is stored on the server.
  source: frontend helper function that folds the list of queue jobs into a lock flag
  code: |
    import type { QueueJob } from "../model/types";

    const ACTIVE_DISPATCH_STATUSES: ReadonlySet<string> = new Set([
      "queued",
      "running",
      "uploading",
    ]);

    /**
     * While the queue has an active job, a new shipment cannot be created.
     */
    export function isDepotLocked(jobs: QueueJob[]): boolean {
      return jobs.some(job => ACTIVE_DISPATCH_STATUSES.has(job.status));
    }

    export function lockHint(jobs: QueueJob[]): string | null {
      if (!isDepotLocked(jobs)) {
        return null;
      }
      const active = jobs.filter(job => ACTIVE_DISPATCH_STATUSES.has(job.status)).length;
      return `Jobs are being processed (${active}), a new shipment is unavailable`;
    }
