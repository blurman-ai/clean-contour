    from sqlalchemy.orm import Session

    from app.orders.models import Order
    from app.orders.state import OrderPaymentState, set_order_payment_state
    from app.payments.schemas import PaymentEvent


    def apply_payment_event(session: Session, event: PaymentEvent) -> None:
        with session.begin():
            order = session.get(Order, event.order_id, with_for_update=True)
            if order is None:
                return
            if event.status == "captured":
                order.paid_at = event.occurred_at
                order.paid_amount = event.amount
                set_order_payment_state(order, OrderPaymentState.PAID)
            elif event.status == "refunded":
                order.refunded_at = event.occurred_at
                set_order_payment_state(order, OrderPaymentState.REFUNDED)
            elif event.status in ("declined", "expired"):
                order.payment_error = event.reason
                set_order_payment_state(order, OrderPaymentState.FAILED)
