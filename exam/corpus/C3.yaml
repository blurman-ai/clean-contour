    from app.drafts.models import Draft, PlanningJob
    from app.drafts.state import DraftStatus, set_order_status


    def on_job_finished(session: Session, job_id: int) -> None:
        with session.begin():
            job = session.get(PlanningJob, job_id)
            draft = session.get(Draft, job.draft_id, with_for_update=True)
            if job.status == "failed":
                draft.failure_code = job.failure_code
                draft.failed_at = job.finished_at
                set_order_status(draft, DraftStatus.FAILED)
            elif job.status == "succeeded":
                draft.layout_json = job.result_json
                draft.ready_at = job.finished_at
                set_order_status(draft, DraftStatus.READY)
- id: C3-03
  card: C3
  expected: dirty
  path: src/drafts/lib/reconcileQueueJobs.ts
  why: The status of a queue record is set from the fields of the draft and revision responses, that is, from the state of neighboring entities.
  source: frontend function that recomputes the queue record status from server responses about other entities
  code: |
    import type { QueueJob, QueueServerState } from "../model/types";

    export function reconcileQueueJobs(
      jobs: QueueJob[],
      states: Map<string, QueueServerState>,
    ): QueueJob[] {
      return jobs.map(job => {
        const state = states.get(job.draftId);
        if (!state) return job;

        if (state.draft?.phase === "published" && state.draft.publishedId) {
          return { ...job, status: "completed", error: undefined };
        }
        if (state.revision?.status === "failed" || state.revision?.status === "timeout") {
          return { ...job, status: "failed", error: state.revision.errorText };
        }
        if (state.status?.readyToPublish) {
          return { ...job, status: "ready_to_publish", error: undefined };
        }
        if (state.revision?.status === "generating") {
          return { ...job, status: "generating", progress: state.status?.percent ?? 0 };
        }
        return job;
      });
    }
- id: C3-04
  card: C3
  expected: dirty
  path: app/runs/progress.py
  why: The run phase is computed on every read from the states of its nodes, that is, from a field of another table.
  source: computing the run phase from the states of related nodes in the transport layer
  code: |
    from app.runs.models import NodeState, Run, RunNode


    def run_phase(run: Run, nodes: list[RunNode]) -> str:
        done = sum(1 for node in nodes if node.state == NodeState.SUCCEEDED.value)
        running = [node for node in nodes if node.state == NodeState.RUNNING.value]
        phase = "running" if running else "queued"
        if done == len(nodes):
            phase = "completed"
        elif not running and any(node.state == NodeState.FAILED.value for node in nodes):
            phase = "failed"
        elif not running and any(node.state == NodeState.CANCELLED.value for node in nodes):
            phase = "cancelled"
        return phase


    def run_progress(run: Run, nodes: list[RunNode]) -> dict:
        return {
            "run_id": run.id,
            "phase": run_phase(run, nodes),
            "nodes_total": len(nodes),
            "nodes_done": sum(1 for n in nodes if n.state == NodeState.SUCCEEDED.value),
            "started_at": run.started_at,
        }
