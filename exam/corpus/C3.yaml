  code: |
    from sqlalchemy.orm import Session

    from app.dispatch.models import Route, Vehicle


    class VehicleNotAvailable(Exception):
        pass


    def assign_vehicle(session: Session, route: Route, vehicle: Vehicle) -> Route:
        """Assigns a vehicle to a route if it is free and fits the load capacity."""
        if vehicle.status != "available":
            raise VehicleNotAvailable(vehicle.id)
        if vehicle.capacity_kg < route.total_weight_kg:
            raise VehicleNotAvailable(vehicle.id)
        route.vehicle_id = vehicle.id
        route.plate_snapshot = vehicle.plate
        session.add(route)
        session.commit()
        return route
