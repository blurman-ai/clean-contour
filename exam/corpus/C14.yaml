  source: history read handler with several select queries and a set of identifiers in memory
  code: |
    @router.get("/{route_hash}/history", response_model=AttemptHistoryResponse)
    async def get_attempt_history(
        route_hash: str,
        request: Request,
        db: AsyncSession = Depends(get_session),
    ) -> AttemptHistoryResponse | JSONResponse:
        """Return the courier's pass history separately for training and for the check."""
        assignment_result = await access._get_assignment_by_token(db, route_hash, request)
        if isinstance(assignment_result, JSONResponse):
            return assignment_result
        route, assignment = assignment_result

        states = list(
            (
                await db.scalars(
                    select(RouteState)
                    .where(RouteState.assignment_id == assignment.id)
                    .order_by(RouteState.created_at, RouteState.id)
                    .limit(_MAX_HISTORY_ROWS + 1)
                )
            ).all()
        )
        if len(states) > _MAX_HISTORY_ROWS:
            return responses.error(
                status.HTTP_413_REQUEST_ENTITY_TOO_LARGE, "History is too large to return"
            )

        revision_ids = {state.route_revision_id for state in states if state.route_revision_id}
        if assignment.route_revision_id is not None:
            revision_ids.add(assignment.route_revision_id)
        revisions: dict[uuid.UUID, RouteRevision] = {}
        if revision_ids:
            rows = (
                await db.scalars(select(RouteRevision).where(RouteRevision.id.in_(revision_ids)))
            ).all()
            revisions = {row.id: row for row in rows}

        return build_history_response(states=states, revisions=revisions)
