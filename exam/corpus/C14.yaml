- id: C14-22
  card: C14
  expected: clean
  path: app/api/couriers/earnings.py
  why: The GET handler has add, insert and update, but they work with a set, a list and a dictionary in memory, and only select queries go to the database; the cache lives in Redis.
  source: courier earnings read handler with grouping in memory and a cache in Redis, by form
  code: |
    @router.get("/couriers/{courier_id}/earnings", response_model=EarningsResponse)
    async def get_courier_earnings(
        courier_id: uuid.UUID,
        month: str = Query(..., pattern=r"^\d{4}-\d{2}$"),
        current_user: CallerContext = Depends(get_caller_context),
        db: AsyncSession = Depends(get_session),
        cache: Redis = Depends(get_cache),
    ) -> EarningsResponse:
        courier = await _get_visible_courier(db, courier_id, current_user)
        cache_key = f"earnings:{courier.id}:{month}"
        cached = await cache.get(cache_key)
        if cached:
            return EarningsResponse.model_validate_json(cached)

        rows = (
            await db.execute(
                select(Delivery.order_id, Delivery.delivered_day, Delivery.payout_cents)
                .where(Delivery.courier_id == courier.id, Delivery.month == month)
                .order_by(Delivery.delivered_day)
            )
        ).all()

        seen_orders: set[uuid.UUID] = set()
        totals: dict[str, int] = {}
        lines: list[EarningsLine] = []
        for order_id, day, payout in rows:
            if order_id in seen_orders:
                continue
            seen_orders.add(order_id)
            totals.update({day: totals.get(day, 0) + payout})
            lines.append(EarningsLine(order_id=str(order_id), day=day, payout_cents=payout))
        lines.insert(0, EarningsLine.header(month))

        payload = EarningsResponse(month=month, total_cents=sum(totals.values()), lines=lines)
        await cache.set(cache_key, payload.model_dump_json(), ex=300)
        return payload
