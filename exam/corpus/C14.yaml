    @router.get("/shipment/{shipment_id}/status", response_model=ShipmentStatusDetail)
    async def get_shipment_status(
        shipment_id: str,
        current_user: CallerContext = Depends(get_caller_context),
        db: AsyncSession = Depends(get_session),
    ) -> ShipmentStatusDetail:
        parsed_id = _parse_uuid(shipment_id, "shipment id")
        shipment = await access._get_owned_shipment(db, parsed_id, current_user)
        if shipment is None:
            raise HTTPException(
                status_code=status.HTTP_404_NOT_FOUND,
                detail={"error": ShipmentErrorCode.NOT_FOUND.value},
            )

        is_fixed_route, fixed_route = await planner_state._fixed_route_overlay(db, shipment)

        current_batch = None
        if shipment.current_batch_id:
            current_batch = await _get_revision(db, shipment.id, shipment.current_batch_id)
        elif not is_fixed_route and route_refresh._should_refresh_route_for_list(
            shipment, None
        ):
            await route_refresh._refresh_route_from_planner(
                db, shipment, None, current_user.user_id, persist_stage=False
            )
            await db.commit()
            await db.refresh(shipment)

        revisions = await _get_revisions(db, shipment.id)
        delivered = await _get_delivery_for_shipment(db, shipment.id, current_user.user_id)
        flow_state = shipment_flow_state(
            shipment,
            revisions,
            delivery_id=str(delivered.id) if delivered is not None else None,
        )
        return ShipmentStatusDetail(
            shipment_id=str(shipment.id),
            status=flow_state.status,
            phase=flow_state.phase,
            error=_status_error(shipment, current_batch),
        )
