    @router.post("/{route_id}/practice/reset", response_model=PracticeResetResponse)
    async def reset_practice_session(
        route_id: str,
        idempotency_key: str | None = Header(default=None, alias="Idempotency-Key"),
        current_user: CallerContext = Depends(get_caller_context),
        db: AsyncSession = Depends(get_session),
    ) -> PracticeResetResponse:
        parsed_route_id = _parse_uuid(route_id, "route id")
