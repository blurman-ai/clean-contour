  why: The GET handler for the list of free slots updates overdue bookings through update and does a commit, that is, a read writes to the database (question 3).
  source: warehouse free slot read handler that releases overdue bookings before returning, by form
  code: |
    @router.get("/warehouses/{warehouse_id}/slots", response_model=list[DockSlotOut])
    async def list_free_slots(
        warehouse_id: uuid.UUID,
        day: date = Query(...),
        current_user: CallerContext = Depends(get_caller_context),
        db: AsyncSession = Depends(get_session),
    ) -> list[DockSlotOut]:
        warehouse = await _get_visible_warehouse(db, warehouse_id, current_user)
        now = datetime.now(timezone.utc)

        # We release overdue bookings before returning so that slots do not vanish from the list.
        await db.execute(
            update(SlotHold)
            .where(
                SlotHold.warehouse_id == warehouse.id,
                SlotHold.expires_at < now,
                SlotHold.released_at.is_(None),
            )
            .values(released_at=now)
        )
        await db.commit()

        slots = (
            await db.scalars(
                select(DockSlot)
                .where(DockSlot.warehouse_id == warehouse.id, DockSlot.day == day)
                .order_by(DockSlot.starts_at)
            )
        ).all()
        held_ids = set(
            (
                await db.scalars(
                    select(SlotHold.slot_id).where(
                        SlotHold.warehouse_id == warehouse.id,
                        SlotHold.released_at.is_(None),
                    )
                )
            ).all()
        )
        return [DockSlotOut.from_model(slot) for slot in slots if slot.id not in held_ids]
