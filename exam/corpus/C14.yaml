    @router.get("/shipments/{shipment_id}/label", response_model=ShipmentLabelResponse)
    async def get_shipment_label(
        shipment_id: uuid.UUID,
        current_user: CallerContext = Depends(get_caller_context),
        db: AsyncSession = Depends(get_session),
    ) -> ShipmentLabelResponse:
        shipment = await db.get(Shipment, shipment_id)
        if shipment is None or shipment.owner_id != current_user.user_id:
            raise HTTPException(
                status_code=status.HTTP_404_NOT_FOUND,
                detail={"error": ShipmentErrorCode.NOT_FOUND.value},
            )

        # We build the label on the first request and later return the ready link.
        if shipment.label_url is None:
            rendered = await label_renderer.render(shipment)
            shipment.label_url = await storage.put_label(shipment.id, rendered)
            shipment.label_rendered_at = datetime.now(timezone.utc)
            await db.commit()
            await db.refresh(shipment)

        return ShipmentLabelResponse(
            shipment_id=str(shipment.id),
            url=shipment.label_url,
            rendered_at=shipment.label_rendered_at,
        )
