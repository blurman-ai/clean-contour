    @router.get("/orders/{order_id}/eta", response_model=OrderEtaResponse)
    async def get_order_eta(
        order_id: uuid.UUID,
        current_user: CallerContext = Depends(get_caller_context),
        db: AsyncSession = Depends(get_session),
    ) -> OrderEtaResponse:
        order = await _get_owned_order(db, order_id, current_user)
        if order is None:
            raise HTTPException(
                status_code=status.HTTP_404_NOT_FOUND,
                detail={"error": OrderErrorCode.NOT_FOUND.value},
            )

        # We recompute the expected time on every request from the courier's current position.
        eta = await eta_service.estimate(order)
        delayed = order.promised_at is not None and eta.expected_at > order.promised_at
        if delayed and not order.is_delayed:
            order.is_delayed = True
            order.delay_detected_at = datetime.now(timezone.utc)
            await db.commit()

        return OrderEtaResponse(
            order_id=str(order.id),
            expected_at=eta.expected_at,
            promised_at=order.promised_at,
            delayed=delayed,
        )
