  code: |
    @router.get("/me", response_model=list[AccountOptionOut])
    async def list_my_options(
        current_user: CallerContext = Depends(get_caller_context),
        db: AsyncSession = Depends(get_session),
    ) -> list[AccountOptionOut]:
        rows = (
            await db.execute(
                select(AccountOption, OptionSku)
                .join(OptionSku, OptionSku.id == AccountOption.option_sku_id)
                .where(
                    AccountOption.user_id == current_user.user_id,
                    OptionSku.target != OptionTarget.SMS,
                )
            )
        ).all()
        now = datetime.now(timezone.utc)
        # One condition decides whether the add-on is in force: the same clock on its
        # expires_at that the limit count reads. Before, the list returned all
        # saved rows with the status active, and an add-on with an expired term
        # was shown as in force although the limits no longer counted it.
        return [
            AccountOptionOut(
                id=opt.id,
                option_sku_id=sku.id,
                code=sku.code,
                target=sku.target,
                quantity=opt.quantity,
                status=opt.status,
                expires_at=opt.expires_at,
            )
            for opt, sku in rows
            if option_is_active(opt, now)
        ]
