- id: C14-03
  card: C14
  expected: clean
  path: app/api/couriers/continue_prompt.py
  why: GET writes the hint display to the event log, and by the card a display log is not counted as a database write from a read handler.
  source: read handler that appends a display record to a declared event log with an idempotency key
  code: |
    @router.get("/{route_hash}/continue", response_model=ContinueResponse)
    async def get_resume_position(
        route_hash: str,
        request: Request,
        db: AsyncSession = Depends(get_session),
    ):
        assignment_result = await access._get_assignment_by_token(db, route_hash, request)
        if isinstance(assignment_result, JSONResponse):
            return assignment_result
        route, assignment = assignment_result

        (courier, _shift) = await access._get_courier_shift_for_assignment(
            db, route_id=route.id, courier_id=assignment.courier_id
        )
        target, label = continue_target(route_hash, assignment)

        # The hint display is written to the event log (rows are only appended).
        # The idempotency key protects against a repeat on page refresh.
        event_key = (
            f"evt:resume_hint_shown:{assignment.id}:"
            f"{assignment.last_activity_at.isoformat() if assignment.last_activity_at else 'start'}"
        )
        try:
            await record_view_event(
                db,
                route=route,
                assignment=assignment,
                courier=courier,
                event_type="resume_hint_shown",
                event_key=event_key,
                payload={"target": target, "label": label},
            )
        except EventIdempotencyConflict:
            await db.rollback()
            return responses.idempotency_conflict_error()
        await db.commit()
        return ContinueResponse(
            route_hash=route_hash,
            target=target,
            label=label,
            last_step_id=assignment.last_step_id,
        )
