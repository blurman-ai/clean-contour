    @router.get("", response_model=FileListPageResponse)
    async def list_files(
        limit: int = Query(default=20, ge=1, le=100),
        offset: int = Query(default=0, ge=0),
        kind: Literal["all", "document", "audio", "image"] = Query(default="all"),
        current_user: CallerContext = Depends(get_caller_context),
        db: AsyncSession = Depends(get_session),
    ) -> FileListPageResponse:
        rows, total = await list_owner_files(
            db,
            owner_user_id=current_user.user_id,
            limit=limit,
            offset=offset,
            kind=kind,
        )
        uploaded_by = await _uploaded_by(db, current_user.user_id)
        used_in_map = await usage_by_file(db, attachment_ids=[row.id for row in rows])
        version_rows = (
            (
                await db.scalars(
                    select(FileVersion)
                    .where(FileVersion.file_id.in_([row.id for row in rows]))
                    .order_by(FileVersion.file_id, FileVersion.version_number)
                )
            ).all()
            if rows
            else []
        )
        versions_by_file: dict[uuid.UUID, list[FileVersion]] = {}
        for version in version_rows:
            versions_by_file.setdefault(version.file_id, []).append(version)
        items = [
            await _file_item(
                db,
                row,
                uploaded_by=uploaded_by,
                used_in=used_in_map.get(row.id, []),
                versions=versions_by_file.get(row.id, []),
            )
            for row in rows
        ]
        return FileListPageResponse(
            items=items,
            limit=limit,
            offset=offset,
            has_more=offset + len(items) < total,
            total=total,
        )
