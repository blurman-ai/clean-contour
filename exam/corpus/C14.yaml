  code: |
    @router.get("/dispatches", response_model=list[DispatchListItemResponse])
    async def list_shipment_dispatches(
        current_user: CallerContext = Depends(get_caller_context),
        db: AsyncSession = Depends(get_session),
    ) -> list[DispatchListItemResponse]:
        drafts = (
            await db.scalars(
                select(ShipmentDraft)
                .where(
                    ShipmentDraft.owner_id == current_user.user_id,
                    ShipmentDraft.status != DispatchStatus.DELIVERED,
                    ShipmentDraft.deleted_at.is_(None),
                )
                .order_by(ShipmentDraft.updated_at.desc(), ShipmentDraft.created_at.desc())
            )
        ).all()

        refreshable_items: list[tuple[ShipmentDraft, DispatchRevision | None]] = []
        for draft in drafts:
            current_batch = None
            if draft.current_batch_id:
                current_batch = await _get_dispatch_revision(
                    db, draft.id, draft.current_batch_id
                )
            refreshable_items.append((draft, current_batch))

        if any(
            route_refresh._should_refresh_route_for_list(draft, revision)
            for draft, revision in refreshable_items
        ):
            for draft, current_batch in refreshable_items:
                await route_refresh._refresh_route_from_planner(
                    db, draft, current_batch, current_user.user_id, persist_stage=False
                )
            await db.commit()
            for draft, _ in refreshable_items:
                await db.refresh(draft)

        items: list[DispatchListItemResponse] = []
        for draft, current_batch in refreshable_items:
            revisions = await _get_dispatch_revisions(db, draft.id)
            flow_state = dispatch_flow_state(draft, revisions)
            items.append(
                DispatchListItemResponse(
                    dispatch_id=str(draft.id),
                    title=_dispatch_title(draft, current_batch),
                    status=public_dispatch_status(draft.status),
                    phase=flow_state.phase,
                )
            )
        return items
