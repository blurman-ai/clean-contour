        if route is None:
            raise HTTPException(
                status_code=status.HTTP_404_NOT_FOUND, detail="Route not found"
            )
        practice_session = await practice_sessions._get_or_create_practice_session(
            db, route=route, current_user=current_user
        )
        reset_key = idempotency_key or f"reset:{uuid.uuid4().hex}"
        existing = await _practice_event_by_key(db, session=practice_session, key=reset_key)
