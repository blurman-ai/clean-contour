  code: |
    CAPACITY_CEILING_FAILURES = frozenset(
        {
            FailureCode.OUTPUT_TOKEN_LIMIT,
            FailureCode.OUTPUT_TRUNCATED_BY_PROVIDER,
        }
    )


    def is_capacity_ceiling_failure(value: object) -> bool:
        """Hitting the response size ceiling - by the refusal code or by the exception itself."""

        code = value
        if not isinstance(code, (FailureCode, str)):
            code = getattr(value, "failure_code", None) or getattr(
                value, "public_fault_code", None
            )
        try:
            member = FailureCode(code)
        except ValueError:
            return False
        return member in CAPACITY_CEILING_FAILURES


    def retry_allowed(value: object, attempts: int) -> bool:
        if is_capacity_ceiling_failure(value):
            return False
        return attempts < MAX_RETRY_ATTEMPTS
