  why: Every exception is reduced to a member of the code list by its class; the message text is not read anywhere.
  source: External service call method where the exception class chooses the refusal code from the list.
  code: |
    class CarrierCall:
        def __init__(self, client, failures) -> None:
            self.client = client
            self.failures = failures

        async def send(self, request: CarrierRequest) -> CarrierResponse:
            try:
                response = await self.client.send(request)
            except CarrierTimeout:
                code = FailureCode.CARRIER_TIMEOUT
            except CarrierRateLimited:
                code = FailureCode.CARRIER_RATE_LIMITED
            except CarrierAuthError:
                code = FailureCode.CARRIER_AUTH_ERROR
            except CarrierPayloadError:
                code = FailureCode.CARRIER_PAYLOAD_INVALID
            else:
                return response
            self.failures.record(request.shipment_id, code)
            raise CarrierCallFailed(code)

        def retryable(self, code: FailureCode) -> bool:
            return code in RETRYABLE_CODES

