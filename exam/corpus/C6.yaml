  expected: clean
  path: src/shared/api/lib/retryPolicy.ts
  why: The retry is chosen by the numeric response status and the client network error code, and the includes check goes over an array of statuses, not text.
  source: Frontend function that decides on a request retry by the response status. By form.
  code: |
    import axios from "axios";

    const RETRYABLE_STATUSES = [502, 503, 504];
    const MAX_ATTEMPTS = 3;

    export function shouldRetry(error: unknown, attempt: number): boolean {
      if (attempt >= MAX_ATTEMPTS) return false;
      if (!axios.isAxiosError(error)) return false;
      if (error.code === "ECONNABORTED") return attempt < 2;
      const status = error.response?.status;
      return status !== undefined && RETRYABLE_STATUSES.includes(status);
    }

    // delay doubles with each attempt, capped at eight seconds
    export function retryDelayMs(attempt: number): number {
      return Math.min(1000 * 2 ** attempt, 8000);
    }

    export async function withRetry<T>(run: () => Promise<T>): Promise<T> {
      let attempt = 0;
      for (;;) {
        try {
          return await run();
        } catch (error) {
          if (!shouldRetry(error, attempt)) throw error;
          await new Promise(resolve => setTimeout(resolve, retryDelayMs(attempt)));
          attempt += 1;
        }
      }
    }
