  code: |
    import axios from "axios";

    import { readFault, readFaultMessage } from "@/shared/api/lib/apiError";

    type Translate = (key: string) => string;

    export function isDepotNameConflict(error: unknown): boolean {
      if (!axios.isAxiosError(error) || error.response?.status !== 409) return false;
      const url = String(error.config?.url ?? "");
      if (!url.includes("/depots")) return false;
      const detail = readFault(error);
      if (typeof detail === "string") {
        return detail.toLowerCase().includes("depot");
      }
      return true;
    }

    export function depotCreateErrorMessage(error: unknown, t: Translate): string {
      if (isDepotNameConflict(error)) {
        return t("depots.errors.nameTaken");
      }
      return readFaultMessage(error, t("depots.errors.generic"));
    }

