    class CarrierBooking:
        def __init__(self, client, log, clock) -> None:
            self.client = client
            self.log = log
            self.clock = clock

        async def push_to_carrier(self, shipment: Shipment, payload: dict) -> dict:
            started = self.clock.monotonic()
            try:
                return await self.client.post(
                    "/bookings", json=payload, timeout=CARRIER_TIMEOUT_S
                )
            except CarrierError as exc:
                elapsed = self.clock.monotonic() - started
                if "timeout" in str(exc).lower():
                    self.log.warning(
                        "carrier_booking_slow shipment_id=%s elapsed=%.1f",
                        shipment.id,
                        elapsed,
                    )
                else:
                    self.log.error(
                        "carrier_booking_failed shipment_id=%s error=%s", shipment.id, exc
                    )
                raise

        async def push_many(self, shipments: list[Shipment]) -> list[dict]:
            return [await self.push_to_carrier(s, build_booking(s)) for s in shipments]

- id: C6-03
  card: C6
  expected: dirty
  path: app/services/label_failure_codes.py
  why: The refusal code is restored from the message by a string prefix and by cutting off the tail, not read from a field or a list.
  source: Function that restores a refusal code from an old text message of a record.
  code: |
    LABEL_FAILURE_FALLBACK = "label_generation_failed"


    def _batch_failure_code(batch: LabelBatch | None) -> str | None:
        """Recover the normalized code from a legacy batch message.

        The start failure is stored as a bare name, with no prose around it.
        Parsing only the `Label service failed:` prefix would return `None` for
        it, and the operator would read the generic text instead of the reason.
        """

        if batch is None:
            return None
        message = str(batch.error_message or "").strip()
        if message in LABEL_FAILURE_CODES:
            return message
        prefix = "Label service failed:"
        if not message.startswith(prefix):
            return None
        raw_code = message[len(prefix) :].split("(", 1)[0].strip()
        if not raw_code:
            return LABEL_FAILURE_FALLBACK
        return _service_failure_code({"public_fault_code": raw_code}) or (
            LABEL_FAILURE_FALLBACK
        )

