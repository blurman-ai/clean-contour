  code: |
    from fastapi import HTTPException

    from app.integrations.carrier import CarrierRejected


    def map_carrier_rejection(exc: CarrierRejected) -> HTTPException:
        """Answer the API client with the status that fits the carrier's refusal."""
        reason = str(exc.reason or "").strip()
        if reason.startswith("ADDRESS_"):
            return HTTPException(status_code=422, detail="address_rejected")
        if reason.startswith("LIMIT_"):
            return HTTPException(status_code=429, detail="carrier_limit_reached")
        if reason.removeprefix("ERR:").strip().lower() == "service unavailable":
            return HTTPException(status_code=503, detail="carrier_unavailable")
        return HTTPException(status_code=502, detail="carrier_rejected")


    @router.post("/shipments/{shipment_id}/book")
    async def book_shipment(shipment_id: uuid.UUID, db: AsyncSession = Depends(get_db)):
        shipment = await db.get(Shipment, shipment_id)
        if shipment is None:
            raise HTTPException(status_code=404, detail="shipment_not_found")
        try:
            return await carrier.book(shipment)
        except CarrierRejected as exc:
            raise map_carrier_rejection(exc) from exc

