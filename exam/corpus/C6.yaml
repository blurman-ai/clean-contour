  source: Function that determines a task refusal code, where after the exception type comes a message substring parse.
  code: |
    _PUBLIC_FAULT_CODE_BY_TYPE: tuple[tuple[type[BaseException], str], ...] = (
        (PoolTimeoutError, "database_connection_pool_timeout"),
        (JobLeaseLostError, "label_job_lease_lost"),
        (TimeoutError, "label_timeout"),
    )

    _SAFE_ERROR_CODE_BY_MESSAGE: tuple[tuple[str, str], ...] = (
        ("shipment_not_found", "shipment_not_found"),
        ("unsupported_job_type", "unsupported_job_type"),
        ("lease_lost", "label_job_lease_lost"),
        ("timeout", "label_timeout"),
    )


    def _public_fault_code(exc: Exception) -> str:
        typed_code = str(getattr(exc, "public_fault_code", "") or "").strip().lower()
        if re.fullmatch(r"[a-z0-9_.:-]{1,160}", typed_code):
            return typed_code
        for error_type, code in _PUBLIC_FAULT_CODE_BY_TYPE:
            if isinstance(exc, error_type):
                return code
        message = str(exc).strip().lower()
        for needle, code in _SAFE_ERROR_CODE_BY_MESSAGE:
            if needle in message:
                log.event(
                    "label_job_safe_error_code_guessed",
                    resolved_code=code,
                    source="message_substring",
                )
                return code
        return "label_job_failed"

