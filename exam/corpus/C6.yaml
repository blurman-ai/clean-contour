  code: |
    from pathlib import Path

    ALLOWED_SUFFIXES = {".xlsx", ".csv"}


    def collect_waybill_files(folder: Path) -> list[Path]:
        """Files to read from the upload folder."""
        files: list[Path] = []
        for path in sorted(folder.iterdir()):
            if path.name.startswith("~$") or path.name.startswith("."):
                continue
            if path.suffix.lower() not in ALLOWED_SUFFIXES:
                continue
            files.append(path)
        return files


    def import_folder(folder: Path, importer) -> dict[str, int]:
        imported = 0
        failed = 0
        for path in collect_waybill_files(folder):
            try:
                importer.load(path)
                imported += 1
            except WaybillFormatError:
                failed += 1
        return {"imported": imported, "failed": failed}

