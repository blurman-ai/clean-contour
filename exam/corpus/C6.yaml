- id: C6-12
  card: C6
  expected: clean
  path: src/shared/lib/screenState.ts
  why: The includes method checks whether a value is in an array of screen states and reads neither the error text nor the refusal code.
  source: Frontend functions that reduce the states of several requests to a screen state.
  code: |
    export type ScreenState = "loading" | "error" | "empty" | "ready";

    /** What the screen has from the main request; `isEmpty` means there is no data by the meaning of the screen. */
    export type QueryViewInput = {
      status: "pending" | "error" | "success";
      isEmpty?: boolean;
    };

    /**
     * `data-state` of the screen from the main request. A refresh error on top of already
     * loaded data does not blank the screen: in react-query in this case
     * `status === "success"` remains while the data exists.
     */
    export function queryViewState(query: QueryViewInput): ScreenState {
      if (query.status === "pending") return "loading";
      if (query.status === "error") return "error";
      return query.isEmpty ? "empty" : "ready";
    }

    /**
     * Screen state from several main requests: any error makes the screen
     * `error`, otherwise any loading makes it `loading`, otherwise it is empty only when all are empty.
     */
    export function mergeViewStates(states: readonly ScreenState[]): ScreenState {
      if (states.includes("error")) return "error";
      if (states.includes("loading")) return "loading";
      if (states.length > 0 && states.every(state => state === "empty")) return "empty";
      return "ready";
    }

