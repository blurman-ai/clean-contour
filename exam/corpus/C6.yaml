  source: Frontend function that divides refusals into categories by the prefix of the code string. By form.
  code: |
    export type ApiFailure = { code: string; message: string };

    /** Refusal category for display to the user. */
    export type FailureCategory = "validation" | "conflict" | "server";

    export function failureCategory(failure: ApiFailure): FailureCategory {
      if (failure.code.startsWith("validation_")) return "validation";
      if (failure.code.startsWith("conflict_")) return "conflict";
      return "server";
    }

    export function shouldOfferRetry(failure: ApiFailure): boolean {
      return failureCategory(failure) === "server";
    }

    export function failureToast(failure: ApiFailure, t: (key: string) => string) {
      const category = failureCategory(failure);
      return {
        title: t(`errors.${category}.title`),
        message: category === "validation" ? failure.message : t(`errors.${category}.body`),
        retry: shouldOfferRetry(failure),
      };
    }

