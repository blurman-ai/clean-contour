    import { notifications } from "@/shared/lib/notifications";

    import { readFault, readFaultCode } from "@/shared/api/lib/apiError";

    type Translate = (key: string, options?: Record<string, unknown>) => string;

    export function readRetryDelaySec(error: unknown): number | undefined {
      const detail = readFault(error);
      if (detail == null || typeof detail === "string") return undefined;
      return typeof detail.retry_after_sec === "number"
        ? detail.retry_after_sec
        : undefined;
    }

    export function tryNotifyCourierResendError(
      error: unknown,
      t: Translate,
    ): boolean {
      const code = readFaultCode(error);
      if (code === "contact_already_verified") {
        notifications.show({
          title: t("couriers.notifications.alreadyVerifiedTitle"),
          message: t("couriers.notifications.alreadyVerifiedMessage"),
          color: "orange",
        });
        return true;
      }
      if (code === "resend_throttled") {
        notifications.show({
          title: t("couriers.notifications.rateLimitedTitle"),
          message: t("couriers.notifications.rateLimitedMessage", {
            seconds: readRetryDelaySec(error) ?? "—",
          }),
          color: "orange",
        });
        return true;
      }
      return false;
    }

