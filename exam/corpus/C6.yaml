  source: Check of user text for control characters in the service layer.
  code: |
    import unicodedata

    MAX_OTHER_NAME_LENGTH = 120


    def _public_other_text(value: str | None) -> str | None:
        """Return bounded custom depot data, rejecting invisible control characters."""

        if value is None:
            return None
        text = str(value)
        if any(unicodedata.category(char).startswith("C") for char in text):
            return None
        return text if text.strip() else None


    def normalize_other_name(value: str | None) -> str | None:
        text = _public_other_text(value)
        if text is None:
            return None
        text = " ".join(text.split())
        if len(text) > MAX_OTHER_NAME_LENGTH:
            raise DepotNameInvalid("depot_name_too_long")
        return text

