    from enum import Enum


    class LabelErrorCode(str, Enum):
        PRINTER_OFFLINE = "printer_offline"
        PAPER_OUT = "paper_out"
        TEMPLATE_MISSING = "template_missing"
        ADDRESS_TOO_LONG = "address_too_long"


    TRANSIENT_CODES = frozenset({LabelErrorCode.PRINTER_OFFLINE, LabelErrorCode.PAPER_OUT})


    class LabelError(Exception):
        def __init__(self, code: LabelErrorCode, shipment_id: str) -> None:
            super().__init__(code.value)
            self.code = code
            self.shipment_id = shipment_id


    def next_action(exc: LabelError, attempts: int) -> str:
        if exc.code in TRANSIENT_CODES:
            return "retry_later" if attempts < 3 else "call_operator"
        if exc.code is LabelErrorCode.ADDRESS_TOO_LONG:
            return "shorten_address"
        return "fail"

