  code: |
    import axios from "axios";

    import { readFaultMessage } from "@/shared/api/lib/apiError";

    export function getFaultMessage(
      error: unknown,
      fallback: string,
      options?: { labelInvalidJsonMessage?: string },
    ): string {
      if (axios.isAxiosError(error)) {
        const fromDetail = readFaultMessage(error, "");
        if (
          options?.labelInvalidJsonMessage &&
          fromDetail.includes("label_generation_invalid_json")
        ) {
          return options.labelInvalidJsonMessage;
        }
        if (fromDetail.trim().length > 0) {
          return fromDetail;
        }
        if (
          typeof error.response?.data === "string" &&
          error.response.data.trim().length > 0
        ) {
          return error.response.data;
        }
        if (error.message.trim().length > 0) {
          return error.message;
        }
      }
      if (error instanceof Error && error.message.trim().length > 0) {
        return error.message;
      }
      return fallback;
    }

