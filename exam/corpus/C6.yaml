    def _depot_name_conflict_constraint(exc: IntegrityError) -> bool:
        original = exc.orig
        constraint_name = getattr(getattr(original, "diag", None), "constraint_name", None)
        if constraint_name is None:
            constraint_name = getattr(
                getattr(original, "__cause__", None), "constraint_name", None
            )
        if constraint_name == "uq_depots_active_root_name":
            return True
        return (
            "UNIQUE constraint failed: depots.region_id, "
            "depots.depot_type, depots.normalized_name"
        ) in str(exc.orig)


    @router.post("")
    async def create_depot(payload: DepotCreate, db: AsyncSession = Depends(get_db)):
        depot = Depot(region_id=payload.region_id, name=payload.name)
        db.add(depot)
        try:
            await db.commit()
        except IntegrityError as exc:
            await db.rollback()
            if _depot_name_conflict_constraint(exc):
                raise HTTPException(status_code=409, detail="depot_name_taken") from exc
            raise
        return depot

