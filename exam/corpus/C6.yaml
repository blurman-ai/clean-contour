  code: |
    import asyncio
    import logging

    from app.integrations.carrier import CarrierClient, CarrierError

    log = logging.getLogger(__name__)

    # pauses between attempts, seconds
    # the carrier accepts a limited number of bookings per minute
    RETRY_PAUSE_S = (1, 4, 15)


    async def book_with_retry(client: CarrierClient, payload: dict) -> dict:
        last: CarrierError | None = None
        for pause in (0, *RETRY_PAUSE_S):
            if pause:
                await asyncio.sleep(pause)
            try:
                return await client.create_booking(payload)
            except CarrierError as exc:
                last = exc
                text = str(exc).lower()
                if "rate limit" in text or "too many requests" in text:
                    continue
                if "connection reset" in text:
                    continue
                raise
        assert last is not None
        log.warning("carrier_booking_gave_up shipment=%s", payload.get("shipment_id"))
        raise last

