    import type { Shipment } from "./types";

    export type BookingError = { code: string; field?: string };

    export type BookingResult =
      | { ok: true; bookingId: string }
      | { ok: false; error: BookingError };

    export function checkPalletBooking(shipment: Shipment): BookingError | null {
      if (shipment.kind !== "pallet") {
        return { code: "pallet_booking_not_supported", field: "kind" };
      }
      if (!shipment.palletCount || shipment.palletCount < 1) {
        return { code: "pallet_count_required", field: "palletCount" };
      }
      return null;
    }

    export async function bookPalletSlot(
      shipment: Shipment,
      api: { reserve(shipmentId: string, count: number): Promise<string> },
    ): Promise<BookingResult> {
      const error = checkPalletBooking(shipment);
      if (error) {
        return { ok: false, error };
      }
      const bookingId = await api.reserve(shipment.id, shipment.palletCount);
      return { ok: true, bookingId };
    }
