    from typing import Protocol

    from app.shipping.models import Shipment, ShipmentKind


    class ShipmentPlanBuilder(Protocol):
        def build(self, shipment: Shipment) -> ShipmentPlan: ...


    class ExpressBuilder:
        def build(self, shipment: Shipment) -> ShipmentPlan:
            return ShipmentPlan(shipment.id, slot=reserve_express_slot(shipment))


    class RegularBuilder:
        def build(self, shipment: Shipment) -> ShipmentPlan:
            return ShipmentPlan(
                shipment.id,
                window=reserve_regular_window(shipment),
                hub=pick_hub(shipment.destination),
            )


    class PalletBuilder:
        def build(self, shipment: Shipment) -> ShipmentPlan:
            plan = RegularBuilder().build(shipment)
            plan.documents.append("loading-plan")
            return plan


    PLANS: dict[ShipmentKind, ShipmentPlanBuilder] = {
        ShipmentKind.EXPRESS: ExpressBuilder(),
        ShipmentKind.REGULAR: RegularBuilder(),
        ShipmentKind.PALLET: PalletBuilder(),
    }


    def plan_shipment(shipment: Shipment) -> ShipmentPlan:
        plan = PLANS[shipment.kind].build(shipment)
        if shipment.kind is ShipmentKind.PALLET:
            plan.needs_ramp = True
        return plan
