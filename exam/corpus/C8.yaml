  code: |
    type RouteStep = {
      id: string;
      kind: "locker" | "address" | "hub";
      lockerId?: string;
      address?: string;
      eta?: string;
    };

    type StepView = { title: string; hint: string; mapQuery: string };

    export function describeStep(step: RouteStep): StepView {
      if (step.kind !== "locker" || !step.lockerId) {
        return {
          title: step.address ?? "Address not specified",
          hint: "Hand the parcel to the recipient in person",
          mapQuery: step.address ?? "",
        };
      }
      return {
        title: `Parcel locker ${step.lockerId}`,
        hint: "Put the parcel in a free cell",
        mapQuery: `locker ${step.lockerId}`,
      };
    }

    export function describeRoute(steps: RouteStep[]): StepView[] {
      return steps.map(describeStep);
    }

    export function firstEta(steps: RouteStep[]): string | null {
      return steps.find(step => step.eta)?.eta ?? null;
    }
