  source: Questionnaire scoring where the second branch is chosen by the condition "not the multiple-choice kind of question".
  code: |
    import type { SurveyQuestion, SurveyAnswer } from "../model/types";

    type SurveyLike = {
      id: string;
      questions: SurveyQuestion[];
    };

    function multiAnswerMatches(
      question: SurveyQuestion,
      answer: SurveyAnswer | undefined,
    ): boolean {
      if (!Array.isArray(answer)) return false;
      const expected = new Set(question.expectedChoiceIndices ?? []);
      return answer.length === expected.size && answer.every(i => expected.has(i));
    }

    export function computeSurveyScore(
      survey: SurveyLike | undefined,
      answers: Record<string, SurveyAnswer>,
    ): number {
      if (!survey) return 0;
      return survey.questions.reduce((score, question) => {
        if (
          question.kind === "multiple_choice" &&
          question.expectedChoiceIndices?.length &&
          multiAnswerMatches(question, answers[question.id])
        ) {
          return score + 1;
        }
        if (
          question.kind !== "multiple_choice" &&
          question.correctOptionId &&
          String(answers[question.id]) === String(question.correctOptionId)
        ) {
          return score + 1;
        }
        return score;
      }, 0);
    }
