  code: |
    from app.shipping.models import Parcel, ParcelKind

    MAX_BOX_KG = 30


    class BatchError(Exception):
        def __init__(self, code: str) -> None:
            super().__init__(code)
            self.code = code


    def check_consolidation_batch(parcels: list[Parcel]) -> None:
        """A consolidated trip accepts only boxes up to the limit weight."""
        if not parcels:
            raise BatchError("batch_empty")
        kinds = {parcel.kind for parcel in parcels}
        if kinds != {ParcelKind.BOX}:
            raise BatchError("batch_accepts_boxes_only")
        if any(parcel.weight_kg > MAX_BOX_KG for parcel in parcels):
            raise BatchError("batch_parcel_too_heavy")


    def consolidate(parcels: list[Parcel]) -> list[str]:
        check_consolidation_batch(parcels)
        ordered = sorted(parcels, key=lambda parcel: (parcel.destination_hub, parcel.id))
        return [parcel.barcode for parcel in ordered]
