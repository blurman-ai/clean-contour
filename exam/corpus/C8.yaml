    from datetime import timedelta

    from app.billing.gateway import PaymentGateway
    from app.billing.models import AccountType, Customer, Settlement
    from app.billing.numbers import next_invoice_number
    from app.billing.totals import calculate_total
    from app.shipping.models import Shipment
    from app.time import utcnow

    INVOICE_DUE_DAYS = 14


    async def settle_shipment(db, shipment: Shipment, payments: PaymentGateway) -> Settlement:
        """Closes the settlement: charges the payment or issues an invoice."""
        customer = await db.get(Customer, shipment.customer_id)
        amount = await calculate_total(db, shipment)
        settlement = Settlement(shipment_id=shipment.id, amount_kopecks=amount)

        # the payment gateway is called only for card payment
        if customer.account_type != AccountType.CORPORATE:
            charge = await payments.charge_card(customer.card_token, amount)
            settlement.payment_ref = charge.reference
            settlement.paid_at = utcnow()
        else:
            settlement.invoice_number = await next_invoice_number(db)
            settlement.due_at = utcnow() + timedelta(days=INVOICE_DUE_DAYS)

        db.add(settlement)
        await db.commit()
        return settlement
