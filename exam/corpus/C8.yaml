    from datetime import date

    from app.shipping.calendar import is_business_day, is_valid_postal_code
    from app.shipping.errors import TicketError
    from app.shipping.models import Ticket


    def check_ticket(ticket: Ticket, today: date) -> None:
        if not is_valid_postal_code(ticket.postal_code):
            raise TicketError("postal_code_invalid", field="postal_code")

        if not is_business_day(ticket.requested_date):
            raise TicketError("requested_date_not_business_day", field="requested_date")

        if ticket.requested_date < today:
            raise TicketError("requested_date_in_past", field="requested_date")

        if not ticket.contact_phone and not ticket.contact_email:
            raise TicketError("contact_required", field="contact_phone")


    def normalize_ticket(ticket: Ticket) -> Ticket:
        ticket.comment = (ticket.comment or "").strip()
        ticket.postal_code = ticket.postal_code.replace(" ", "")
        return ticket


    def accept_ticket(ticket: Ticket, today: date) -> Ticket:
        ticket = normalize_ticket(ticket)
        check_ticket(ticket, today)
        ticket.status = "accepted"
        return ticket
