    import type { QuoteInput, QuoteLine } from "../model/types";
    import { baseRate, fuelSurcharge, zoneSurcharge } from "./rates";

    const MIN_CHARGEABLE_KG = 0.5;

    export function buildQuoteLines(input: QuoteInput): QuoteLine[] {
      const weight = Math.max(input.weightKg, MIN_CHARGEABLE_KG);
      const lines: QuoteLine[] = [
        { code: "base", amountKopecks: baseRate(input.zone, weight) },
      ];

      // standard delivery goes by a consolidated trip
      if (input.serviceKind !== "express") {
        lines.push({ code: "consolidation", amountKopecks: Math.round(weight * 18) });
        lines.push({ code: "zone", amountKopecks: zoneSurcharge(input.zone) });
      }

      if (input.insured) {
        lines.push({
          code: "insurance",
          amountKopecks: Math.round(input.declaredKopecks * 0.004),
        });
      }
      lines.push({ code: "fuel", amountKopecks: fuelSurcharge(lines) });
      return lines;
    }

    export function totalKopecks(lines: QuoteLine[]): number {
      return lines.reduce((sum, line) => sum + line.amountKopecks, 0);
    }
