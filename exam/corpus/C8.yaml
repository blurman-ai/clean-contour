    from sqlalchemy import select
    from sqlalchemy.ext.asyncio import AsyncSession

    from app.shipping.errors import PickupError
    from app.shipping.models import Shipment, ShipmentKind


    async def load_owned_pickup(
        db: AsyncSession,
        *,
        shipment_id: int,
        owner_id: int,
        for_update: bool = False,
    ) -> Shipment:
        statement = select(Shipment).where(
            Shipment.id == shipment_id,
            Shipment.created_by_user_id == owner_id,
        )
        if for_update:
            statement = statement.with_for_update()
        shipment = await db.scalar(statement)
        if shipment is None:
            raise PickupError("pickup_not_found", status_code=404)
        if shipment.kind != ShipmentKind.PICKUP.value:
            raise PickupError("not_a_pickup", status_code=409)
        return shipment


    def pickup_window(shipment: Shipment) -> tuple[str, str]:
        start = shipment.pickup_from.strftime("%H:%M")
        end = shipment.pickup_to.strftime("%H:%M")
        return start, end
