  code: |
    from collections import defaultdict
    from datetime import date, timedelta

    from app.shipping.calendar import is_holiday
    from app.shipping.models import PickupRequest


    def group_pickups_by_day(requests: list[PickupRequest]) -> dict[date, list[PickupRequest]]:
        """Moves requests from days off to the nearest working day."""
        groups: dict[date, list[PickupRequest]] = defaultdict(list)
        for request in requests:
            day = request.requested_date
            while is_holiday(day):
                day += timedelta(days=1)
            groups[day].append(request)
        return groups


    def split_into_batches(requests: list[PickupRequest]) -> list[list[PickupRequest]]:
        batches: list[list[PickupRequest]] = []
        current: list[PickupRequest] = []
        for request in sorted(requests, key=lambda item: item.depot_id):
            if current and current[-1].depot_id != request.depot_id:
                batches.append(current)
                current = []
            current.append(request)
        if current:
            batches.append(current)
        return batches


    def has_workday_request(requests: list[PickupRequest]) -> bool:
        return any(not is_holiday(request.requested_date) for request in requests)
