    async def apply_completed_revision(db, draft, revision, now):
        snapshot = with_pinned_limits(revision.cargo_snapshot_json)
        revision.cargo_snapshot_json = snapshot
        revision.error_message = None
        revision.completed_at = now
        revision.updated_at = now
        await db.flush()

        draft.current_batch_id = revision.id
        is_courier_build = revision.mode == COURIER_BUILD_MODE
        if revision.layout_snapshot_json is not None and not is_courier_build:
            draft.layout_json = revision.layout_snapshot_json
        if is_courier_build:
            options = (
                revision.dispatch_options_json
                if isinstance(revision.dispatch_options_json, dict)
                else {}
            )
            source_version = options.get("_courier_build_plan_version")
            source_sha256 = options.get("_courier_build_plan_sha256")
            if (
                isinstance(source_version, int)
                and isinstance(source_sha256, str)
                and draft.plan_version == source_version
                and draft.plan_sha256 == source_sha256
            ):
                # The built artifact advances the plan version once; an edit made
                # while the worker ran keeps its own version.
                draft.plan_version = source_version + 1
        await finish_batch_and_settle_order(db, draft, revision, "completed")
        await db.flush()
        return draft
