    import type { AcceptedOrder, Deps, Order } from "./types";
    import { isReturnOrder, validateOrder } from "./orderKinds";

    /** Takes the order into work and saves the intake result. */
    export async function acceptOrder(order: Order, deps: Deps): Promise<AcceptedOrder> {
      const validated = validateOrder(order);
      const accepted: AcceptedOrder = {
        id: order.id,
        lines: validated.lines,
        warnings: [],
      };

      if (!isReturnOrder(order)) {
        accepted.reservation = await deps.stock.reserve(order.lines);
        accepted.pickupAt = await deps.slots.firstFree(order.warehouseId);
      }

      if (order.comment) {
        accepted.note = order.comment.trim();
      }
      if (order.lines.length > 50) {
        accepted.warnings.push("many_lines");
      }

      await deps.orders.save(accepted);
      return accepted;
    }
