    import { OrderError } from "./orderError";
    import type { Order } from "../model/types";

    export function assertExpressOrder(order: Order): void {
      if (order.kind !== "express") {
        throw new OrderError("order_kind_not_accepted", {
          orderId: order.id,
          kind: order.kind,
        });
      }
    }

    export function expressDeadline(order: Order): Date {
      assertExpressOrder(order);
      const created = new Date(order.createdAt);
      created.setHours(created.getHours() + 4);
      return created;
    }

    export function formatExpressDeadline(order: Order): string {
      const deadline = expressDeadline(order);
      return deadline.toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    export function isExpressLate(order: Order, now: Date): boolean {
      return now.getTime() > expressDeadline(order).getTime();
    }
