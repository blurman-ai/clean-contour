    from datetime import datetime, timedelta

    from app.shipping.depots import nearest_depot, next_batch_start
    from app.shipping.models import PickupSlot, Shipment, ShipmentKind

    EXPRESS_LEAD = timedelta(minutes=30)


    def schedule_pickup(db, shipment: Shipment, now: datetime) -> PickupSlot:
        """Assigns a pickup window at the nearest warehouse."""
        depot = nearest_depot(db, shipment.origin)
        slot = PickupSlot(shipment_id=shipment.id, depot_id=depot.id)
        slot.starts_at = now + EXPRESS_LEAD
        slot.window_minutes = 30
        slot.shared_vehicle = False

        if shipment.kind is not ShipmentKind.EXPRESS:
            slot.starts_at = next_batch_start(depot, now)
            slot.window_minutes = 120
            slot.shared_vehicle = True

        slot.contact_phone = shipment.sender_phone
        db.add(slot)
        return slot
