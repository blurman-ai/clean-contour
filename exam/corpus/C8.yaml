    from app.shipping.kinds import is_express, is_pallet
    from app.shipping.models import Shipment
    from app.shipping.schedule import (
        pick_hub,
        reserve_express_slot,
        reserve_regular_window,
    )


    def plan_shipment(shipment: Shipment) -> ShipmentPlan:
        plan = ShipmentPlan(shipment_id=shipment.id)
        plan.documents = ["invoice"]
        if is_pallet(shipment):
            plan.documents.append("loading-plan")

        plan.slot = reserve_express_slot(shipment) if shipment.paid_express else None

        if not is_express(shipment):
            plan.window = reserve_regular_window(shipment)
            plan.hub = pick_hub(shipment.destination)
            plan.consolidation_days = 2

        plan.insured = shipment.declared_value > 10_000
        plan.notes = shipment.comment.strip() if shipment.comment else ""
        return plan


    def plan_many(shipments: list[Shipment]) -> list[ShipmentPlan]:
        return [plan_shipment(shipment) for shipment in shipments]
