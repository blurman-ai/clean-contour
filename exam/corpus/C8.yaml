    import type { Parcel, ParcelKind } from "../model/types";
    import { currentHubId, markScanned, queueTransfer } from "./api";
    import { sortToConveyor, sortToLetterBin, sortToRamp } from "./stations";

    const HANDLERS: Record<ParcelKind, (parcel: Parcel) => Promise<void>> = {
      letter: parcel => sortToLetterBin(parcel),
      box: parcel => sortToConveyor(parcel),
      pallet: parcel => sortToRamp(parcel),
    };

    export async function routeParcel(
      parcel: Parcel | undefined,
      dryRun: boolean,
    ): Promise<void> {
      if (!parcel || !parcel.barcode) {
        return;
      }
      if (!dryRun) {
        await markScanned(parcel.id);
      }
      await HANDLERS[parcel.kind](parcel);
      // a parcel for another node is put in the transfer queue
      if (parcel.destinationHubId !== currentHubId()) {
        await queueTransfer(parcel.id, parcel.destinationHubId);
      }
    }
