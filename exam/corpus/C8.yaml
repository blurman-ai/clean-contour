    import logging

    from app.shipping.kinds import is_hazardous
    from app.shipping.models import Parcel
    from app.shipping.packing import (
        PackingTask,
        apply_standard_padding,
        attach_fragile_marks,
        pick_box,
    )

    logger = logging.getLogger(__name__)

    MAX_STACK_DEFAULT = 4


    def prepare_for_packing(parcel: Parcel) -> PackingTask:
        """Builds a task for the packer for a parcel."""
        task = PackingTask(parcel_id=parcel.id, box_size=pick_box(parcel))
        # we recompute the number of labels before handing over to the warehouse
        task.labels = ["barcode"]
        if parcel.weight_kg > 20:
            task.labels.append("heavy")

        if not is_hazardous(parcel):
            apply_standard_padding(task, parcel)
            attach_fragile_marks(task, parcel)
            task.max_stack_height = MAX_STACK_DEFAULT
        else:
            task.labels.append("adr")
            task.max_stack_height = 1

        task.requires_second_check = parcel.declared_value > 50_000
        logger.info("packing_task_ready parcel=%s box=%s", parcel.id, task.box_size)
        return task
