        kind: str  # "freight" | "parcel"
        unit: str  # "pallets" | "kg" | "pieces"
        quantity: int
        address: str


    def load_caption(line: LoadLine) -> str:
        suffix = "plt." if line.unit == "pallets" else "kg" if line.unit == "kg" else "pcs."
        return f"{line.quantity} {suffix}"


    def needs_ramp(line: LoadLine) -> bool:
