- id: C7-01
  card: C7
  expected: clean
  path: app/shipping/refs.py
  why: The reference prefixes are declared in one module with a single parse function; this is the card's exception for the declaring module.
  source: Reference format module where the prefixes are declared as constants and read by one parse function.
  code: |
    """Shipment reference format: the one place that knows the prefixes."""
    from __future__ import annotations

    import uuid
    from dataclasses import dataclass

    PICKUP_PREFIX = "pickup:"
    RETURN_PREFIX = "return:"
    LEGACY_KEY = "legacy-initial"


    @dataclass(frozen=True)
    class ShipmentRef:
        kind: str
        shipment_id: uuid.UUID | None


    def format_pickup_ref(shipment_id: uuid.UUID) -> str:
        return f"{PICKUP_PREFIX}{shipment_id}"


    def parse_shipment_ref(ref: str) -> ShipmentRef:
        """Split a stored reference into kind and id; the only reader of prefixes."""

        if ref.startswith(PICKUP_PREFIX):
            return ShipmentRef("pickup", _uuid_or_none(ref.removeprefix(PICKUP_PREFIX)))
        if ref.startswith(RETURN_PREFIX):
            return ShipmentRef("return", _uuid_or_none(ref.removeprefix(RETURN_PREFIX)))
        if ref == LEGACY_KEY:
            return ShipmentRef("legacy", None)
        return ShipmentRef("delivery", _uuid_or_none(ref))


    def _uuid_or_none(raw: str) -> uuid.UUID | None:
        try:
            return uuid.UUID(raw)
        except ValueError:
            return None
