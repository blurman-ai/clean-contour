  code: |
    import type { SavedAddress } from "@/entities/address/model/types";

    export type AddressRef =
      | { kind: "saved"; id: string }
      | { kind: "free_text"; text: string };

    /** What the user entered in the order address field. */
    export function resolveAddressInput(value: string, saved: SavedAddress[]): AddressRef {
      const isFreeText = value.includes(" ");
      if (isFreeText) {
        return { kind: "free_text", text: value.trim() };
      }
      const match = saved.find(address => address.id === value);
      return match
        ? { kind: "saved", id: match.id }
        : { kind: "free_text", text: value };
    }

    export function addressLabel(ref: AddressRef, saved: SavedAddress[]): string {
      if (ref.kind === "free_text") return ref.text;
      return saved.find(address => address.id === ref.id)?.title ?? ref.id;
    }

