      address: string;
      comment?: string;
    };

    export function isPalletShipment(draft: ParcelDraft): boolean {
      return draft.weightUnit === "pallets";
    }

    export function requiredDocuments(draft: ParcelDraft): string[] {
      const docs = ["invoice"];
      if (isPalletShipment(draft)) {
        docs.push("loading-plan");
      }
      if (draft.quantity > 20) {
        docs.push("manifest");
      }
      return docs;
    }

