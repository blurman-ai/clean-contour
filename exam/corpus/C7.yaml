  why: The waybill column labels are declared in the single parse* function; this is the card's exception "module where the label is declared"; the rest of the code receives ready strings.
  source: Waybill table parsing where the weight and address columns are found by the header. By form.
  code: |
    export type WaybillLine = {
      address: string;
      weightKg: number;
      quantity: number;
    };

    /** Waybill rows from the headers and the cells of the table. */
    export function parseWaybillTable(headers: string[], rows: string[][]): WaybillLine[] {
      const weightCol = headers.indexOf("Weight, kg");
      const quantityCol = headers.indexOf("Quantity");
      const addressCol = headers.findIndex(title => title.trim() === "Delivery address");
      if (weightCol < 0 || quantityCol < 0 || addressCol < 0) {
        return [];
      }
      return rows
        .filter(row => row.some(cell => cell.trim() !== ""))
        .map(row => ({
          address: row[addressCol].trim(),
          weightKg: Number(row[weightCol].replace(",", ".")) || 0,
          quantity: Number.parseInt(row[quantityCol], 10) || 0,
        }));
    }

    export function totalWeight(lines: WaybillLine[]): number {
      return lines.reduce((sum, line) => sum + line.weightKg * line.quantity, 0);
    }

