  source: Grouping the event log by shipments, where the kind of the group is read from the key prefix.
  code: |
    from collections import defaultdict
    import uuid
    from typing import Any


    def _uuid(raw: str) -> uuid.UUID | None:
        try:
            return uuid.UUID(raw)
        except ValueError:
            return None


    def event_ids_by_shipment(
        events: list[Any], account_id: uuid.UUID
    ) -> dict[uuid.UUID, set[Any]]:
        """Ids of the journal events each shipment left; pointers only."""

        result: dict[uuid.UUID, set[Any]] = defaultdict(set)
        for key, bucket in _bucket_events(events).items():
            if key.startswith("pickup:"):
                shipment_id = _uuid(key.removeprefix("pickup:"))
            elif key == "legacy-initial":
                shipment_id = _legacy_shipment_id(account_id)
            else:
                shipment_id = _uuid(str(getattr(bucket[0], "id", "")))
            if shipment_id is None:
                continue
            result[shipment_id].update(
                event_id
                for event_id in (getattr(event, "id", None) for event in bucket)
                if event_id is not None
            )
        return result
- id: C7-08
  card: C7
  expected: clean
  path: app/shipping/address_match.py
  why: The character ranges in the regular expression serve as an alphabet for parsing address words and say nothing about the kind of the object.
  source: Address tokenization for comparing two records by common words.
  code: |
    import re

    _WORD = re.compile(r"[0-9a-z]+", re.IGNORECASE)

    _STOPWORDS = frozenset(
        {"and", "in", "on", "by", "to", "with", "st", "bldg", "b", "apt", "the", "of"}
    )


    def address_tokens(text: str) -> list[str]:
        words = _WORD.findall(text.lower().replace("é", "e"))
        return [word for word in words if word not in _STOPWORDS and len(word) > 1]


    def address_overlap(left: str, right: str) -> float:
        """Share of common words, 0.0 when either address has no usable words."""

        a = set(address_tokens(left))
        b = set(address_tokens(right))
        if not a or not b:
            return 0.0
        return len(a & b) / min(len(a), len(b))


    def same_address(left: str, right: str, threshold: float = 0.8) -> bool:
        return address_overlap(left, right) >= threshold
