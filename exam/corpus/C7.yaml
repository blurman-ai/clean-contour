  code: |
    from dataclasses import dataclass, field


    @dataclass
    class Document:
        id: str
        doc_type: str  # "waybill" | "cmr" | "invoice"
        attachments: list[str] = field(default_factory=list)


    def required_attachments(doc: Document) -> list[str]:
        """Names of the attachments the document must carry."""
        if doc.id.startswith("ttn-"):
            return ["driver_license", "vehicle_permit"]
        if doc.id.startswith("cmr-"):
            return ["customs_declaration"]
        return []


    def missing_attachments(doc: Document) -> list[str]:
        have = set(doc.attachments)
        return [name for name in required_attachments(doc) if name not in have]


    def can_be_sent(doc: Document) -> bool:
        return not missing_attachments(doc)

