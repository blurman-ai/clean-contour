  source: Building route cards where an unnamed stop is recognized by the title text.
  code: |
    from app.shipping.models import Route, Stop

    def build_stop_cards(route: Route) -> list[dict]:
        cards: list[dict] = []
        for index, stop in enumerate(route.stops, start=1):
            title = (stop.title or "").strip()
            if not title or title.casefold() == "unnamed stop":
                title = f"Stop {index}"
            cards.append(
                {
                    "id": str(stop.id),
                    "title": title,
                    "eta": stop.eta.isoformat() if stop.eta else None,
                    "parcels": len(stop.parcels),
                }
            )
        return cards


    def first_named_stop(route: Route) -> Stop | None:
        for stop in route.stops:
            title = (stop.title or "").strip()
            if title and title.casefold() != "unnamed stop":
                return stop
        return None


    def route_headline(route: Route) -> str:
        stop = first_named_stop(route)
        if stop is None:
            return f"Route {route.number}"
        return f"Route {route.number} · {stop.title}"
