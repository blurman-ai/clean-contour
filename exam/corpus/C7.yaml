  code: |
    export type DeliveryOption = {
      id: string;
      type: "courier" | "pickup_point" | "locker";
      label: string;
      priceKopecks: number;
      etaDays: number;
    };

    function isCourierOption(option: DeliveryOption): boolean {
      return option.label.toLowerCase().includes("courier");
    }

    export function needsAddressForm(option: DeliveryOption): boolean {
      return isCourierOption(option);
    }

    export function sortOptions(options: DeliveryOption[]): DeliveryOption[] {
      return [...options].sort((a, b) => a.priceKopecks - b.priceKopecks);
    }

    export function optionSubtitle(option: DeliveryOption): string {
      const days = option.etaDays === 1 ? "1 day" : `${option.etaDays} days`;
      const price = (option.priceKopecks / 100).toFixed(0);
      return needsAddressForm(option)
        ? `${days} · to the door · ${price} ₽`
        : `${days} · ${price} ₽`;
    }

    export function defaultOption(options: DeliveryOption[]): DeliveryOption | null {
      const sorted = sortOptions(options);
      return sorted.find(option => !isCourierOption(option)) ?? sorted[0] ?? null;
    }
- id: C7-13
  card: C7
  expected: dirty
  path: app/services/courier_payroll.py
  why: The courier contract kind is determined by the start of the name, although the courier has a stored contract_kind field.
  source: Courier tax regime calculation where the contract kind is read from the name text. By form.
  code: |
    from dataclasses import dataclass
    from decimal import Decimal


    @dataclass
    class Courier:
        id: str
        full_name: str
        contract_kind: str  # "self_employed" | "company" | "employee"
        rate_per_stop: Decimal


    def courier_tax_regime(courier: Courier) -> str:
        """Tax regime used for the courier's payout."""
        name = courier.full_name.strip()
        if name.startswith("SP "):
            return "self_employed"
        if name.startswith(("LLC ", "JSC ")):
            return "company"
        return "employee"


    def payout_for_shift(courier: Courier, stops_done: int) -> Decimal:
        # withholding for employees is applied before the payout is issued
        gross = courier.rate_per_stop * stops_done
        regime = courier_tax_regime(courier)
        if regime == "employee":
            return (gross * Decimal("0.87")).quantize(Decimal("0.01"))
        return gross.quantize(Decimal("0.01"))

- id: C7-14
  card: C7
  expected: clean
  path: src/shipping/lib/entityRef.ts
  why: The reference prefixes are declared in one module and read by a single parse function; this is the card's exception for the declaring module.
  source: Entity reference format module with the declaration of prefixes and parsing. By form.
  code: |
    // Reference format: prefix and identifier.
    const ROUTE_PREFIX = "route:";
    const DEPOT_PREFIX = "depot:";

    export type EntityRef =
      | { kind: "route"; id: string }
      | { kind: "depot"; id: string }
      | { kind: "unknown"; id: string };

    export function formatRouteRef(id: string): string {
      return `${ROUTE_PREFIX}${id}`;
    }

    export function formatDepotRef(id: string): string {
      return `${DEPOT_PREFIX}${id}`;
    }

    export function parseEntityRef(ref: string): EntityRef {
      if (ref.startsWith(ROUTE_PREFIX)) {
        return { kind: "route", id: ref.slice(ROUTE_PREFIX.length) };
      }
      if (ref.startsWith(DEPOT_PREFIX)) {
        return { kind: "depot", id: ref.slice(DEPOT_PREFIX.length) };
      }
      return { kind: "unknown", id: ref };
    }

