  why: The service option of a tariff is recognized by the label "Other", although the option has a stored is_custom flag.
  source: Selection of tariff options for choosing, where the service option is discarded by the label text. By form.
  code: |
    from dataclasses import dataclass


    @dataclass
    class TariffOption:
        id: str
        label: str
        price_kopecks: int
        is_custom: bool = False


    def selectable_tariff_options(options: list[TariffOption]) -> list[TariffOption]:
        """Options offered in the tariff picker."""
        return [item for item in options if item.label.strip().lower() != "other"]


    def cheapest(options: list[TariffOption]) -> TariffOption | None:
        pool = selectable_tariff_options(options)
        return min(pool, key=lambda item: item.price_kopecks, default=None)


    def option_caption(option: TariffOption) -> str:
        rubles = option.price_kopecks // 100
        return f"{option.label}, {rubles} ₽"

- id: C7-22
  card: C7
  expected: clean
  path: app/imports/flag_values.py
  why: The strings on and off parse the flag value from the import file; the branch does not decide what the object is, and no kind is assigned to anything.
  source: Parsing a boolean value of a cell on import, where the allowed strings include words of the natural language. By form.
  code: |
    TRUE_VALUES = {"true", "1", "yes", "y", "on"}
    FALSE_VALUES = {"false", "0", "no", "n", "off"}


    class FlagValueError(ValueError):
        pass


    def parse_flag(raw: str | None, *, default: bool | None = None) -> bool:
        """Read a yes/no cell of the import file."""
        if raw is None or raw.strip() == "":
            if default is None:
                raise FlagValueError("flag value is empty")
            return default
        normalized = raw.strip().lower()
        if normalized in TRUE_VALUES:
            return True
        if normalized in FALSE_VALUES:
            return False
        raise FlagValueError(f"unknown flag value: {raw!r}")


    def parse_row_flags(row: dict[str, str]) -> dict[str, bool]:
        return {
            "fragile": parse_flag(row.get("fragile"), default=False),
            "insured": parse_flag(row.get("insured"), default=False),
        }
