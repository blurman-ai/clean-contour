  why: The column role is determined by the header text, and a section row is recognized by the empty cells of the other columns.
  source: Waybill table rendering where the column role is determined by the header.
  code: |
    from dataclasses import dataclass


    @dataclass
    class TableBlock:
        columns: list[str]
        rows: list[list[str]]


    def section_title_row(columns: list[str], row: list[str]) -> bool:
        """A row with text only in the name column is a section heading."""
        for index, cell in enumerate(row):
            if columns[index] != "Item name" and cell.strip():
                return False
        return True


    def render_invoice_rows(block: TableBlock) -> list[dict]:
        result: list[dict] = []
        part: list[list[str]] = []

        def flush() -> None:
            if part:
                result.append({"type": "table", "columns": block.columns, "rows": list(part)})
                part.clear()

        for row in block.rows:
            if section_title_row(block.columns, row):
                flush()
                name_col = block.columns.index("Item name")
                result.append(
                    {"type": "subheading", "text": row[name_col].strip(), "level": 2}
                )
            else:
                part.append(row)
        flush()
        return result
