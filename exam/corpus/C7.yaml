- id: C7-10
  card: C7
  expected: dirty
  path: src/shipping/lib/routeSummary.ts
  why: The service nature of a stop title is determined by a regular expression over natural-language words and by comparison with an id.
  source: Function that selects stop titles to show to the client, recognizing placeholders by text.
  code: |
    type StopLike = { id: string; title: string; address: string };

    /** We do not show placeholders like "Spot 1" or "Stop 2" to the client. */
    export function isGenericStopTitle(title: string, stopId: string): boolean {
      const normalized = title.trim();
      if (!normalized) return true;
      if (normalized === stopId) return true;
      if (/^(spot|halt|stop|point)\s*[#№-]?\s*\d+$/i.test(normalized)) {
        return true;
      }
      return false;
    }

    export function readableStops(stops: StopLike[]): StopLike[] {
      return stops.filter(stop => !isGenericStopTitle(stop.title, stop.id));
    }

    export function routeSummary(stops: StopLike[]): string {
      const named = readableStops(stops);
      if (named.length === 0) {
        return `${stops.length} stops`;
      }
      const first = named[0].title;
      const last = named[named.length - 1].title;
      return named.length === 1 ? first : `${first} → ${last}`;
    }
