  code: |
    import type { TFunction } from "i18next";

    type ShipmentKind = "parcel" | "pallet" | "envelope";

    type Shipment = {
      id: string;
      kind: ShipmentKind;
      title?: string;
      quantity: number;
      status: "new" | "in_transit" | "delivered";
    };

    const KIND_LABELS: Record<ShipmentKind, string> = {
      parcel: "Parcel",
      pallet: "Pallet",
      envelope: "Envelope",
    };

    export function kindLabel(kind: ShipmentKind): string {
      return KIND_LABELS[kind];
    }

    export function shipmentTitle(shipment: Shipment): string {
      const base = kindLabel(shipment.kind);
      if (shipment.kind === "pallet") {
        return `${base} · ${shipment.quantity} pcs.`;
      }
      return shipment.title ? `${base} «${shipment.title}»` : base;
    }

    export function statusChipText(shipment: Shipment, tr: TFunction): string {
      switch (shipment.status) {
        case "new":
          return tr("shipment.status.new", { defaultValue: "Accepted" });
        case "in_transit":
          return tr("shipment.status.inTransit", { defaultValue: "On the way" });
        default:
          return tr("shipment.status.delivered", { defaultValue: "Delivered" });
      }
    }
