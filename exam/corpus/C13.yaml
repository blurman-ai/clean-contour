  why: The hint response is applied only to the keys the user has not touched yet, that is, what they changed is not overwritten and the precedence rule exists.
  source: slot booking form where the server hint is applied only to fields without user edits, by form
  code: |
    const SUGGESTED_KEYS = ["dock", "timeFrom", "timeTo"] as const;

    export function SlotBookingForm({ warehouseId }: { warehouseId: string }) {
      const suggestion = useSlotSuggestionQuery(warehouseId).data;
      const [form, setForm] = useState<SlotForm>(emptySlotForm);
      const touchedRef = useRef(new Set<keyof SlotForm>());

      const setField = <K extends keyof SlotForm>(key: K, value: SlotForm[K]) => {
        touchedRef.current.add(key);
        setForm(prev => ({ ...prev, [key]: value }));
      };

      // The hint offers a free gate and the nearest time.
      useEffect(() => {
        if (!suggestion) return;
        setForm(prev => {
          const next = { ...prev };
          for (const key of SUGGESTED_KEYS) {
            if (!touchedRef.current.has(key)) next[key] = suggestion[key];
          }
          return next;
        });
      }, [suggestion]);

      return (
        <Stack>
          <DockSelect value={form.dock} onChange={v => setField("dock", v)} />
          <TimeInput value={form.timeFrom} onChange={e => setField("timeFrom", e.currentTarget.value)} />
          <TimeInput value={form.timeTo} onChange={e => setField("timeTo", e.currentTarget.value)} />
        </Stack>
      );
    }
