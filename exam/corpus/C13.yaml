  card: C13
  expected: dirty
  path: src/widgets/shipment-builder/model/useHintExtract.ts
  why: The server response unconditionally selects parameters through onSelect, although the user can select them while the request is running; only the create button is blocked (questions 1-3).
  source: request text parsing hook that applies the found values to the parameter choice after the network response
  code: |
    export function useHintExtract({ prompt, onSelect }: UseHintExtractArgs) {
      const [status, setStatus] = useState<"idle" | "pending" | "ready">("idle");
      const seqRef = useRef(0);
      const onSelectRef = useRef(onSelect);

      useEffect(() => {
        onSelectRef.current = onSelect;
      }, [onSelect]);

      const trimmed = prompt.trim();

      useEffect(() => {
        if (trimmed.length < 8) {
          setStatus("idle");
          return;
        }
        const seq = ++seqRef.current;
        setStatus("pending");
        const timer = window.setTimeout(async () => {
          try {
            const response = await extractShipmentHints({ prompt: trimmed });
            if (seqRef.current !== seq) return;
            for (const hint of response.hints) {
              onSelectRef.current(hint.field, hint.value);
            }
          } finally {
            if (seqRef.current === seq) setStatus("ready");
          }
        }, 650);
        return () => window.clearTimeout(timer);
      }, [trimmed]);

      return { status, createBlocked: status === "pending" };
    }

    // Screen: the button waits for the parse, the parameter choice is always available
    // <ParamChips value={params} onChange={setParam} />
    // <Button disabled={hint.createBlocked}>Create shipment</Button>
