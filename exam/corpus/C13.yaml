  why: When the previous order arrives, an effect writes the rows, the comment and the slot into dialog fields that are open for input, and there is no rule about who wins (questions 1-3).
  source: order repeat dialog into which an effect substitutes the data of the previous order when it arrives, by form
  code: |
    export function RepeatOrderDialog({ opened, orderId, onClose, onCreate }: RepeatOrderDialogProps) {
      const { data: previous } = usePreviousOrderQuery(orderId, opened);
      const [lines, setLines] = useState<OrderLine[]>([]);
      const [comment, setComment] = useState("");
      const [slot, setSlot] = useState<string | null>(null);

      // We take the rows and the slot from the previous order so as not to enter them again.
      useEffect(() => {
        if (!opened || !previous) return;
        setLines(previous.lines);
        setComment(previous.comment ?? "");
        setSlot(previous.delivery_slot);
      }, [opened, previous]);

      const submit = () => {
        onCreate({ lines, comment: comment.trim() || undefined, slot });
        onClose();
      };

      return (
        <Modal opened={opened} onClose={onClose} title="Repeat order">
          <OrderLinesEditor lines={lines} onChange={setLines} />
          <Textarea
            label="Comment"
            value={comment}
            onChange={e => setComment(e.currentTarget.value)}
          />
          <SlotSelect value={slot} onChange={setSlot} />
          <Button mt="md" onClick={submit} disabled={lines.length === 0}>
            Create order
          </Button>
        </Modal>
      );
    }
