  card: C13
  expected: clean
  path: src/widgets/inspection-builder/model/useInspectionReview.ts
  why: The form is hidden behind an indicator until the response arrives, and after the first display later responses do not overwrite it, that is, the fields are locked until the response.
  source: check screen hook with polling of the prefill and a first-display flag of the form
  code: |
    export function useInspectionReview(inspectionId: string | null | undefined) {
      const [response, setResponse] = useState<InspectionContentResponse | null>(null);
      const [draft, setDraft] = useState<InspectionContent | null>(null);
      const [edited, setEdited] = useState(false);
      // The form has been shown at least once: from now on server responses do not overwrite it.
      const [settled, setSettled] = useState(false);
      const settledRef = useRef(false);

      const enabled = Boolean(inspectionId);

      useEffect(() => {
        settledRef.current = false;
        setSettled(false);
        return () => {
          settledRef.current = false;
        };
      }, [inspectionId]);

      const query = useQuery({
        queryKey: queryKeys.inspectionReview(inspectionId ?? ""),
        queryFn: () => getInspectionContent(inspectionId!),
        enabled,
        refetchInterval: q =>
          !settledRef.current && isFillInProgress(q.state.data) ? 2_000 : false,
      });

      useEffect(() => {
        const next = query.data;
        if (!enabled || !next || settledRef.current) return;
        if (isFillInProgress(next)) return;
        settledRef.current = true;
        setSettled(true);
        setResponse(next);
        setDraft(next.content);
        setEdited(false);
      }, [enabled, query.data]);

      // While settled is false, the screen shows an indicator, not the fields.
      const loading = enabled && !settled && !query.isError;

      const updateDraft = useCallback(
        (updater: (previous: InspectionContent) => InspectionContent) => {
          setDraft(previous => (previous ? updater(previous) : previous));
          setEdited(true);
        },
        [],
      );

      return { response, draft, edited, loading, updateDraft };
    }
- id: C13-06
  card: C13
  expected: clean
  path: src/widgets/shipment-builder/model/useWizardAnswers.ts
  why: The parse response fills only the unfilled fields and does not touch manual edits, that is, the precedence rule is declared (question 3 is no).
  source: wizard hook that substitutes the answers of the text parse into the fields not yet filled by the user
  code: |
    export function useWizardAnswers(args: {
      enabled: boolean;
      format: WizardFormatId | null;
      prefillResponse?: HintsExtractResponse | null;
    }) {
      const { enabled, format, prefillResponse } = args;
      const [answers, setAnswers] = useState<WizardAnswers>({});
      const [prefillKey, setPrefillKey] = useState<string | null>(null);
      const [handEditedFields, setHandEditedFields] = useState<
        ReadonlySet<WizardFieldId>
      >(() => new Set());

      // The parse of the application text returns the found answers. We substitute only
      // the fields the author has not answered yet: a manual edit always wins.
      // This is a state adjustment during render, not an effect.
      if (enabled && format && prefillResponse) {
        const key = hintsResponseKey(prefillResponse);
        if (key !== prefillKey) {
          setPrefillKey(key);
          const seeded = seededAnswersFromResponse(format, prefillResponse);
          if (Object.keys(seeded).length > 0) {
            setAnswers(prev => mergeSeededAnswers(prev, seeded, handEditedFields));
          }
        }
      }

      const editField = useCallback((fieldId: WizardFieldId, value: AnswerValue) => {
        setHandEditedFields(prev => {
          if (prev.has(fieldId)) return prev;
          return new Set([...prev, fieldId]);
        });
        setAnswers(prev => ({ ...prev, [fieldId]: value }));
      }, []);

      return { answers, editField };
    }

    export function mergeSeededAnswers(
      existing: WizardAnswers,
      seeded: WizardAnswers,
      lockedFieldIds: ReadonlySet<WizardFieldId> = new Set(),
    ): WizardAnswers {
      const next = { ...existing };
      for (const [fieldId, answer] of Object.entries(seeded)) {
        const id = fieldId as WizardFieldId;
        if (!lockedFieldIds.has(id) && !isFilled(next[id])) {
          next[id] = answer;
        }
      }
      return next;
    }
