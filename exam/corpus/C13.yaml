  why: The values from the server serve as a base, and what the user changed lies in a separate edited object and stands last in the merge, that is, the user's choice wins over the response.
  source: settings form where the form values are assembled from the defaults, the server response and the user's edits in that order, by form
  code: |
    const DEFAULT_SETTINGS: DispatchSettings = {
      maxStopsPerRoute: 25,
      autoAssign: true,
      notifyBeforeMin: 15,
    };

    export function DispatchSettingsForm() {
      const settingsQuery = useDispatchSettingsQuery();
      const saveMutation = useSaveDispatchSettingsMutation();
      const [edited, setEdited] = useState<Partial<DispatchSettings>>({});

      // The user's edit overrides the server response, even if it arrived later.
      const values: DispatchSettings = {
        ...DEFAULT_SETTINGS,
        ...settingsQuery.data,
        ...edited,
      };

      const update = <K extends keyof DispatchSettings>(key: K, value: DispatchSettings[K]) =>
        setEdited(prev => ({ ...prev, [key]: value }));

      return (
        <Stack>
          <NumberInput
            label="Stops per route"
            value={values.maxStopsPerRoute}
            onChange={v => update("maxStopsPerRoute", Number(v))}
          />
          <Switch
            label="Assign couriers automatically"
            checked={values.autoAssign}
            onChange={e => update("autoAssign", e.currentTarget.checked)}
          />
          <Button
            loading={saveMutation.isPending}
            onClick={() => saveMutation.mutate(values, { onSuccess: () => setEdited({}) })}
          >
            Save
          </Button>
        </Stack>
      );
    }
