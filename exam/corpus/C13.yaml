    export function StopPicker({ routeId, onConfirm }: StopPickerProps) {
      const { data: stops = [] } = useRouteStopsQuery(routeId);
      const [selected, setSelected] = useState<Set<string>>(new Set());
      const suggest = useSuggestStopsMutation(routeId);

      // The hint picks the stops that are more convenient to visit together.
      useEffect(() => {
        suggest.mutate(undefined, {
          onSuccess: res => setSelected(new Set(res.stop_ids)),
        });
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [routeId]);

      const toggle = (id: string) =>
        setSelected(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          return next;
        });

      return (
        <Stack>
          {stops.map(stop => (
            <Checkbox
              key={stop.id}
              label={stop.address}
              checked={selected.has(stop.id)}
              onChange={() => toggle(stop.id)}
            />
          ))}
          <Button disabled={selected.size === 0} onClick={() => onConfirm([...selected])}>
            Confirm stops
          </Button>
        </Stack>
      );
    }
