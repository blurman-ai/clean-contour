    export function ParcelFilters({ onChange }: { onChange: (filters: ParcelFilterValue) => void }) {
      const presetQuery = useSavedFilterPresetQuery();
      const [statuses, setStatuses] = useState<ParcelStatus[]>([]);
      const [carrierId, setCarrierId] = useState<string | null>(null);
      const [period, setPeriod] = useState<[Date | null, Date | null]>([null, null]);

      // The filter set is stored on the server separately for each dispatcher.
      useEffect(() => {
        const preset = presetQuery.data;
        if (!preset) return;
        setStatuses(preset.statuses);
        setCarrierId(preset.carrier_id);
        setPeriod([parseDate(preset.from), parseDate(preset.to)]);
      }, [presetQuery.data]);

      useEffect(() => {
        onChange({ statuses, carrierId, period });
      }, [statuses, carrierId, period, onChange]);

      return (
        <Group>
          <Chip.Group multiple value={statuses} onChange={v => setStatuses(v as ParcelStatus[])}>
            {PARCEL_STATUS_OPTIONS.map(option => (
              <Chip key={option.value} value={option.value}>
                {option.label}
              </Chip>
            ))}
          </Chip.Group>
          <CarrierSelect value={carrierId} onChange={setCarrierId} />
          <DatePickerInput type="range" value={period} onChange={setPeriod} />
        </Group>
      );
    }
