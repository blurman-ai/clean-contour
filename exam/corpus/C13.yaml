    export function useCourierSuggestions(order: Order) {
      const [selectedCouriers, setSelectedCouriers] = useState<string[]>([]);
      const [loaded, setLoaded] = useState(false);

      useEffect(() => {
        setSelectedCouriers([]);
        setLoaded(false);
        suggestCouriers(order.id).then(list => {
          setSelectedCouriers(list.map(courier => courier.id));
          setLoaded(true);
        });
      }, [order.id]);

      const toggle = useCallback((courierId: string) => {
        setSelectedCouriers(prev =>
          prev.includes(courierId)
            ? prev.filter(id => id !== courierId)
            : [...prev, courierId],
        );
      }, []);

      return { selectedCouriers, toggle, loaded };
    }

    export function CourierPicker({ order }: { order: Order }) {
      const { selectedCouriers, toggle, loaded } = useCourierSuggestions(order);
      const couriers = useCouriersQuery(order.zoneId);

      return (
        <Stack>
          {!loaded ? <Text size="xs">Looking for suitable couriers…</Text> : null}
          {(couriers.data ?? []).map(courier => (
            <Checkbox
              key={courier.id}
              label={courier.name}
              checked={selectedCouriers.includes(courier.id)}
              onChange={() => toggle(courier.id)}
            />
          ))}
          <Button onClick={() => void assign(order.id, selectedCouriers)}>Assign</Button>
        </Stack>
      );
    }
