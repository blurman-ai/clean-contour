    export function CourierDefaultsForm({ courierId }: { courierId: string }) {
      const defaultsQuery = useCourierDefaultsQuery(courierId);
      const [vehicle, setVehicle] = useState<string | null>(null);
      const [shiftStart, setShiftStart] = useState("");
      const [zoneIds, setZoneIds] = useState<string[]>([]);
      const appliedRef = useRef(false);

      useEffect(() => {
        const defaults = defaultsQuery.data;
        if (!defaults || appliedRef.current) return;
        appliedRef.current = true;
        setVehicle(defaults.vehicle_type);
        setShiftStart(defaults.shift_start);
        setZoneIds(defaults.zone_ids);
      }, [defaultsQuery.data]);

