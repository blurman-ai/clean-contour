  why: The then chain after the product card request writes the weight and dimensions into fields that the storekeeper enters himself, and the cancellation in the effect works only when the article changes (questions 1-3).
  source: pallet fields filled by the product card request response through then, by form
  code: |
    export function PalletSizeFields({ sku }: { sku: string }) {
      const [weightKg, setWeightKg] = useState("");
      const [lengthCm, setLengthCm] = useState("");
      const [widthCm, setWidthCm] = useState("");
      const [heightCm, setHeightCm] = useState("");

      // The pallet dimensions are taken from the product reference.
      useEffect(() => {
        if (sku.length < 6) return;
        let cancelled = false;
        // We postpone the request until the article is entered completely.
        const timer = setTimeout(() => {
          fetchSkuCard(sku)
            .then(card => {
              if (cancelled) return;
              setWeightKg(String(card.unit_weight_kg));
              setLengthCm(String(card.length_cm));
              setWidthCm(String(card.width_cm));
              setHeightCm(String(card.height_cm));
            })
            .catch(() => {
              if (!cancelled) notifications.show({ message: "Product card not found" });
            });
        }, 400);
        return () => {
          cancelled = true;
          clearTimeout(timer);
        };
      }, [sku]);

      return (
        <SimpleGrid cols={2}>
          <NumberInput label="Weight, kg" value={weightKg} onChange={v => setWeightKg(String(v))} />
          <NumberInput label="Length, cm" value={lengthCm} onChange={v => setLengthCm(String(v))} />
          <NumberInput label="Width, cm" value={widthCm} onChange={v => setWidthCm(String(v))} />
          <NumberInput label="Height, cm" value={heightCm} onChange={v => setHeightCm(String(v))} />
        </SimpleGrid>
      );
    }
