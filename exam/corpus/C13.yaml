  why: The autosave response writes only the revision number and the save time for display, and does not touch the form fields that the user enters.
  source: form autosave hook where the request response is written into the revision and the save time label, by form
  code: |
    export function useAutosave(draftId: string, values: DraftValues) {
      const [revision, setRevision] = useState<number | null>(null);
      const [savedAt, setSavedAt] = useState<Date | null>(null);
      const saveMutation = useSaveDraftMutation(draftId);

      const debounced = useDebouncedValue(values, 1_200);

      useEffect(() => {
        saveMutation.mutate(
          { values: debounced, baseRevision: revision },
          {
            onSuccess: res => {
              setRevision(res.revision);
              setSavedAt(new Date(res.saved_at));
            },
          },
        );
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [debounced]);

      return {
        savedAt,
        isSaving: saveMutation.isPending,
        hasError: saveMutation.isError,
      };
    }
