    export function ShippingQuoteForm({ parcel }: { parcel: ParcelSummary }) {
      const [weightKg, setWeightKg] = useState(String(parcel.weight_kg));
      const [zone, setZone] = useState<string | null>(parcel.zone);
      const [quote, setQuote] = useState("");
      const quoteMutation = useQuoteMutation();

      // The cost is calculated by the server from the weight and the delivery zone.
      const requestQuote = () =>
        quoteMutation.mutate(
          { weightKg: Number(weightKg), zone },
          {
            onSuccess: res => setQuote(formatMoney(res.total, res.currency)),
            onError: () => setQuote(""),
          },
        );

      return (
        <Stack>
          <NumberInput label="Weight, kg" value={weightKg} onChange={v => setWeightKg(String(v))} />
          <ZoneSelect value={zone} onChange={setZone} />
          <Button onClick={requestQuote} loading={quoteMutation.isPending} disabled={!zone}>
            Calculate
          </Button>
          <TextInput label="Cost" value={quote} readOnly />
        </Stack>
      );
    }
