  code: |
    export function SectorSelection({ onComplete }: { onComplete: () => void }) {
      const catalogQuery = useSectorCatalogQuery();
      const currentQuery = useCurrentSectorQuery();
      const updateMutation = useUpdateSectorMutation();
      const [draft, setDraft] = useState<SectorDraft | null>(null);
      const [saveError, setSaveError] = useState<string | null>(null);

      const options = catalogQuery.data?.items ?? [];
      // The user's draft takes precedence over the value saved on the server.
      const selectedKey = draft?.selectedKey ?? currentQuery.data?.primary_sector_id ?? null;
      const otherText = draft?.otherText ?? currentQuery.data?.primary_sector_other_text ?? "";
      const selectedOther = selectedKey === OTHER_SECTOR_KEY;
      const trimmedOtherText = otherText.trim();
      const canSave =
        Boolean(selectedKey) &&
        (!selectedOther || trimmedOtherText.length > 0) &&
        !updateMutation.isPending;

      function applyDraft(next: SectorDraft) {
        setDraft(next);
        setSaveError(null);
      }

      async function handleSave() {
        if (!selectedKey || !canSave) return;
        setSaveError(null);
        try {
          await updateMutation.mutateAsync({
            primary_sector_id: selectedKey,
            primary_sector_other_text: selectedOther ? trimmedOtherText : null,
          });
          onComplete();
        } catch (error) {
          setSaveError(getSectorErrorMessage(error));
        }
      }

      if (catalogQuery.isPending || currentQuery.isPending) return <Loader />;
      return (
        <SectorCards
          options={options}
          selectedKey={selectedKey}
          otherText={otherText}
          onChange={applyDraft}
          onSave={() => void handleSave()}
          canSave={canSave}
          error={saveError}
        />
      );
    }
