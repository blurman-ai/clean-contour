  source: applying the request parse response to groups of settings with a check that the setting is not yet chosen
  code: |
    export function collectHintPatches(
      selected: Record<ProfileKey, string>,
      answered: readonly AnsweredItem[],
    ): Array<{ key: ProfileKey; id: string }> {
      const optionIdsByKey = new Map(
        PROFILE_ORDER.map(key => [
          key,
          new Set(listProfileOptions(selected.deliveryType, key).map(option => option.id)),
        ]),
      );

      const patches: Array<{ key: ProfileKey; id: string }> = [];
      const seen = new Set<ProfileKey>();

      for (const item of answered) {
        if (!isProfileKey(item.question_id)) continue;
        if (seen.has(item.question_id)) continue;
        // The user's choice wins over the parse response.
        if (selected[item.question_id] !== "default") continue;

        const candidate = (item.value ?? "").trim();
        const allowed = optionIdsByKey.get(item.question_id);
        if (!candidate || !allowed?.has(candidate)) continue;

        patches.push({ key: item.question_id, id: candidate });
        seen.add(item.question_id);
      }
      return patches;
    }

    // In the hook, after the server response
    const applyHints = (answered: readonly AnsweredItem[]) => {
      const patches = collectHintPatches(selectedRef.current, answered);
      for (const patch of patches) {
        selectedRef.current = { ...selectedRef.current, [patch.key]: patch.id };
        onPickProfileRef.current(patch.key, patch.id);
      }
    };
