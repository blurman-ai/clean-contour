    export function PriceRowsEditor({ priceListId }: { priceListId: string }) {
      const [rows, setRows] = useState<PriceRow[]>([]);
      const [fileName, setFileName] = useState<string | null>(null);
      const parseMutation = useParsePriceFileMutation(priceListId);

      const updateCell = (index: number, field: keyof PriceRow, value: string) =>
        setRows(prev =>
          prev.map((row, i) => (i === index ? { ...row, [field]: value } : row)),
        );

      const addRow = () => setRows(prev => [...prev, emptyPriceRow()]);

      const handleFile = (file: File) => {
        setFileName(file.name);
        parseMutation.mutate(file, {
          onSuccess: data => {
            setRows(data.rows);
          },
        });
      };

      return (
        <Stack>
          <FileDrop onFile={handleFile} loading={parseMutation.isPending} />
          {fileName ? <Text size="xs">{fileName}</Text> : null}
          <Table>
            <Table.Tbody>
              {rows.map((row, index) => (
                <Table.Tr key={index}>
                  <Table.Td>
                    <TextInput
                      value={row.sku}
                      onChange={e => updateCell(index, "sku", e.currentTarget.value)}
                    />
                  </Table.Td>
                  <Table.Td>
                    <TextInput
                      value={row.price}
                      onChange={e => updateCell(index, "price", e.currentTarget.value)}
                    />
                  </Table.Td>
                </Table.Tr>
              ))}
            </Table.Tbody>
          </Table>
          <Button variant="default" onClick={addRow}>Add row</Button>
          <Button onClick={() => void savePriceRows(priceListId, rows)}>Save</Button>
        </Stack>
      );
    }
