  source: hook that restores a saved set of settings and does not overwrite a choice the user has already made
  code: |
    export function useSavedProfiles(userId: string | null, initialDeliveryType?: string) {
      const [profileState, setProfileState] = useState<ProfileState>({
        selected: { ...createDefaultSelection(), deliveryType: initialDeliveryType ?? "parcel" },
        overrides: {},
      });
      const hydratedUserRef = useRef<string | null>(null);
      const initialTypeRef = useRef(initialDeliveryType);

      useEffect(() => {
        if (!userId || hydratedUserRef.current === userId) return;
        hydratedUserRef.current = userId;

        const persistedType = readPersistedDeliveryType(userId);
        const persistedProfiles = readPersistedProfiles(userId);
        if (!persistedType && !persistedProfiles) return;

        setProfileState(current => {
          // The user has already chosen something on the screen: the saved value does not overwrite it.
          if (Object.keys(current.overrides).length > 0) return current;

          const deliveryType =
            initialTypeRef.current ?? persistedType ?? persistedProfiles?.deliveryType ?? null;
          if (!deliveryType) return current;
          const profiles =
            persistedProfiles && persistedProfiles.deliveryType === deliveryType
              ? persistedProfiles
              : null;

          return {
            selected: {
              ...current.selected,
              deliveryType,
              speed: profiles?.speed ?? "default",
              insurance: profiles?.insurance ?? "default",
            },
            overrides: { ...current.overrides, deliveryType: true },
          };
        });
      }, [userId]);

      return { profileState, setProfileState };
    }
