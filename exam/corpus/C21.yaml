    from __future__ import annotations

    from dataclasses import dataclass
    from datetime import datetime


    @dataclass
    class VideoRender:
        state: str
        output_path: str | None
        completed_at: datetime | None
        error: str | None


    def compute_render_state(render):
        if render.completed_at is not None:
            return "ready"
        if render.error:
            return "failed"
        return render.state


    def restart_render(render):
        render.state = "rendering"
        render.error = None
        return compute_render_state(render)


    def render_view(render):
