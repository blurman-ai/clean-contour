    namespace Podcasts;

    public sealed record EnginePayload(
        string State,
        string? AudioPath,
        string? AudioUrl,
        string? Error);

    public static class EnginePayloadState
    {
        public static string Resolve(EnginePayload payload)
        {
            if (payload.State is "failed" or "resource_limit_exceeded")
            {
                return "failed";
            }
            if (!string.IsNullOrEmpty(payload.AudioPath) || !string.IsNullOrEmpty(payload.AudioUrl))
            {
                return "ready";
            }
            return payload.State;
        }

        public static object View(EnginePayload payload) => new
        {
            state = Resolve(payload),
            audioUrl = payload.AudioUrl,
        };
    }

