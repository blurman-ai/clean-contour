  source: Migration that backfills podcast state once.
  code: |
    from __future__ import annotations


    def backfill_podcast_state(conn):
        rows = conn.execute(
            "SELECT id, audio_path, error FROM podcasts WHERE state IS NULL"
        ).fetchall()
        for row in rows:
            if row.error:
                state = "failed"
            elif row.audio_path:
                state = "ready"
            else:
                state = "generating"
            conn.execute(
                "UPDATE podcasts SET state = ? WHERE id = ? AND state IS NULL",
                (state, row.id),
            )
        conn.commit()


    def rollback(conn):
        conn.execute("UPDATE podcasts SET state = NULL WHERE source = 'backfill'")

