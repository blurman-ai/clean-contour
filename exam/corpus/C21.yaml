    from __future__ import annotations

    TERMINAL_ENGINE_STATES = {"failed", "resource_limit_exceeded"}


    def engine_payload_state(payload):
        state = str(payload.get("state") or "").strip().lower()
        if state in TERMINAL_ENGINE_STATES:
