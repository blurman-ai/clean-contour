  why: outputUrl and error are consulted before the stored render status.
  source: TypeScript render status resolver.
  code: |
    export type RenderStatus = "queued" | "processing" | "ready" | "failed";

    export type RenderJob = {
      id: string;
      status: RenderStatus;
      outputUrl?: string;
      error?: string;
      finishedAt?: string;
    };

    export function resolveRenderStatus(job: RenderJob): RenderStatus {
      if (job.outputUrl) {
        return "ready";
      }
      if (job.error) {
        return "failed";
      }
      return job.status;
    }

    export function restartRender(job: RenderJob): RenderStatus {
      job.status = "processing";
      job.error = undefined;
      return resolveRenderStatus(job);
    }

    export function renderJobView(job: RenderJob) {
      return { id: job.id, status: resolveRenderStatus(job), outputUrl: job.outputUrl };
    }

