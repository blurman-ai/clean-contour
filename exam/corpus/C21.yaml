    def resolve_voice_state(attempt):
        if attempt.audio_path:
            return "ready"
        if attempt.state == "failed":
            return "failed"
        return attempt.state


    def retry_voice(attempt, now):
        attempt.state = "generating"
        attempt.started_at = now
        attempt.error = None
        return attempt


