  source: TypeScript render completion writer.
  code: |
    export type RenderStatus = "queued" | "processing" | "ready" | "failed";

    export type RenderJob = {
      status: RenderStatus;
      outputUrl?: string;
      error?: string;
      finishedAt?: string;
    };

    export function completeRender(job: RenderJob, outputUrl: string, finishedAt: string) {
      if (job.status !== "processing") {
        throw new Error("not_processing");
      }
      job.status = "ready";
      job.outputUrl = outputUrl;
      job.finishedAt = finishedAt;
      job.error = undefined;
      return job;
    }

    export function renderStatus(job: RenderJob): RenderStatus {
      return job.status;
    }

